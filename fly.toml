# fly.toml app configuration file generated for bahjah on 2026-07-10T16:57:24Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bahjah'
primary_region = 'iad'

[build]
  dockerfile = 'apps/server/Dockerfile'

[env]
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
