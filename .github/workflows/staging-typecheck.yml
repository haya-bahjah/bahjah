name: Staging Typecheck

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/server

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck server
        run: npx tsc --noEmit --project apps/server/tsconfig.json

      # apps/web has no build step, so nothing else would catch a page that
      # hides itself and never comes back. See the script's header.
      - name: Every page un-hides itself
        run: node scripts/check-page-visibility.js
