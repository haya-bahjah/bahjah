# Render Blueprint — free-tier preview hosting for the bahjah backend.
# Deploy: on render.com, "New" -> "Blueprint", point it at this repo/branch.
# Render provisions all three resources below and wires them together;
# JWT_SECRET is auto-generated, DATABASE_URL/REDIS_URL are wired from the
# database/key-value resources automatically.
#
# Migrations and question-bank seeding now run automatically on every
# container boot (see apps/server/Dockerfile's start:prod script) -- no
# manual shell step needed after the first deploy.
#
# Free-tier caveats (see chat for details): the web service sleeps after
# 15 min idle (~1 min cold start on the next request, which will drop any
# open WebSocket game connections); the free Postgres database expires
# 30 days after creation (14-day grace period to upgrade before data is
# deleted); the free Key Value store has no disk persistence, which is
# fine here since presence/game state are meant to be ephemeral anyway.

services:
  - type: web
    name: bahjah-server
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: WEB_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bahjah-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bahjah-cache
          property: connectionString

  - type: keyvalue
    name: bahjah-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: bahjah-db
    plan: free
    databaseName: bahjah
    user: bahjah
