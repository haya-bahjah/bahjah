<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Trivia Lobby — Bahjah</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="assets/design-system/tokens.css">
<link rel="stylesheet" href="assets/trivia-theme.css">
<link rel="stylesheet" href="assets/design-system/arcade.css">
<style>
  /* Trivia now rides the Bahjah Design System; its own palette, shape
     language and display face live in assets/trivia-theme.css (.tv), the
     same pattern Mafia (.noir) and Knows You Best (.kyb) use. The rules
     below are this page's own layout only. */
  /* Saudi National Day seasonal theme: activates only when a room's
     category selection includes "Saudi National Day" (bank or
     host-authored custom category) -- see assets/trivia-lobby-config.js.
     Token values are the official SND guideline palette from the design
     handoff, unchanged from spec. Every other category keeps the default
     navy/lime theme above untouched. */
  /* Re-pointed at design-system token names during the Trivia migration.
     The old --bg/--surface/--line names are var() aliases in
     assets/trivia-theme.css, so they follow these automatically rather than
     needing a second copy here. */
  [data-event-theme="national"]{
    --surface-page:#002528; --surface-card:#002D36; --surface-raised:#00413C;
    --border-subtle:rgba(106,181,34,.30); --border-strong:rgba(106,181,34,.44);
    --text-primary:#EFEFE8; --text-secondary:#C9DDBF; --text-muted:#A9C8A6;
    --text-on-accent:#002528;
    --pixel-green:#6AB522; --success:#6AB522;
    --trivia-blue:#008949;
  }
  [data-event-theme="national"][data-theme="light"]{
    --surface-page:#F1F5EC; --surface-card:#FFFFFF; --surface-raised:#E4EEDD;
    --border-subtle:rgba(0,137,73,.24); --border-strong:rgba(0,137,73,.38);
    --text-primary:#002528; --text-secondary:#2C4A34; --text-muted:#3F5B45;
    --text-on-accent:#FFFFFF;
    --pixel-green:#008949; --success:#008949;
    --trivia-blue:#008949;
  }
  [data-event-theme="national"] body{
    background-image:
      linear-gradient(45deg, rgba(106,181,34,.05) 25%, transparent 25%, transparent 75%, rgba(106,181,34,.05) 75%),
      linear-gradient(45deg, rgba(106,181,34,.05) 25%, transparent 25%, transparent 75%, rgba(106,181,34,.05) 75%);
    background-size: 64px 64px;
    background-position: 0 0, 32px 32px;
  }
  [data-event-theme="national"][data-theme="light"] body{
    background-image:
      linear-gradient(45deg, rgba(0,137,73,.06) 25%, transparent 25%, transparent 75%, rgba(0,137,73,.06) 75%),
      linear-gradient(45deg, rgba(0,137,73,.06) 25%, transparent 25%, transparent 75%, rgba(0,137,73,.06) 75%);
    background-size: 64px 64px;
    background-position: 0 0, 32px 32px;
  }
  .snd-lockup{ display:none; height:40px; width:auto; margin-top:10px; }
  [data-event-theme="national"] .snd-lockup{ display:inline-block; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.5; min-height:100vh; transition:background .3s ease, color .3s ease; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.1; font-weight:700; }
  .wrap{ max-width:1100px; margin:0 auto; padding-inline:24px; }
  header{ padding-block:18px; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; }
  .brand-logo{ display:block; height:32px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  .back-link{ color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; }
  .back-icon-btn{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); color:var(--text); flex-shrink:0; }
  .back-icon-btn:hover{ border-color:var(--text); }
  [dir="rtl"] .back-icon-btn svg{ transform:scaleX(-1); }
  .back-row{ display:flex; padding-block:10px 0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .theme-btn{ background:none; border:1px solid var(--line); border-radius:50%; width:34px; height:34px; color:var(--text); font-size:15px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; color:var(--text-muted); }
  .switch button{ background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:2px; }
  .switch button.active{ color:var(--accent); }
  .btn{ border:none; border-radius:var(--radius-a); font-weight:700; padding:13px 24px; font-size:15px; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--on-accent); }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .kicker{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  #lobby-gate{ min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #lobby-main{ display:none; padding-block:14px; }

  /* -- Guest join (no account, nickname + optional avatar) -- */
  #guest-entry{ display:none; width:100%; max-width:340px; text-align:center; }
  #guest-avatar{ display:block; width:88px; height:88px; margin:16px auto 6px; border-radius:50%; cursor:pointer; border:3px solid var(--accent); padding:2px; background:var(--surface); overflow:hidden; }
  #guest-entry .avatar-hint{ font-size:12px; color:var(--muted); display:block; margin-bottom:18px; }
  #guest-nickname{ width:100%; padding:14px; border-radius:var(--radius-a); border:1px solid var(--line); background:var(--surface); color:var(--text); font-family:inherit; font-size:15px; text-align:center; margin-bottom:14px; }
  #guest-join-btn{ width:100%; }
  #guest-entry .cfg-error{ min-height:16px; }
  #guest-signin-link{ display:inline-block; margin-top:16px; }

  /* -- Host console (live match monitor, host never navigates away) -- */
  #host-console{ display:none; padding-block:28px; }
  .hc-round-label{ text-align:center; color:var(--muted); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .hc-timer{ text-align:center; font-family:var(--font-display); font-size:56px; font-weight:700; color:var(--accent); margin-block:8px 4px; }
  .timer-bar{ width:100%; max-width:420px; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:0 auto 18px; }
  .timer-bar-fill{ height:100%; width:100%; background:var(--accent); border-radius:999px; transition:width .2s linear, background-color .2s ease; }
  .timer-bar-fill.is-danger{ background:var(--bad); }
  .hc-question{ text-align:center; font-size:22px; font-weight:700; max-width:760px; margin:0 auto 18px; }
  .hc-answered{ text-align:center; color:var(--muted); font-weight:600; font-size:14px; margin-bottom:8px; }
  .hc-board{ max-width:520px; margin:0 auto; display:flex; flex-direction:column; }
  .hc-board-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); gap:12px; }
  .hc-board-rank{ font-family:var(--font-display); font-weight:700; width:28px; flex-shrink:0; }
  .hc-board-name{ flex:1; }
  .hc-board-pts{ color:var(--muted); }
  .hc-board-row.winner{ color:var(--accent); }
  .hc-board-row.winner .hc-board-rank{ color:#f5b301; }
  .hc-stat{ font-size:12px; color:var(--muted); }
  .hc-actions{ display:flex; gap:12px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
  .hc-btn-secondary{ background:none; border:1px solid var(--line); color:var(--text); }
  .hc-correct{ background:var(--good) !important; color:#fff !important; }

  /* -- Big screen / TV layout -- */
  .config-box{ max-width:520px; margin:0 auto 28px; }
  .host-grid{ display:block; }
  @media (min-width:860px){
    .host-grid{ display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:40px; align-items:start; }
    .host-grid .config-box{ max-width:none; margin:0; }
  }
  .lobby-tv{ display:none; }
  .tv-hero{ text-align:center; padding-block:6px 14px; }
  .tv-code-row{ display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap; margin-top:8px; }
  .tv-code{ font-family:var(--font-display); font-size:38px; font-weight:700; letter-spacing:.12em; color:var(--accent); }
  .tv-qr{ background:#fff; border-radius:10px; padding:6px; }
  .tv-players{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:flex-start; align-content:flex-start; padding:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a); min-height:80px; max-height:190px; overflow-y:auto; }
  .tv-footer{ display:flex; justify-content:center; margin-top:12px; }
  .waiting-label{ color:var(--muted); font-weight:700; font-size:15px; }
  .host-banner{ text-align:center; font-size:14px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .players-empty-note{ color:var(--muted); font-size:13px; font-style:italic; }

  /* -- Phone / controller layout -- */
  .lobby-phone{ display:block; max-width:420px; margin:0 auto; padding-inline:8px; }
  .phone-code-badge{ text-align:center; color:var(--muted); font-weight:700; font-size:13px; margin-bottom:10px; }
  .phone-code-badge .room-code-text{ color:var(--accent); font-family:var(--font-display); font-size:16px; letter-spacing:.08em; }
  .phone-avatar-row{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:10px; }
  #phone-avatar{ display:block; width:64px; height:64px; border-radius:50%; cursor:pointer; border:3px solid var(--accent); padding:2px; background:var(--surface); overflow:hidden; }
  .avatar-hint{ font-size:12px; color:var(--muted); }
  #phone-name{ font-family:var(--font-display); font-size:17px; font-weight:700; }
  .ready-btn{ width:100%; padding:12px; border-radius:var(--radius-a); border:2px solid var(--accent); background:none; color:var(--accent); font-weight:800; font-size:15px; cursor:pointer; margin-bottom:12px; transition:background .15s ease, color .15s ease; }
  .ready-btn.is-ready{ background:var(--good); border-color:var(--good); color:var(--bg); }
  .phone-players-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px; }
  .phone-players{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; max-height:110px; overflow-y:auto; }
  .phone-actions{ display:flex; flex-direction:column; gap:8px; }
  #copy-link-btn{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .start-btn{ display:none; }
  .start-btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* -- Trivia category/difficulty config panel (host only) -- */
  .cfg-section-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; }
  .cfg-diff-row{ display:flex; gap:8px; margin-bottom:18px; }
  .cfg-diff-btn{ flex:1; padding:10px 6px; border-radius:8px; border:2px solid var(--line); background:var(--surface); color:var(--text); font-weight:700; font-size:13px; cursor:pointer; }
  .cfg-diff-btn.active{ border-color:var(--accent); color:var(--accent); }
  .cfg-cat-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:8px; }
  .cfg-cat-chip{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-height:64px; padding:10px 6px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); font-size:12px; font-weight:600; text-align:center; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .cfg-cat-chip.active{ border-color:var(--accent); color:var(--text); background:var(--surface-2); }
  .cfg-cat-chip.empty{ opacity:.4; cursor:not-allowed; }
  .cfg-cat-check{
    position:absolute; top:-7px; inset-inline-end:-7px; width:20px; height:20px; border-radius:50%;
    background:var(--good); color:#fff; font-size:12px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--surface);
    opacity:0; transform:scale(.5); transition:opacity .15s ease, transform .15s ease;
  }
  .cfg-cat-chip.active .cfg-cat-check{ opacity:1; transform:scale(1); }
  .cfg-pool-banner{ margin-top:8px; margin-bottom:18px; padding:10px 12px; border-radius:8px; font-size:13px; font-weight:700; }
  .cfg-pool-banner.ok{ background:rgba(47,190,115,.15); color:var(--good); }
  .cfg-pool-banner.bad{ background:rgba(228,87,74,.15); color:var(--bad); }
  .cfg-custom-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .cfg-custom-card{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px; }
  .cfg-custom-card button{ background:none; border:none; color:var(--bad); font-weight:700; cursor:pointer; font-size:12px; }
  .cfg-add-btn{ width:100%; padding:10px; border-radius:8px; border:1px dashed var(--line); background:none; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; margin-bottom:6px; }
  .cfg-modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .cfg-modal{ background:var(--surface); border-radius:12px; padding:20px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto; }
  .cfg-modal h3{ font-size:17px; margin-bottom:14px; }
  .cfg-modal input[type="text"]{ width:100%; padding:10px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-size:13px; margin-bottom:10px; font-family:inherit; }
  .cfg-q-card{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .cfg-choice-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .cfg-choice-row input[type="text"]{ margin-bottom:0; flex:1; }
  .cfg-modal-actions{ display:flex; gap:8px; margin-top:14px; }
  .cfg-modal-actions button{ flex:1; padding:10px; border-radius:8px; border:none; font-weight:700; font-size:13px; cursor:pointer; }
  .cfg-btn-cancel{ background:var(--surface-2); color:var(--text); }
  .cfg-btn-save{ background:var(--accent); color:var(--on-accent); }
  .cfg-error{ color:var(--bad); font-size:12px; margin-top:6px; }

  @media (max-width: 859px){
    header{ padding-block:12px; }
    .back-row{ padding-block:6px 0; }
    #lobby-main{ padding-block:10px; }
  }

  @media (min-width: 860px){
    .lobby-tv{ display:block; }
    .lobby-phone{ display:none; }
  }
</style>
</head>
<body class="tv-page tv" data-game="trivia" data-game-page="trivia-play.html" data-guest-join="true" data-host-plays="false">
<header>
  <div class="wrap nav">
    <a href="bahjah-landing.html" style="display:flex;"><img class="brand-logo" src="assets/logos/bahjah-wordmark.png" alt="Bahjah"></a>
    <div class="nav-right">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">&#9789;</button>
      <div class="switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <span class="sep">/</span>
        <button id="btn-ar" onclick="setLang('ar')">ع</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap back-row">
  <a href="bahjah-landing.html" class="back-icon-btn" aria-label="Back to lobby">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="sr-only lang-fade" data-en="Back to lobby" data-ar="العودة إلى الردهة">Back to lobby</span>
  </a>
</div>

<div id="lobby-gate">
  <div>
    <div class="kicker">TRIVIA</div>
    <p id="lobby-gate-message" style="margin-top:10px; font-size:16px; color:var(--muted);">Connecting…</p>
    <div id="guest-entry">
      <div class="kicker lang-fade" data-en="Trivia" data-ar="سؤال وجواب">Trivia</div>
      <h2 class="lang-fade" data-en="Join as a guest" data-ar="انضم كضيف" style="margin-top:8px; font-size:22px;">Join as a guest</h2>
      <div id="guest-avatar" role="button" aria-label="Change avatar"></div>
      <span class="avatar-hint lang-fade" data-en="Tap to pick an avatar" data-ar="اضغط لاختيار صورة رمزية">Tap to pick an avatar</span>

      <div class="cfg-error" id="guest-error"></div>
      <button type="button" class="btn btn-primary" id="guest-join-btn">
        <span class="lang-fade" data-en="Join game" data-ar="انضم إلى اللعبة">Join game</span>
      </button>
      <a href="#" id="guest-signin-link" class="back-link lang-fade" data-en="Have an account? Sign in instead" data-ar="لديك حساب؟ سجّل الدخول بدلاً من ذلك">Have an account? Sign in instead</a>
    </div>
  </div>
</div>

<div id="host-console" class="wrap"></div>

<div id="lobby-main" class="wrap">
  <!-- Category/difficulty/custom-question config (host only). Sits beside
       .lobby-tv in a 2-column grid on desktop (config-box + host-grid CSS)
       so the host never has to scroll to reach Start; on narrow viewports
       .host-grid collapses to a single column above the separate
       .lobby-phone section below, unaffected by this grid. -->
  <div class="host-grid">
  <div id="trivia-config-panel" class="config-box" style="display:none;"></div>
  <div id="trivia-config-readonly" class="config-box" style="display:none; font-size:13px; color:var(--muted); text-align:center;"></div>

  <!-- Big screen / TV layout -->
  <section class="lobby-tv">
    <div class="tv-hero">
      <div class="kicker lang-fade" data-en="Trivia Lobby" data-ar="ردهة سؤال و جواب">Trivia Lobby</div>
      <img class="snd-lockup" id="snd-lockup" alt="Saudi National Day">
      <div class="tv-code-row">
        <div class="room-code-text tv-code">----</div>
        <img id="room-qr" class="tv-qr" width="96" height="96" alt="Scan to join">
      </div>
      <p class="lang-fade" data-en="Scan the code or share the room code to invite players." data-ar="امسح الرمز أو شارك رمز الغرفة لدعوة اللاعبين." style="color:var(--muted); margin-top:6px; font-size:13px;">Scan the code or share the room code to invite players.</p>
    </div>
    <p class="host-banner"></p>
    <div id="tv-players" class="tv-players"></div>
    <div class="tv-footer">
      <button class="btn btn-primary start-btn lang-fade" data-en="Start game" data-ar="ابدأ اللعبة">Start game</button>
      <span class="waiting-label"></span>
    </div>
  </section>
  </div>

  <!-- Phone / controller layout -->
  <section class="lobby-phone">
    <div class="phone-code-badge"><span class="lang-fade" data-en="Room" data-ar="الغرفة">Room</span> <span class="room-code-text">----</span></div>
    <div class="phone-avatar-row">
      <div id="phone-avatar" role="button" aria-label="Change avatar"></div>
      <span class="avatar-hint lang-fade" data-en="Tap to change" data-ar="اضغط للتغيير">Tap to change</span>
      <span id="phone-name" style="margin-top:4px;"></span>
    </div>
    <button class="ready-btn"></button>
    <p class="host-banner"></p>

    <div id="phone-players" class="phone-players"></div>
    <div class="phone-actions">
      <button class="btn btn-primary start-btn lang-fade" data-en="Start game" data-ar="ابدأ اللعبة">Start game</button>
      <span class="waiting-label" style="text-align:center;"></span>
      <button id="copy-link-btn" class="lang-fade" data-en="Copy invite link" data-ar="انسخ رابط الدعوة">Copy invite link</button>
    </div>
  </section>
</div>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
let theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  const guestNickname = document.getElementById('guest-nickname');
  if(guestNickname) guestNickname.placeholder = guestNickname.getAttribute('data-' + lang + '-ph');
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
  localStorage.setItem('bahjah_theme', theme);
  if (window.BahjahSndTheme) window.BahjahSndTheme.refreshLockup();
}

document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
applyLang();
document.documentElement.style.visibility = '';
</script>
</body>
