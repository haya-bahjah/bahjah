<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- bahjah.com/play: join a game by typing the code from the big screen,
     for a phone that cannot scan the QR code. Works for any Bahjah game: the
     code is looked up and the visitor is sent to that game's join page. -->
<script src="/assets/prefs-boot.js"></script>
<title>Bahjah — Join a game</title>
<link rel="icon" type="image/png" href="/assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/saudi-home/saudi-home.css?v=20261013">
<link rel="stylesheet" href="/assets/site-chrome.css">
<link rel="stylesheet" href="/assets/game-bar.css?v=20261027b">
<style>
  /* The Saudi Home lobby look (lobby_handoff/lobby-mobile.html). */
  :root{--lobby-green:#4D8F65;--lobby-green-dark:#3E7853;
    --lobby-band:repeating-linear-gradient(90deg,#4D8F65 0 14px,#221611 14px 18px,#FBF5EA 18px 22px,#221611 22px 26px,#DC957B 26px 30px,#221611 30px 34px)}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .band{height:8px;background:var(--lobby-band);flex:none}
  .strip{height:64px;flex:none;background:url('/assets/saudi-home/lobby-textile.webp') center 30%/cover;box-shadow:inset 0 -10px 18px -12px rgba(43,28,19,.35)}
  .wrap{flex:1;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
  #code{text-transform:uppercase;letter-spacing:.2em;font-weight:700}
  .field__box{height:52px}
  .field__box:focus-within{border-color:var(--lobby-green);box-shadow:0 0 0 3px rgba(77,143,101,.22)}
  .go{height:56px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:var(--radius-s);background:var(--lobby-green);
    color:var(--sand-50);box-shadow:var(--shadow-button);font:600 22px/1 var(--font-body);cursor:pointer}
  .go:hover{background:var(--lobby-green-dark)}
  .go:disabled{background:var(--sand-200);color:var(--ink-300);box-shadow:none;cursor:not-allowed}
  html[dir="rtl"] .go .ic{transform:scaleX(-1)}
</style>
</head>
<body>
<!-- The Bahjah bar, as on every game's screens (assets/game-bar.css). -->
<header class="site-header game-bar">
  <div class="wrap nav">
    <a href="/" class="nav-brand"><img class="brand-logo" src="/assets/logos/bahjah-wordmark.png?v=20260823" alt="Bahjah"></a>
    <div class="nav-right">
      <div class="switch">
        <button type="button" data-lang="en">EN</button>
        <span class="sep">/</span>
        <button type="button" data-lang="ar">ع</button>
      </div>
    </div>
  </div>
</header>
<div class="band"></div><div class="strip" role="presentation"></div>
<div class="wrap">
  <form id="f" style="flex:1;display:flex;flex-direction:column;gap:22px;padding:36px 24px calc(28px + env(safe-area-inset-bottom))">
    <div style="font:500 44px/1 var(--font-display)" data-t="title">Join a game</div>
    <div style="font:italic 500 20px/1.35 var(--font-body);color:var(--ink-700)" data-t="lede">Enter the code shown on the big screen.</div>
    <div style="flex:1"></div>
    <label class="field">
      <span class="field__label" data-t="label">Game code</span>
      <span class="field__box"><input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. HY4K" required></span>
      <span class="field__hint" id="hint"></span>
    </label>
    <button class="go" type="submit" id="go"><span data-t="go">Continue</span><span class="ic" style="--i:url(/assets/saudi-home/icons/arrow-right.svg);--s:20px"></span></button>
  </form>
</div>
<script>
(function () {
  const COPY = {
    en: { title: 'Join a game', lede: 'Enter the code shown on the big screen.', label: 'Game code', go: 'Continue', ph: 'e.g. HY4K',
      missing: 'We could not find a game with that code. Check the big screen and try again.' },
    ar: { title: 'انضم إلى لعبة', lede: 'أدخل الرمز الظاهر على الشاشة الكبيرة.', label: 'رمز اللعبة', go: 'متابعة', ph: 'مثلاً HY4K',
      missing: 'لم نجد لعبة بهذا الرمز. تحقق من الشاشة الكبيرة وحاول مرة أخرى.' },
  };
  let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
  function applyLang() {
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = COPY[lang][el.dataset.t]; });
    document.getElementById('code').placeholder = COPY[lang].ph;
    if (hint.classList.contains('is-error')) hint.textContent = COPY[lang].missing;
    document.dispatchEvent(new CustomEvent('bahjah:lang-change', { detail: { lang } }));
  }
  // The Bahjah bar's EN / ع.
  window.gameBarSetLang = (next) => {
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem('bahjah_lang', lang); } catch (e) { /* private mode */ }
    applyLang();
  };
  const hint = document.getElementById('hint');
  applyLang();
  document.documentElement.style.visibility = '';
  const input = document.getElementById('code');
  const go = document.getElementById('go');
  const prefill = new URLSearchParams(location.search).get('code');
  if (prefill) input.value = prefill;
  input.focus();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    if (!code) return;
    go.disabled = true;
    hint.classList.remove('is-error');
    hint.textContent = '';
    try {
      const res = await fetch(`/api/rooms/${encodeURIComponent(code)}/lookup`);
      if (!res.ok) throw new Error('not found');
      const { gameType } = await res.json();
      location.href = `/${gameType}-lobby.html?code=${encodeURIComponent(code)}`;
    } catch (err) {
      hint.textContent = COPY[lang].missing;
      hint.classList.add('is-error');
      go.disabled = false;
    }
  });
})();
</script>
<script src="/assets/theme-toggle.js"></script>
<script src="/assets/game-bar.js?v=20261027b"></script>
</body>
</html>
