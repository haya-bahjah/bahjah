<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="assets/prefs-boot.js"></script>
<title>Bahjah — مين أنا؟ · Who Am I?</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="assets/wai-theme.css?v=20261121h">
<link rel="stylesheet" href="assets/site-chrome.css">
<link rel="stylesheet" href="assets/game-bar.css?v=20261027b">
<style>
  /* Join (wireframe 02, player phone) and the lobby (03) on a player's phone.
     The host's wide screen is the shared screen (assets/wai-tv.js) and the
     host's phone -- opened from the TV's "Host panel" code, ?panel=1 -- is
     the host panel (assets/wai-panel.js); both stay on this page for the
     whole game. Everybody else goes to who-am-i-play.html. */
  #lobby-main{ display:none; }
  #wai-tv{ display:none; }
  #wai-panel{ display:none; }
  #guest-entry{ display:none; flex-direction:column; gap:14px; }
  #guest-entry[style*="block"]{ display:flex !important; }
  #lobby-gate-message{ font:500 15px var(--font-body); color:var(--text-secondary); }
  #lobby-gate-message[data-tone="error"]{ color:var(--c-hot); }
  #guest-signin-link{ align-self:center; font:600 14px var(--font-body); }
  .lobby-notice{ color:var(--c-hot) !important; font-family:var(--font-body) !important; text-align:center; max-width:none !important; }
  #lobby-connection{ background:var(--sun-400) !important; color:var(--night-900) !important; border-radius:999px !important; }
</style>
</head>
<body class="wai" data-game="who-am-i" data-game-page="who-am-i-play.html" data-guest-join="true" data-host-plays="false">
<header class="site-header game-bar">
  <div class="wrap nav">
    <a href="bahjah-landing.html" class="nav-brand"><img class="brand-logo" src="assets/logos/bahjah-wordmark.png?v=20260823" alt="Bahjah"></a>
    <div class="nav-right">
      <div class="switch">
        <button type="button" data-lang="en">EN</button>
        <span class="sep">/</span>
        <button type="button" data-lang="ar">ع</button>
      </div>
    </div>
  </div>
</header>

<!-- 02 Join (player phone) -->
<div id="lobby-gate" class="w-phone">
  <div class="w-phone__head"><a class="w-btn w-btn--secondary w-btn--sm w-btn--icon" href="who-am-i.html" id="gate-back"></a><span></span></div>
  <div class="w-phone__body">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px"><span id="gate-logo"></span><h1 class="w-h1" id="gate-h"></h1></div>
    <label class="w-field" id="gate-code-field"><span class="w-label" id="gate-code-label"></span>
      <input class="w-input w-input--code" id="gate-code" dir="ltr" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7Q2"></label>
    <span id="lobby-gate-message">…</span>
    <div id="guest-entry">
      <label class="w-field"><span class="w-label" id="gate-name-label"></span>
        <input type="text" id="guest-nickname" class="w-input" maxlength="16" autocomplete="nickname"></label>
      <span class="w-error" id="guest-error"></span>
      <a href="#" id="guest-signin-link"></a>
    </div>
  </div>
  <div class="w-phone__foot"><button type="button" class="w-btn w-btn--lg w-btn--block" id="guest-join-btn" hidden></button></div>
</div>

<div id="wai-tv" class="w-tv-frame"><div class="w-tv" id="wai-stage"></div></div>
<div id="wai-panel"></div>

<div id="lobby-main">
  <div class="w-phone" id="phone-lobby"></div>
  <span class="room-code-text" hidden></span>
</div>

<script src="assets/session.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="assets/room-socket.js"></script>
<script src="assets/arcade-avatars.js"></script>
<script src="assets/avatars.js"></script>
<script src="assets/avatar-picker.js"></script>
<script src="assets/sound-fx.js"></script>
<script src="assets/wai-ui.js?v=20261121h"></script>
<script src="assets/lobby-room.js"></script>
<script src="assets/wai-setup.js?v=20261121h"></script>
<script src="assets/wai-host.js?v=20261121h"></script>
<script src="assets/wai-tv.js?v=20261121h"></script>
<script src="assets/wai-panel.js?v=20261121h"></script>
<script>
(function(){
  const UI = window.WaiUI;
  const esc = UI.esc;
  const params = new URLSearchParams(location.search);
  const urlCode = (params.get('code') || '').toUpperCase();

  // --- 02 Join -----------------------------------------------------------
  const gateCode = document.getElementById('gate-code');
  const joinBtn = document.getElementById('guest-join-btn');
  const guestEntry = document.getElementById('guest-entry');
  gateCode.value = urlCode;
  function paintGate(){
    const t = UI.t();
    document.getElementById('gate-back').innerHTML = UI.icon(UI.back(), 18);
    document.getElementById('gate-back').setAttribute('aria-label', t.back);
    document.getElementById('gate-logo').innerHTML = UI.emblem(72);
    document.getElementById('gate-h').innerHTML = `${esc(t.title)}<span class="w-q">${t.q}</span>`;
    document.getElementById('gate-code-label').textContent = t.code;
    document.getElementById('gate-name-label').textContent = t.yourName;
    document.getElementById('guest-signin-link').textContent = UI.isAr() ? 'عندك حساب؟ سجّل دخولك' : 'Have an account? Sign in';
    const late = document.getElementById('guest-error').textContent === t.errors.ROOM_NOT_JOINABLE;
    joinBtn.textContent = late ? t.tryAgain : t.join;
    const err = document.getElementById('guest-error').textContent;
    gateCode.classList.toggle('is-error', Boolean(err) && (err === t.errors.ROOM_NOT_FOUND));
    syncGate();
  }
  function syncGate(){
    const open = /block/.test(guestEntry.style.display) || !urlCode;
    joinBtn.hidden = !open;
    document.getElementById('gate-code-field').hidden = !open;
    joinBtn.disabled = gateCode.value.length !== 4;
  }
  new MutationObserver(syncGate).observe(guestEntry, { attributes: true, attributeFilter: ['style'] });
  new MutationObserver(paintGate).observe(document.getElementById('guest-error'), { childList: true, characterData: true, subtree: true });
  gateCode.addEventListener('input', () => { gateCode.value = gateCode.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); syncGate(); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#guest-join-btn')) return;
    const typed = gateCode.value;
    if (typed.length === 4 && typed !== urlCode) {
      e.preventDefault(); e.stopPropagation();
      const nick = document.getElementById('guest-nickname').value.trim();
      if (nick) BahjahSession.rememberGuestProfile({ name: nick });
      location.href = `who-am-i-lobby.html?code=${encodeURIComponent(typed)}&auto=1`;
    }
  }, true);
  if (params.get('auto') === '1' && /block/.test(guestEntry.style.display) && document.getElementById('guest-nickname').value.trim()) {
    setTimeout(() => joinBtn.click(), 0);
  }

  // --- 03 Lobby on a player's phone ---------------------------------------
  let lobby = null;
  document.addEventListener('bahjah:lobby-update', (e) => {
    lobby = e.detail || null;
    if (lobby && lobby.socket && !lobby.socket.__waiRemoved) {
      lobby.socket.__waiRemoved = true;
      lobby.socket.on('room:removed', () => { location.href = 'who-am-i.html'; });
    }
    paint();
  });
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-leave]') && lobby && lobby.socket) {
      lobby.socket.emit('room:leave');
      setTimeout(() => { location.href = 'who-am-i.html'; }, 250);
    }
  });
  function paint(){
    if (!lobby || !lobby.room || lobby.room.status !== 'lobby' || lobby.isHost) return;
    const t = UI.t();
    const room = lobby.room;
    const ps = room.members.filter((m) => !m.isHost);
    const meId = lobby.me && lobby.me.id;
    const me = room.members.find((m) => m.userId === meId);
    const seat = Math.max(0, ps.findIndex((m) => m.userId === meId));
    const name = (me && me.displayName) || '';
    document.getElementById('phone-lobby').innerHTML = `
      <div class="w-phone__head"><span class="w-mono" dir="ltr">${esc(room.code)}</span><span style="display:flex;gap:8px;align-items:center">${UI.soundButton()}${UI.emblem(32)}</span></div>
      <div class="w-phone__body w-phone__body--center">${UI.dot(name, seat, 96)}
        <h1 class="w-h1" dir="auto">${esc(t.hi(name))}</h1><p class="w-body">${esc(t.youreIn)}</p>${UI.badge(t.playersN(ps.length))}</div>
      <div class="w-phone__foot"><div class="w-glass w-card" style="text-align:center"><span class="w-body">${esc(t.watchType)}</span></div>
        <span class="w-small w-muted" style="text-align:center">${esc(t.waitHost)}</span>
        <button type="button" class="w-btn w-btn--ghost w-btn--block" data-leave>${esc(t.leave)}</button></div>`;
  }

  document.addEventListener('bahjah:lang-change', () => { paintGate(); paint(); });
  UI.initLang();
  paintGate();
  document.documentElement.style.visibility = '';
})();
</script>
<script src="assets/theme-toggle.js"></script>
<script src="assets/game-bar.js?v=20261027b"></script>
</body>
</html>
