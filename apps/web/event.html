<script src="/assets/session.js"></script>
<script>
(function () {
  // Per game, then per language. Knows You Best is the default for any event
  // whose game has no entry of its own.
  const GAME_COPY = {
    'saudi-home': {
      mark: null,
      ar: { game: 'حياكم في بيت سعودي' },
      en: { game: 'Welcome to a Saudi Home' },
    },
  };
  const COPY = {
    ar: {
      game: 'عارفكم',
      start: 'ابدأ اللعبة',
      starting: 'جارٍ تجهيز الغرفة…',
      hint: 'افتح هذه الصفحة على الشاشة الكبيرة. سيظهر رمز QR يمسحه اللاعبون بجوالاتهم للانضمام.',
      dead: 'هذا الرابط غير مفعّل.',
      failed: 'تعذّر إنشاء الغرفة — حاول مرة أخرى.',
    },
    en: {
      game: 'Knows You Best',
      start: 'Start the game',
      starting: 'Setting up the room…',
      hint: 'Open this page on the big screen. A QR code will appear for players to scan with their phones.',
      dead: 'This link is not active.',
      failed: 'Could not create the room — please try again.',
    },
  };

  const key = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const note = document.getElementById('ev-note');
  const ready = document.getElementById('ev-ready');
  const startBtn = document.getElementById('ev-start');
  let event = null;

  function t() {
    const lang = event ? event.lang : (document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'ar');
    const game = event && GAME_COPY[event.gameType];
    return Object.assign({}, COPY[lang], game ? game[lang] : {});
  }

  function showNote(text, tone) {
    note.textContent = text;
    note.setAttribute('data-tone', tone);
    note.style.display = '';
  }

  // The event's language is the page's, and is remembered so the lobby and
  // the game this page hands over to open in it too.
  function applyLang(lang) {
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    try { localStorage.setItem('bahjah_lang', lang); } catch (e) { /* private mode */ }
    // The shared footer's line.
    document.querySelectorAll('[data-en][data-ar]').forEach((el) => { el.textContent = el.dataset[lang]; });
  }

  applyLang(document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'ar');

  fetch(`/api/events/${encodeURIComponent(key)}`)
    .then((res) => (res.ok ? res.json() : Promise.reject(res)))
    .then((data) => {
      event = data.event;
      // Welcome to a Saudi Home has its own start screen, drawn in its own
      // design, inside the game's page.
      if (event.gameType === 'saudi-home') {
        location.replace(`/saudi-home-lobby.html?event=${encodeURIComponent(key)}&lang=${event.lang}`);
        return;
      }
      applyLang(event.lang);
      const c = t();
      document.title = `Bahjah — ${event.title[event.lang]}`;
      document.getElementById('ev-game').textContent = c.game;
      const mark = document.getElementById('ev-mark');
      const game = GAME_COPY[event.gameType];
      if (game && game.mark === null) mark.remove();
      else mark.style.visibility = '';
      document.getElementById('ev-title').textContent = event.title[event.lang];
      document.getElementById('ev-hint').textContent = c.hint;
      startBtn.textContent = c.start;
      note.style.display = 'none';
      ready.style.display = 'flex';
    })
    .catch(() => showNote(t().dead, 'error'))
    .finally(() => { document.documentElement.style.visibility = ''; });

  startBtn.addEventListener('click', () => {
    const c = t();
    startBtn.disabled = true;
    startBtn.textContent = c.starting;
    // Signed in (or still holding a guest pass from earlier tonight): host as
    // that identity. Otherwise the server makes a guest host and returns its
    // token, kept exactly as a guest who joined by QR code would keep theirs.
    // session.js declares BahjahSession with a top-level const, which is a
    // global binding but not a property of window -- so it is checked by
    // name, not as window.BahjahSession (that read undefined, and a signed-in
    // host was handed a hidden guest host instead of hosting as themselves).
    const token = typeof BahjahSession !== 'undefined' ? BahjahSession.getActiveToken() : null;
    fetch(`/api/events/${encodeURIComponent(key)}/rooms`, {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: `Bearer ${token}` } : {}),
      body: '{}',
    })
      .then((res) => res.json().then((data) => (res.ok ? data : Promise.reject(data))))
      .then((data) => {
        if (data.token && data.user) BahjahSession.saveGuest(data.token, data.user);
        location.href = `/${data.room.gameType}-lobby.html?code=${encodeURIComponent(data.room.code)}&lang=${event.lang}`;
      })
      .catch(() => {
        startBtn.disabled = false;
        startBtn.textContent = c.start;
        showNote(c.failed, 'error');
      });
  });
})();
</script>
