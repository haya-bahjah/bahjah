<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="assets/prefs-boot.js"></script>
<title>Bahjah — فبركة</title>
<link rel="icon" type="image/png" href="assets/fabrication/icon-32.png?v=20261019">
<link rel="apple-touch-icon" href="assets/fabrication/icon-180.png?v=20261019">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/design-system/tokens.css">
<!-- Bump the ?v= token on every edit to assets/fabrication-theme.css: phones
     hold the old stylesheet otherwise and the change never shows up. -->
<link rel="stylesheet" href="assets/fabrication-theme.css?v=20261019">
<style>
  /* The phone as an app shell: a slim bar pinned at the top, the round in
     the height that is left, laid out like the 360 x 760 wireframes. */
  html, body{ height:100%; }
  body{ display:flex; flex-direction:column; height:100dvh; overflow:hidden;
        padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  .bar{ flex:none; display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:3px solid var(--ink); background:var(--paper); }
  .bar a{ display:flex; }
  .bar .fab-logo{ height:30px; width:auto; }
  .bar-r{ margin-inline-start:auto; display:flex; gap:8px; align-items:center; }
  .bar-btn{ min-width:36px; min-height:36px; padding:2px 12px; border:2px solid var(--ink); border-radius:999px; background:var(--white); color:var(--ink); font-size:13px; font-weight:800; cursor:pointer; }
  #lobby-strip{ display:none; margin:10px 18px 0; padding:10px 14px; font-size:14px; font-weight:700; background:var(--white); border:2px solid var(--ink); border-radius:var(--fab-radius); }
  body.is-live #lobby-strip{ display:none !important; }

  .stage{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .stage::-webkit-scrollbar{ display:none; }
  /* One screen: a column with a bottom block pinned under it (.fab-push). */
  .fab-screen{ max-width:520px; min-height:100%; margin:0 auto; padding:20px 18px 24px; display:flex; flex-direction:column; gap:14px; }
  .fab-push{ margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:6px; }
  .fab-screen .fab-me{ margin-bottom:-4px; }

  .vote-q{ display:flex; flex-direction:column; gap:2px; }
  .vote-q b{ font-size:17px; font-weight:800; line-height:1.3; }
  .fab-headline{ font-size:28px; font-weight:900; line-height:1.15; }

  /* Waiting for the first question, and the splash the host's start lands on. */
  .splash{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; text-align:center; }
  .splash .fab-logo{ width:min(300px,80%); }
</style>
</head>
<body class="fab">
<header class="bar">
  <a href="bahjah-landing.html" aria-label="Bahjah"><img class="fab-logo" data-logo="light" src="assets/fabrication/logo-en-light.png?v=20261019" alt="Fabrication"></a>
  <div class="bar-r">
    <button type="button" class="bar-btn" id="sound-btn" onclick="toggleSound()" aria-label="Toggle sound effects">&#128266;</button>
    <button type="button" class="bar-btn lang-btn" onclick="toggleLang()">ع</button>
  </div>
</header>

<div id="lobby-strip"></div>

<!-- Shown from the host pressing start until the first question lands. -->
<section class="splash" id="fab-splash">
  <img class="fab-logo" data-logo="light" src="assets/fabrication/logo-en-light.png?v=20261019" alt="Fabrication">
  <span class="fab-kicker fab-kicker--red lang-fade" data-en="Shuffling the first fact…" data-ar="جارٍ تجهيز أول معلومة…">Shuffling the first fact…</span>
</section>

<main class="stage" id="fab-live" style="display:none;">
  <div id="fab-play-box" style="height:100%;"></div>
</main>

<script src="assets/session.js"></script>
<script src="assets/sound-fx.js"></script>
<script src="assets/share-card.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="assets/lobby.js"></script>
<script src="assets/arcade-avatars.js"></script>
<script src="assets/avatars.js"></script>
<script src="assets/timer-bar.js"></script>
<script src="assets/fabrication-ui.js?v=20261019"></script>
<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';

function toggleSound(){
  const on = window.BahjahSoundFx.toggle();
  document.getElementById('sound-btn').innerHTML = on ? '&#128266;' : '&#128263;';
  if(on) window.BahjahSoundFx.tick();
}

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => { b.textContent = lang === 'ar' ? 'EN' : 'ع'; });
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.querySelectorAll('[data-logo]').forEach(img => { img.src = FabUI.logoSrc(img.dataset.logo); img.alt = FabUI.t('Fabrication', 'فبركة'); });
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function toggleLang(){
  lang = lang === 'ar' ? 'en' : 'ar';
  applyLang();
  localStorage.setItem('bahjah_lang', lang);
}

document.getElementById('sound-btn').innerHTML = window.BahjahSoundFx.isEnabled() ? '&#128266;' : '&#128263;';
applyLang();
// prefs-boot.js hides the document before first paint when the saved
// language is not English; the page hands visibility back once its own text
// has been swapped. Without this the page stays blank for every returning
// Arabic reader (see scripts/check-page-visibility.js).
document.documentElement.style.visibility = '';
</script>
<script src="assets/fabrication-play.js?v=20261019"></script>
</body>
</html>
