<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Bahjah — فبركة</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/design-system/tokens.css">
<!-- Bump the ?v= token on every edit to assets/fabrication-theme.css: phones
     hold the old stylesheet otherwise and the change never shows up. -->
<link rel="stylesheet" href="assets/fabrication-theme.css?v=20260922">
<link rel="stylesheet" href="assets/design-system/arcade.css">
<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; color:var(--text-primary); font-family:var(--font-body); line-height:1.6; overflow-x:hidden; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.15; font-weight:700; }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  .wrap{ max-width:720px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  /* Legacy var aliases: assets/lobby.js (shared) still inline-styles with
     these three old token names. */
  body{ --brand:var(--fab-violet); --on-accent:var(--text-on-accent); --muted:var(--text-muted); }

  header{ position:relative; z-index:5; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:20px; gap:16px; }
  .brand-logo{ display:block; height:28px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  .back-icon-btn{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--border-subtle); color:var(--text-primary); flex-shrink:0; }
  .back-icon-btn:hover{ border-color:var(--border-strong); }
  [dir="rtl"] .back-icon-btn svg{ transform:scaleX(-1); }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; }
  .switch button{ background:none; border:none; color:var(--text-muted); padding:2px 3px; font-family:var(--font-pixel); }
  .switch button.active{ color:var(--fab-gold); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--border-strong); }
  .theme-btn{ background:none; border:1px solid var(--border-subtle); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-primary); }

  .stage{ padding-block:20px 64px; min-height:60vh; }
  .stage-inner{ width:100%; }
  .demo{ padding:0; max-width:640px; margin:0 auto; }

  /* Who you are in this room. On a phone the roster lives on the television,
     so without this nothing on screen names the player for the whole match. */
  .me-chip{ display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; font-weight:700; color:var(--text-secondary); }
  .me-chip-avatar{ width:26px; height:26px; border-radius:50%; overflow:hidden; flex:none; }
  .me-chip-avatar svg, .me-chip-avatar img{ width:100%; height:100%; display:block; }

  /* Waiting for the first question, and the splash the host's start lands on. */
  .fab-splash{ text-align:center; padding-block:64px; }
  .fab-splash-mark{
    display:inline-block; padding:10px 20px; transform:rotate(-6deg);
    border:4px solid var(--fab-gold); border-radius:var(--radius-xs);
    font-family:var(--font-display); font-size:34px; font-weight:700; color:var(--fab-gold);
  }
  .fab-splash-note{ margin-top:18px; font-size:14px; color:var(--text-muted); }

  /* ---- The phone as an app shell, same arrangement as the other games:
     the header stays pinned, the round takes the height that is left, and the
     footer goes -- social links under a live round are screen nobody uses. ---- */
  @media (max-width:720px){
    html, body{ height:100%; }
    body{
      display:flex; flex-direction:column; overflow:hidden;
      height:100dvh; box-sizing:border-box;
      padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    }
    header{ flex:none; }
    .nav{ padding-block:10px; gap:10px; }
    .brand-logo{ height:22px; }
    .nav > .back-icon-btn{ margin-inline-end:2px; }
    .nav > a:nth-of-type(2){ margin-inline-end:auto; }
    .wrap:has(#lobby-strip){ flex:none; padding-top:6px !important; }
    #lobby-strip{ padding:8px 12px !important; font-size:13px !important; }
    .stage{ flex:1 1 auto; min-height:0 !important; padding-block:12px 16px;
            overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .stage::-webkit-scrollbar{ display:none; }
    .stage{ scrollbar-width:none; }
    footer{ display:none; }
  }
</style>
</head>
<body class="fab">
<header>
  <div class="wrap nav">
    <a href="bahjah-landing.html" class="back-icon-btn" aria-label="Back to lobby">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="sr-only lang-fade" data-en="Back to lobby" data-ar="العودة إلى الردهة">Back to lobby</span>
    </a>
    <a href="bahjah-landing.html" style="display:flex;"><img class="brand-logo" src="assets/logos/bahjah-wordmark.png?v=20260823" alt="Bahjah"></a>
    <div class="nav-right">
      <button class="theme-btn" id="sound-btn" onclick="toggleSound()" aria-label="Toggle sound effects">&#128266;</button>
      <div class="switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <span class="sep">/</span>
        <button id="btn-ar" onclick="setLang('ar')">ع</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap" style="padding-top:14px;">
  <div id="lobby-strip" style="display:none; padding:12px 18px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); border-top:2px solid var(--fab-violet); font-size:14px; color:var(--text-primary);"></div>
</div>

<!-- Shown from the host pressing start until the first question lands. -->
<section class="wrap fab-splash" id="fab-splash">
  <span class="fab-splash-mark lang-fade" data-en="FABRICATION" data-ar="فبركة">فبركة</span>
  <p class="fab-splash-note lang-fade" data-en="Shuffling the first fact…" data-ar="جارٍ تجهيز أول معلومة…">Shuffling the first fact…</p>
</section>

<main class="stage wrap" id="fab-live" style="display:none;">
  <div class="stage-inner">
    <div class="me-chip" id="me-chip" hidden>
      <span class="me-chip-avatar" id="me-chip-avatar"></span>
      <span id="me-chip-name"></span>
    </div>
    <div class="demo" id="fab-play-box"></div>
  </div>
</main>

<footer>
  <div class="wrap foot-row" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; padding-block:24px;">
    <p class="copy lang-fade" style="font-size:13px; color:var(--text-muted);" data-en="© 2026 Bahjah. All rights reserved." data-ar="© ٢٠٢٦ بهجة. جميع الحقوق محفوظة.">© 2026 Bahjah. All rights reserved.</p>
  </div>
</footer>

<script src="assets/session.js"></script>
<script src="assets/theme-toggle.js"></script>
<script src="assets/sound-fx.js"></script>
<script src="assets/share-card.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="assets/lobby.js"></script>
<script src="assets/arcade-avatars.js"></script>
<script src="assets/avatars.js"></script>
<script src="assets/timer-bar.js"></script>
<script src="assets/ranked-board.js"></script>
<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';

function toggleSound(){
  const on = window.BahjahSoundFx.toggle();
  document.getElementById('sound-btn').innerHTML = on ? '&#128266;' : '&#128263;';
  if(on) window.BahjahSoundFx.tick();
}

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

document.getElementById('sound-btn').innerHTML = window.BahjahSoundFx.isEnabled() ? '&#128266;' : '&#128263;';
applyLang();
</script>
<script src="assets/fabrication-play.js?v=20260922"></script>
</body>
</html>
