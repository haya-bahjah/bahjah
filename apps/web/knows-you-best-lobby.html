<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Knows You Best Lobby — Bahjah</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/design-system/tokens.css">
<link rel="stylesheet" href="assets/kyb-theme.css">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--text-primary); font-family:var(--font-body); line-height:1.5; min-height:100vh; }
  /* Legacy var aliases: assets/avatar-picker.js (shared, not modified here)
     inline-styles its modal using these old token names. */
  body{ --surface:var(--surface-card); --surface-2:var(--surface-raised); --line:var(--border-subtle); --radius-a:var(--radius-md); --brand:var(--kyb-accent); --text:var(--text-primary); --muted:var(--text-muted); }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.1; font-weight:700; }
  .wrap{ max-width:1100px; margin:0 auto; padding-inline:24px; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  header{ padding-block:18px; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; }
  .brand-logo{ display:block; height:28px; width:auto; filter:invert(1) brightness(1.7); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; }
  .switch button{ background:none; border:none; color:var(--text-muted); padding:2px 3px; font-family:var(--font-pixel); }
  .switch button.active{ color:var(--cyber-cyan); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--border-strong); }
  .back-link{ color:var(--text-muted); text-decoration:none; font-size:13px; font-weight:600; }
  .back-icon-btn{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--border-subtle); color:var(--text-primary); flex-shrink:0; }
  .back-icon-btn:hover{ border-color:var(--border-strong); }
  [dir="rtl"] .back-icon-btn svg{ transform:scaleX(-1); }
  .back-row{ display:flex; padding-block:10px 0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .btn{ border:none; border-radius:var(--radius-sm); font-weight:700; padding:13px 24px; font-size:15px; cursor:pointer; }
  .kicker{ font-family:var(--font-pixel); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--kyb-accent); }

  #lobby-gate{ min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #lobby-main{ display:none; padding-block:14px; }

  #guest-entry{ display:none; width:100%; max-width:340px; text-align:center; }
  #guest-avatar{ display:block; width:88px; height:88px; margin:16px auto 6px; border-radius:50%; cursor:pointer; border:3px solid var(--kyb-accent); padding:2px; background:var(--surface-raised); overflow:hidden; }
  #guest-entry .avatar-hint{ font-size:12px; color:var(--text-muted); display:block; margin-bottom:18px; }
  #guest-nickname{ width:100%; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:15px; text-align:center; margin-bottom:14px; }
  #guest-join-btn{ width:100%; }
  #guest-entry .cfg-error{ min-height:16px; }
  #guest-signin-link{ display:inline-block; margin-top:16px; }

  /* -- Host console (live match monitor, host never navigates away) -- */
  #host-console{ display:none; padding-block:28px; }
  .hc-round-label{ text-align:center; color:var(--text-muted); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .hc-timer{ text-align:center; font-family:var(--font-display); font-size:56px; font-weight:700; color:var(--kyb-accent); margin-block:8px 4px; }
  .timer-bar{ width:100%; max-width:340px; height:5px; border-radius:999px; background:var(--surface-raised); overflow:hidden; margin:0 auto 18px; }
  .timer-bar-fill{ height:100%; width:100%; background:var(--kyb-accent); border-radius:999px; transition:width .2s linear, background-color .2s ease; }
  .timer-bar-fill.is-danger{ background:var(--danger); }
  .hc-question{ text-align:center; font-size:22px; font-weight:700; max-width:760px; margin:0 auto 18px; }
  .hc-answered{ text-align:center; color:var(--text-muted); font-weight:600; font-size:14px; margin-bottom:8px; }
  .hc-board{ max-width:520px; margin:0 auto; display:flex; flex-direction:column; }
  .hc-board-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border-subtle); gap:12px; }
  .hc-board-rank{ font-family:var(--font-display); font-weight:700; width:28px; flex-shrink:0; }
  .hc-board-name{ flex:1; }
  .hc-board-pts{ color:var(--text-muted); }
  .hc-board-row.winner{ color:var(--kyb-accent); }
  .hc-board-row.winner .hc-board-rank{ color:var(--arcade-yellow); }
  .hc-stat{ font-size:12px; color:var(--text-muted); }
  .hc-actions{ display:flex; gap:12px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
  .hc-btn-secondary{ background:none; border:1px solid var(--border-subtle); color:var(--text-primary); }
  .hc-answer-input{ width:100%; max-width:420px; display:block; margin:0 auto 14px; padding:14px 16px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:15px; }
  .hc-answer-submit{ display:block; margin:0 auto; }

  /* -- Rounds/host-play/custom-question config panel (host only) -- */
  .cfg-section-label{ font-family:var(--font-pixel); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .cfg-rounds-row{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .cfg-rounds-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-weight:700; font-size:18px; cursor:pointer; }
  .cfg-rounds-value{ font-family:var(--font-display); font-size:22px; font-weight:700; min-width:28px; text-align:center; }
  .cfg-toggle-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; font-size:14px; font-weight:600; }
  .cfg-toggle-row input[type="checkbox"]{ width:20px; height:20px; accent-color:var(--kyb-accent); cursor:pointer; }
  .cfg-cat-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .cfg-cat-chip{ padding:8px 14px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; }
  .cfg-cat-chip.active{ border-color:var(--kyb-accent); color:var(--kyb-accent); background:var(--kyb-accent-dim); }
  .cfg-set-name-label{ display:block; font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:6px; }
  .cfg-set-name-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .cfg-set-name-input{ flex:1; width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-size:13px; font-family:inherit; }
  .cfg-set-name-saved{ font-size:12px; font-weight:700; color:var(--pixel-green); flex-shrink:0; }
  .cfg-custom-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .cfg-custom-card{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border-subtle); border-radius:8px; background:var(--surface-raised); font-size:13px; gap:10px; }
  .cfg-custom-card button{ background:none; border:none; color:var(--kyb-accent); font-weight:700; cursor:pointer; font-size:12px; flex-shrink:0; }
  .cfg-add-btn{ width:100%; padding:10px; border-radius:8px; border:1px dashed var(--border-subtle); background:none; color:var(--kyb-accent); font-weight:700; font-size:13px; cursor:pointer; margin-bottom:6px; }
  .cfg-modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .cfg-modal{ background:var(--surface-card); border-radius:12px; padding:20px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto; }
  .cfg-modal h3{ font-size:17px; margin-bottom:14px; }
  .cfg-modal input[type="text"]{ width:100%; padding:10px; border-radius:6px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-size:13px; margin-bottom:10px; font-family:inherit; }
  .cfg-modal-actions{ display:flex; gap:8px; margin-top:14px; }
  .cfg-modal-actions button{ flex:1; padding:10px; border-radius:8px; border:none; font-weight:700; font-size:13px; cursor:pointer; }
  .cfg-btn-cancel{ background:var(--surface-raised); color:var(--text-primary); }
  .cfg-btn-save{ background:var(--kyb-accent); color:var(--text-on-accent); }
  .cfg-error{ color:var(--kyb-accent); font-size:12px; margin-top:6px; }

  /* -- Big screen / TV layout -- */
  .config-box{ max-width:520px; margin:0 auto 28px; }
  .host-grid{ display:block; }
  @media (min-width:860px){
    .host-grid{ display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:40px; align-items:start; }
    .host-grid .config-box{ max-width:none; margin:0; }
  }
  .lobby-tv{ display:none; }
  .tv-hero{ text-align:center; padding-block:6px 14px; }
  .tv-code-row{ display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap; margin-top:8px; }
  .tv-code{ font-family:var(--font-display); font-size:38px; font-weight:700; letter-spacing:.12em; color:var(--kyb-accent); }
  .tv-qr{ background:#fff; border-radius:10px; padding:6px; }
  .tv-players{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:flex-start; align-content:flex-start; padding:12px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); min-height:80px; max-height:190px; overflow-y:auto; }
  .tv-footer{ display:flex; justify-content:center; margin-top:12px; }
  .waiting-label{ color:var(--text-muted); font-weight:700; font-size:15px; }
  .host-banner{ text-align:center; font-size:14px; font-weight:700; color:var(--text-muted); margin-bottom:6px; }
  .players-empty-note{ color:var(--text-muted); font-size:13px; font-style:italic; }

  /* -- Phone / controller layout -- */
  .lobby-phone{ display:block; max-width:420px; margin:0 auto; padding-inline:8px; }
  .phone-code-badge{ text-align:center; color:var(--text-muted); font-weight:700; font-size:13px; margin-bottom:10px; }
  .phone-code-badge .room-code-text{ color:var(--kyb-accent); font-family:var(--font-display); font-size:16px; letter-spacing:.08em; }
  .phone-avatar-row{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:10px; }
  #phone-avatar{ display:block; width:64px; height:64px; border-radius:50%; cursor:pointer; border:3px solid var(--kyb-accent); padding:2px; background:var(--surface-raised); overflow:hidden; }
  .avatar-hint{ font-size:12px; color:var(--text-muted); }
  #phone-name{ font-family:var(--font-display); font-size:17px; font-weight:700; }
  .ready-btn{ width:100%; padding:12px; border-radius:var(--radius-sm); border:2px solid var(--kyb-accent); background:none; color:var(--kyb-accent); font-weight:800; font-size:15px; cursor:pointer; margin-bottom:12px; transition:background .15s ease, color .15s ease; }
  .ready-btn.is-ready{ background:var(--pixel-green); border-color:var(--pixel-green); color:var(--arcade-black); }
  .phone-players-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:6px; }
  .phone-players{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; max-height:110px; overflow-y:auto; }
  .phone-actions{ display:flex; flex-direction:column; gap:8px; }
  #copy-link-btn{ background:var(--surface-raised); color:var(--text-primary); border:1px solid var(--border-subtle); border-radius:8px; padding:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .start-btn{ display:none; }

  @media (max-width: 859px){
    header{ padding-block:12px; }
    .back-row{ padding-block:6px 0; }
    #lobby-main{ padding-block:10px; }
  }

  @media (min-width: 860px){
    .lobby-tv{ display:block; }
    .lobby-phone{ display:none; }
  }
</style>
</head>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

applyLang();
document.documentElement.style.visibility = '';
</script>
</body>
</html>
