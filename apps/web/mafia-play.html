<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Mafia — Bahjah</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/design-system/tokens.css">
<link rel="stylesheet" href="assets/mafia-theme.css">
<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; color:var(--text-primary); font-family:var(--font-body); line-height:1.6; overflow-x:hidden; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.15; font-weight:var(--weight-display); }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  .wrap{ max-width:720px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  /* Legacy var aliases: assets/lobby.js (shared across every game's play
     page, not modified here) inline-styles #lobby-strip using these three
     old token names -- keep them mapped to the new palette instead of
     touching that shared script. */
  body{ --brand:var(--mafia-red); --on-accent:var(--arcade-black); --muted:var(--text-muted); }

  header{ position:relative; z-index:5; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:20px; gap:16px; }
  .brand-logo{ display:block; height:28px; width:auto; filter:invert(1) brightness(1.7); }
  .back-link{ font-size:13px; font-weight:700; color:var(--text-muted); text-decoration:none; border-bottom:1px solid transparent; }
  .back-link:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  .back-icon-btn{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--border-subtle); color:var(--text-primary); flex-shrink:0; }
  .back-icon-btn:hover{ border-color:var(--border-strong); }
  [dir="rtl"] .back-icon-btn svg{ transform:scaleX(-1); }
  .back-row{ display:flex; padding-block:10px 0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; }
  .switch button{ background:none; border:none; color:var(--text-muted); padding:2px 3px; font-family:var(--font-pixel); }
  .switch button.active{ color:var(--cyber-cyan); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--border-strong); }
  .theme-btn{ background:none; border:1px solid var(--border-subtle); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-primary); }

  .btn{ border:none; border-radius:var(--radius-sm); font-weight:700; padding:13px 26px; font-size:15px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; transition:transform .12s ease; font-family:var(--font-display); text-transform:uppercase; letter-spacing:var(--tracking-caps); }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--mafia-red); color:var(--soft-white); }
  .btn-text{ background:none; padding:11px 4px; color:var(--text-primary); border-bottom:1px solid var(--border-strong); border-radius:0; font-weight:700; text-transform:none; letter-spacing:0; font-family:var(--font-body); }
  .btn-sm{ padding:9px 16px; font-size:12px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .stage{ padding-block:20px 64px; min-height:60vh; }
  .stage-inner{ width:100%; }

  .demo{ background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:28px; max-width:640px; margin:0 auto; border-top:2px solid var(--mafia-red); }
  .demo-title{ font-family:var(--font-display); font-weight:700; font-size:18px; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:12px; text-transform:uppercase; }
  .timer-bar{ width:100%; height:5px; border-radius:999px; background:var(--surface-raised); overflow:hidden; margin-bottom:16px; }
  .timer-bar-fill{ height:100%; width:100%; background:var(--mafia-red); border-radius:999px; transition:width .2s linear, background-color .2s ease; }
  .timer-bar-fill.is-danger{ background:var(--warning); }
  .demo-sub{ color:var(--text-muted); font-size:14px; margin-bottom:20px; }
  .role-reveal{ border-inline-start:3px solid var(--mafia-red); padding-inline-start:18px; margin-bottom:20px; }
  .role-reveal .tag-role{ display:block; font-weight:800; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mafia-red); margin-bottom:8px; }
  .role-reveal h3{ font-size:18px; font-weight:700; }
  .role-reveal p{ font-size:13px; color:var(--text-muted); margin-top:8px; }
  .suspect-list{ display:flex; flex-direction:column; }
  .suspect-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border-subtle); gap:10px; }
  .suspect-who{ display:flex; align-items:center; gap:10px; min-width:0; }
  .suspect-avatar{ width:32px; height:32px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--surface-raised); }
  .suspect-avatar img, .suspect-avatar svg{ width:100%; height:100%; display:block; }
  .suspect-name{ font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .suspect-name.dead{ color:var(--text-muted); text-decoration:line-through; }
  .chat-feed{ display:flex; flex-direction:column; gap:0; margin:16px 0; max-height:220px; overflow-y:auto; border-top:1px solid var(--border-subtle); }
  .chat-bubble{ padding:12px 4px; font-size:13px; border-bottom:1px solid var(--border-subtle); }
  .chat-bubble .who{ font-weight:700; color:var(--mafia-red); font-size:12px; display:block; margin-bottom:2px; }
  .narrator-line{ border-inline-start:3px dashed var(--border-subtle); padding-inline-start:14px; font-size:13px; font-style:italic; color:var(--text-muted); margin-bottom:16px; }
  .vote-tally{ font-size:13px; color:var(--text-muted); margin-top:14px; }
  .result-banner{ text-align:center; padding:20px 0; }
  .result-banner h3{ font-size:24px; font-weight:700; color:var(--mafia-red); text-transform:uppercase; }
  .result-banner p{ color:var(--text-muted); margin-top:8px; font-size:14px; }
  .demo-footer{ margin-top:20px; display:flex; justify-content:flex-end; gap:10px; }

  .final-stats{ display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--border-subtle); border-radius:var(--radius-md); margin-bottom:20px; overflow:hidden; }
  .final-stat{ flex:1 1 33%; min-width:110px; padding:14px; text-align:center; border-inline-end:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle); }
  .final-stat .stat-value{ font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--mafia-red); }
  .final-stat .stat-label{ font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }
  .waiting-note{ text-align:center; color:var(--text-muted); font-size:13px; margin-top:16px; }

  .ready-progress{ font-size:13px; color:var(--text-muted); margin-top:14px; }
  .notes-box{ width:100%; min-height:80px; margin-top:14px; padding:10px 12px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:13px; resize:vertical; }
  .notes-label{ font-size:12px; color:var(--text-muted); margin-top:18px; margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }

  footer{ position:relative; z-index:1; border-top:1px solid var(--border-subtle); padding-block:32px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .copy{ color:var(--text-muted); font-size:13px; }
  .social-icons{ display:flex; align-items:center; gap:16px; }
  .social-icon{ color:var(--text-muted); display:inline-flex; width:20px; height:20px; transition:color .15s ease; }
  .social-icon svg{ width:100%; height:100%; }
  .social-icon:hover{ color:var(--mafia-red); }
  .social-icon svg.icon-x{ transform:scale(1.05); }
  .social-icon svg.icon-tiktok{ transform:scale(1.13); }
  .social-icon svg.icon-instagram{ transform:scale(1.08); }
  .social-icon svg.icon-snapchat{ transform:scale(0.92); }
</style>
</head>

}

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

document.getElementById('sound-btn').innerHTML = window.BahjahSoundFx.isEnabled() ? '&#128266;' : '&#128263;';
applyLang();
document.documentElement.style.visibility = '';

document.getElementById('mf-hud-exit').addEventListener('click', () => {
  document.getElementById('mf-exit-overlay').style.display = 'flex';
});
document.getElementById('mf-exit-cancel').addEventListener('click', () => {
  document.getElementById('mf-exit-overlay').style.display = 'none';
});
document.getElementById('mf-exit-confirm').addEventListener('click', () => {
  window.location.href = 'bahjah-landing.html';
});
document.getElementById('mf-exit-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'mf-exit-overlay') document.getElementById('mf-exit-overlay').style.display = 'none';
});
document.getElementById('mf-night-transition').addEventListener('click', () => {
  document.getElementById('mf-night-transition').style.display = 'none';
});
document.getElementById('mf-vote-transition').addEventListener('click', () => {
  document.getElementById('mf-vote-transition').style.display = 'none';
});
document.getElementById('mf-elim-overlay').addEventListener('click', () => {
  document.getElementById('mf-elim-overlay').style.display = 'none';
});
</script>
