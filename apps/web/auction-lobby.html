<!-- Bump the ?v= token on every edit to assets/auction-theme.css: phones
     hold the old stylesheet otherwise and the change never shows up. -->
<link rel="stylesheet" href="assets/auction-theme.css?v=20261019">
<style>
  /* One page, four faces. The gate (01 Join) and the player lobby (02) are
     phone pages; a host holding the room on a phone gets the setup sheet
     (03); the host's screen on anything wide is the television (D1), drawn
     on the 1280 x 760 stage. body.is-tv / body.is-host-phone pick. */
  html, body{ min-height:100%; }
  #lobby-main{ display:none; }
  #host-console{ display:none; }
  .lobby-tv, .lobby-host{ display:none; }
  body.is-tv .lobby-phone, body.is-tv .lobby-host{ display:none; }
  body.is-tv .lobby-tv{ display:block; }
  body.is-host-phone .lobby-phone{ display:none; }
  body.is-host-phone .lobby-host{ display:block; }
  .auc-screen{ min-height:100dvh; }

  /* -- 01 Join (lobby-room.js shows the gate with display:flex, and
     #guest-entry with display:block) -- */
  #lobby-gate{ display:flex; flex-direction:column; min-height:100dvh; }
  #lobby-gate > .auc-phone{ width:100%; }
  #lobby-gate-message{ font-size:15px; font-weight:700; text-align:center; }
  #lobby-gate-message[data-tone="error"]{ color:var(--auc-cream); background:var(--auc-brick); padding:10px 12px; border-radius:var(--auc-radius); }
  #guest-entry{ display:none; }
  #guest-entry[style*="block"]{ display:flex !important; flex-direction:column; gap:16px; flex:1; }
  #guest-error{ font-size:14px; font-weight:700; color:var(--auc-cream); background:var(--auc-brick); padding:8px 12px; border-radius:var(--auc-radius); }
  #guest-error:empty{ display:none; }
  .gate-name[hidden]{ display:none; }
  .gate-scan{ font-size:13px; font-weight:600; text-align:center; color:var(--auc-oxblood); }

  /* -- 02 Player lobby -- */
  .in-title{ font-size:clamp(52px, 15vw, 70px); color:var(--auc-cream); }
  #phone-name{ background:none; border:0; padding:0; font:inherit; color:inherit; text-transform:inherit; text-align:start; cursor:pointer; }
  #phone-name-input{ width:100%; font-size:28px; padding:6px 10px; border:0; border-radius:var(--auc-radius); background:var(--auc-cream); color:var(--auc-ink); }
  .in-wait{ color:var(--auc-paddle); text-align:center; font-size:14px; font-weight:700; }

  /* -- 03 Host setup on a phone -- */
  .lobby-host .auc-top .auc-label{ color:var(--auc-brick); }
  .host-star{ color:var(--auc-brick); font-size:13px; font-weight:800; }
  .host-btns{ display:flex; gap:8px; margin-top:8px; }
  .host-btns .auc-btn--sm{ font-family:var(--auc-ui); font-size:13px; font-weight:700; text-transform:none; font-stretch:100%; min-height:32px; padding:0 10px; letter-spacing:0; font-variation-settings:normal; }
  .host-btns .auc-btn--line{ border-width:2px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .players-empty-note{ font-size:14px; font-weight:600; opacity:.7; }
  .auc .start-btn[style*="inline-block"]{ display:flex !important; }
  .start-note{ font-size:13px; font-weight:600; text-align:center; }
  .lobby-notice{ color:var(--auc-brick) !important; text-align:center; max-width:none !important; }
  .room-code-plain{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  /* -- D1 The television lobby -- */
  .tvl{ position:absolute; inset:0; display:grid; grid-template-columns:1.35fr 1fr; }
  .tvl-art{ position:relative; overflow:hidden; }
  .tvl-art .auc-wordmark{ position:absolute; top:44px; inset-inline-start:56px; font-size:150px; color:var(--auc-cream); z-index:2; }
  .tvl-art img{ position:absolute; left:-40px; bottom:-40px; width:820px; }
  .tvl-side{ padding:52px 44px 40px; display:flex; flex-direction:column; gap:26px; }
  .tvl-side .auc-label{ font-size:14px; }
  .tvl-code{ display:flex; align-items:center; gap:24px; }
  .tvl-code #room-qr{ width:170px; height:170px; border-width:6px; }
  .tvl-code .auc-codeword{ font-size:118px; }
  .tvl-bidders{ display:flex; flex-wrap:wrap; gap:14px 12px; }
  .tvl-bidder{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; font-weight:700; width:62px; text-align:center; }
  .tvl-bidder span:last-child{ max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tvl-cfg{ display:grid; grid-template-columns:1fr 1.25fr 1.4fr; gap:12px; }
  .tvl-cfg .auc-seg button{ min-height:38px; font-size:14px; white-space:nowrap; padding:0 4px; }
  .tvl-cfg .auc-label{ white-space:nowrap; letter-spacing:.08em; }
  .tvl-foot{ margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .tvl-foot .tvl-summary{ font-size:14px; font-weight:700; color:var(--auc-brick); max-width:200px; }
  .tvl-foot .start-btn{ min-width:300px; }
  .tvl-wait{ font-size:15px; font-weight:700; color:var(--auc-brick); }
</style>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
const U = window.AucUI;

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.querySelectorAll('.auc-langsw button').forEach(b => b.classList.toggle('is-on', b.dataset.lang === lang));
  document.querySelectorAll('[data-lang-toggle]').forEach(b => { b.textContent = lang === 'ar' ? 'EN' : 'ع'; });
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
    const ph = el.getAttribute('data-' + lang + '-ph');
    if(ph !== null) el.setAttribute('placeholder', ph);
  });
  document.querySelectorAll('[data-mark]').forEach(el => { el.innerHTML = U.mark(el.dataset.mark); });
  document.querySelectorAll('[data-wordmark]').forEach(el => { el.textContent = U.t('MAZAD', 'مزاد'); });
  document.getElementById('rules').innerHTML = [
    U.t('Bid how many answers you can name.', 'زايد على عدد الإجابات اللي تقدر تقولها.'),
    U.t('Others raise or pass.', 'الباقين يزايدون أو يمررون.'),
    U.t('SOLD. Now prove it before the timer runs out.', 'بيع! الحين أثبتها قبل ما يخلص الوقت.'),
  ].map((r, i) => `<div><b>${U.num(i + 1)}</b>${U.esc(r)}</div>`).join('');
  paintLobby();
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if (next === lang) return;
  lang = next;
  // Once someone picks a language by hand during a game, the game stops
  // switching it for them (see AucUI.adoptGameLang). The host's pick in the
  // lobby is the game's language, so it does not count there.
  if (document.getElementById('host-console')?.style.display === 'block') window.__aucPickedLang = true;
  applyLang();
  localStorage.setItem('bahjah_lang', lang);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('.auc-langsw button');
  if (b) setLang(b.dataset.lang);
  if (e.target.closest('[data-lang-toggle]')) setLang(lang === 'ar' ? 'en' : 'ar');
});

// The game is played in one language; when it starts, this screen follows.
window.aucUseLang = (next) => {
  if (next === lang) return;
  lang = next;
  applyLang();
};

// --- 01 Join: the four code boxes. The room link or QR fills them in; typing
// a different code and pressing Join goes to that room instead.
const boxes = Array.from(document.querySelectorAll('#gate-code input'));
boxes.forEach((input, i) => {
  input.value = code.charAt(i) || '';
  input.addEventListener('input', () => {
    const v = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    // A pasted code spreads across the boxes.
    if (v.length > 1) {
      v.split('').slice(0, boxes.length - i).forEach((ch, k) => { boxes[i + k].value = ch; });
      boxes[Math.min(boxes.length - 1, i + v.length - 1)].focus();
      return;
    }
    input.value = v;
    if (v && boxes[i + 1]) boxes[i + 1].focus();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !input.value && boxes[i - 1]) boxes[i - 1].focus();
    if (e.key === 'Enter') document.getElementById('guest-join-btn').click();
  });
});
const typedCode = () => boxes.map((b) => b.value).join('').toUpperCase();
document.addEventListener('click', (e) => {
  if (!e.target.closest('#guest-join-btn')) return;
  const typed = typedCode();
  if (typed && typed !== code) {
    e.stopPropagation();
    location.href = `auction-lobby.html?code=${encodeURIComponent(typed)}`;
  }
}, true);
// Signed in already, or no code at all: the join form still shows, with the
// name field only when it is needed.
if (!code) {
  document.getElementById('lobby-gate-message').style.display = 'none';
  document.getElementById('guest-entry').style.display = 'block';
  if (BahjahSession.getToken()) document.querySelector('.gate-name').hidden = true;
  boxes[0].focus();
}

// --- The lobby faces ------------------------------------------------------
let lobby = null;
// Players already drawn, so only a newcomer's paddle pops in.
const seen = new Set();
document.addEventListener('bahjah:lobby-update', (e) => {
  lobby = e.detail || null;
  paintLobby();
});

function paintLobby(){
  if (!lobby || !lobby.room) return;
  const room = lobby.room;
  // Once the game starts the host console owns the screen.
  if (room.status !== 'lobby') return;
  const players = room.members.filter((m) => !m.isHost);
  const host = Boolean(lobby.isPassiveScreen);
  const tv = host && window.innerWidth >= 900;
  document.body.classList.toggle('is-tv', tv);
  document.body.classList.toggle('is-host-phone', host && !tv);
  if (tv) U.fitTv(document.getElementById('tv-stage'));
  document.querySelector('meta[name="theme-color"]').content = host ? (tv ? '#1D1A1B' : '#F2E4CF') : '#5C1517';

  const meId = lobby.me && lobby.me.id;
  const countText = `${U.num(players.length)} / ${U.num(10)}`;
  document.getElementById('phone-count').textContent = countText;
  document.querySelectorAll('[data-player-count]').forEach((el) => { el.textContent = countText; });
  document.querySelectorAll('[data-short-link]').forEach((el) => { el.textContent = `${location.host}/j/${room.code}`.replace(/^www\./, ''); });
  document.querySelectorAll('.room-qr-img').forEach((img) => { if (!img.src) img.src = `/api/rooms/${encodeURIComponent(room.code)}/qr.svg`; });

  // 02: your paddle drawn biggest, everyone else's smaller, plus an empty
  // dashed seat while there is room.
  const seat = (id) => Math.max(0, players.findIndex((p) => p.userId === id));
  const pop = (id) => (seen.has(id) ? '' : 'pop');
  const others = players.filter((p) => p.userId !== meId);
  const mine = players.find((p) => p.userId === meId);
  document.getElementById('lobby-paddles').innerHTML = `
    ${mine ? U.paddle(mine.displayName, seat(meId), { isMe: true, handle: true, size: 150, cls: 'is-big' }) : ''}
    <div class="auc-lobby-others">
      ${others.map((p) => U.paddle(p.displayName, seat(p.userId), { size: 52, cls: `${pop(p.userId)} ${p.connected ? '' : 'is-offline'}`, colour: [['var(--auc-cream)', 'var(--auc-ink)'], ['var(--auc-orange)', 'var(--auc-cream)'], ['var(--auc-brick)', 'var(--auc-cream)']][seat(p.userId) % 3] })).join('')}
      ${players.length < 10 ? U.paddle('', 0, { size: 40, cls: 'is-empty', colour: ['none', 'var(--auc-cream)'] }) : ''}
    </div>`;
  // "أنت معنا / يا سارة." reads with يا before the name.
  document.getElementById('in-name-pre').textContent = lang === 'ar' ? 'يا ' : '';

  // 03 / D1: the players as chips (you in mustard) and as bidder paddles.
  document.querySelectorAll('[data-chips]').forEach((el) => {
    el.innerHTML = players.length
      ? players.map((p) => `<span class="auc-chip ${p.connected ? '' : 'is-offline'}">${U.esc(p.displayName)}</span>`).join('')
      : `<span class="players-empty-note">${U.t('Waiting for players to join…', 'بانتظار اللاعبين…')}</span>`;
  });
  // The design's row: mustard, orange, brick, oxblood, ink, in seat order.
  const tvColours = [['var(--auc-paddle)', 'var(--auc-ink)'], ['var(--auc-orange)', 'var(--auc-ink)'], ['var(--auc-brick)', 'var(--auc-cream)'], ['var(--auc-oxblood)', 'var(--auc-cream)'], ['var(--auc-ink)', 'var(--auc-cream)']];
  const bidders = players.map((p) => `<div class="tvl-bidder">${U.paddle(p.displayName, seat(p.userId), { size: 62, cls: `${pop(p.userId)} ${p.connected ? '' : 'is-offline'}`, colour: tvColours[seat(p.userId) % tvColours.length] })}<span>${U.esc(p.displayName)}</span></div>`);
  if (players.length < 10) bidders.push(`<div class="tvl-bidder">${U.paddle('', 0, { size: 62, cls: 'is-empty', colour: ['none', 'var(--auc-ink)'] })}<span></span></div>`);
  document.getElementById('tv-bidders').innerHTML = bidders.join('');

  players.forEach((p) => seen.add(p.userId));

  // Start unlocks at three bidders.
  const short = Math.max(0, 3 - players.length);
  document.querySelectorAll('.start-btn').forEach((b) => { b.disabled = short > 0; });
  document.querySelectorAll('[data-start-note]').forEach((el) => {
    el.textContent = short > 0 ? U.t(`Start unlocks at 3 players · ${short} more`, `يبدأ المزاد من ٣ لاعبين · باقي ${U.num(short)}`) : '';
  });
}

window.addEventListener('resize', paintLobby);

document.addEventListener('click', (e) => {
  if (!e.target.closest('[data-share-room]') || !lobby) return;
  const url = `${location.origin}/j/${lobby.room.code}`;
  const text = U.t('Join my Mazad auction on Bahjah', 'ادخل مزادي على بهجة');
  if (navigator.share) navigator.share({ text, url }).catch(() => {});
  else navigator.clipboard.writeText(`${text} ${url}`).then(() => toast(U.t('Link copied', 'تم نسخ الرابط')));
});

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1600);
}

applyLang();
// prefs-boot.js hides the document before first paint when the saved
// language is not English; the page hands visibility back once its own text
// has been swapped. Without this the page stays blank for every returning
// Arabic reader (see scripts/check-page-visibility.js).
document.documentElement.style.visibility = '';
</script>
</body>
</html>
