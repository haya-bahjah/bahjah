<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Trivia — Bahjah</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Trivia brand guidelines: core blue #203488, white/cream backgrounds,
     green #15803D as the "Submit"/action color. Display type is Tufuli
     Arabic in the guideline (bubbly, rounded, playful); Fredoka is the
     closest widely available Latin match, paired with Baloo Bhaijaan 2
     for Arabic. */
  :root{
    --bg:#0E1735; --surface:#203488; --surface-2:#2C46AC;
    --line:rgba(239,239,232,0.16); --text:#EFEFE8; --muted:#9FB0DD;
    --brand:#203488;
    --accent:#2FBE73; --on-accent:#0B2A1A;
    --good:#2FBE73; --bad:#E4574A;
    --font-display:'Fredoka', sans-serif; --font-body:'Cairo', sans-serif;
    --radius-a: 4px 20px 4px 20px; --radius-b: 20px 4px 20px 4px;
  }
  html[dir="rtl"]{ --font-display:'Baloo Bhaijaan 2', sans-serif; }
  [data-theme="light"]{
    --bg:#EFEFE8; --surface:#FFFFFF; --surface-2:#E4E4D8;
    --line:rgba(32,52,136,0.16); --text:#182347; --muted:#5B6690;
    --brand:#203488; --accent:#15803D; --on-accent:#FFFFFF;
    --good:#15803D; --bad:#C23B2E;
  }
  /* Saudi National Day seasonal theme: activates only when a room's
     category selection includes "Saudi National Day" (bank or
     host-authored custom category) -- see assets/trivia-play.js. Token
     values are the official SND guideline palette from the design
     handoff, unchanged from spec. Every other category keeps the default
     navy/lime theme above untouched. */
  [data-event-theme="national"]{
    --bg:#002528; --surface:#002D36; --surface-2:#00413C;
    --line:rgba(106,181,34,.30); --text:#EFEFE8; --muted:#A9C8A6;
    --brand:#008949;
    --accent:#6AB522; --on-accent:#002528;
    --good:#6AB522; --bad:#E4574A;
  }
  [data-event-theme="national"][data-theme="light"]{
    --bg:#F1F5EC; --surface:#FFFFFF; --surface-2:#E4EEDD;
    --line:rgba(0,137,73,.24); --text:#002528; --muted:#3F5B45;
    --brand:#008949; --accent:#008949; --on-accent:#FFFFFF;
    --good:#008949; --bad:#C23B2E;
  }
  [data-event-theme="national"] body{
    background-image:
      linear-gradient(45deg, rgba(106,181,34,.05) 25%, transparent 25%, transparent 75%, rgba(106,181,34,.05) 75%),
      linear-gradient(45deg, rgba(106,181,34,.05) 25%, transparent 25%, transparent 75%, rgba(106,181,34,.05) 75%);
    background-size: 64px 64px;
    background-position: 0 0, 32px 32px;
  }
  [data-event-theme="national"][data-theme="light"] body{
    background-image:
      linear-gradient(45deg, rgba(0,137,73,.06) 25%, transparent 25%, transparent 75%, rgba(0,137,73,.06) 75%),
      linear-gradient(45deg, rgba(0,137,73,.06) 25%, transparent 25%, transparent 75%, rgba(0,137,73,.06) 75%);
    background-size: 64px 64px;
    background-position: 0 0, 32px 32px;
  }
  .snd-lockup{ display:none; height:34px; width:auto; margin:0 auto 14px; }
  [data-event-theme="national"] .snd-lockup{ display:block; }
  /* Checkered card-edge band -- the approved SND artwork placement inside
     cards (README: do not put SND art behind copy, only this edge band). */
  [data-event-theme="national"] .demo{ position:relative; overflow:hidden; }
  [data-event-theme="national"] .demo::before{
    content:""; position:absolute; inset-block:0; inset-inline-start:0; width:26px;
    background-image:
      linear-gradient(45deg, rgba(106,181,34,.22) 25%, transparent 25%, transparent 75%, rgba(106,181,34,.22) 75%),
      linear-gradient(45deg, rgba(106,181,34,.22) 25%, transparent 25%, transparent 75%, rgba(106,181,34,.22) 75%);
    background-size: 26px 26px; background-position: 0 0, 13px 13px;
  }
  [data-event-theme="national"][data-theme="light"] .demo::before{
    background-image:
      linear-gradient(45deg, rgba(0,137,73,.18) 25%, transparent 25%, transparent 75%, rgba(0,137,73,.18) 75%),
      linear-gradient(45deg, rgba(0,137,73,.18) 25%, transparent 25%, transparent 75%, rgba(0,137,73,.18) 75%);
    background-size: 26px 26px; background-position: 0 0, 13px 13px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6; overflow-x:hidden; transition:background .3s ease, color .3s ease; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.12; font-weight:700; }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  .wrap{ max-width:1120px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  .grain{ position:fixed; inset:0; width:100%; height:100%; opacity:.05; pointer-events:none; z-index:50; mix-blend-mode:overlay; }
  [data-theme="light"] .grain{ opacity:.035; mix-blend-mode:multiply; }

  header{ position:relative; z-index:5; }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:22px; gap:16px; }
  .brand-logo{ display:block; height:32px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  [data-theme="light"]{ --logo-filter:brightness(0); }
  .back-link{ font-size:14px; font-weight:700; color:var(--muted); text-decoration:none; border-bottom:1px solid transparent; }
  .back-link:hover{ color:var(--text); border-color:var(--line); }
  .back-icon-btn{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); color:var(--text); flex-shrink:0; }
  .back-icon-btn:hover{ border-color:var(--text); }
  [dir="rtl"] .back-icon-btn svg{ transform:scaleX(-1); }
  .back-row{ display:flex; padding-block:10px 0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .nav-right{ display:flex; align-items:center; gap:16px; }
  .switch{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
  .switch button{ background:none; border:none; color:var(--muted); padding:2px 3px; font-weight:700; font-size:13px; }
  .switch button.active{ color:var(--text); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--line); }
  .theme-btn{ background:none; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text); }

  .btn{ border:none; border-radius:var(--radius-a); font-weight:700; padding:13px 26px; font-size:15px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; transition:transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--on-accent); }
  .btn-text{ background:none; padding:13px 4px; color:var(--text); border-bottom:1px solid var(--text); border-radius:0; font-weight:700; }
  .btn-sm{ padding:9px 18px; font-size:13px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .stage{ padding-block:28px 64px; min-height:70vh; display:flex; align-items:center; }
  .stage-inner{ width:100%; }

  .demo{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a); padding:32px; max-width:640px; margin:0 auto; border-top:2px solid var(--accent); }
  .demo-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13px; color:var(--muted); }
  .demo-meta{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .demo-score{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--accent); }
  .timer-bar{ width:100%; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-bottom:18px; }
  .timer-bar-fill{ height:100%; width:100%; background:var(--accent); border-radius:999px; transition:width .2s linear, background-color .2s ease; }
  .timer-bar-fill.is-danger{ background:var(--bad); }
  .q-text{ font-size:19px; font-weight:700; margin-bottom:20px; min-height:52px; font-family:var(--font-display); }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--line); }
  .opt{ background:var(--surface); border:none; padding:16px; font-size:14px; font-weight:600; text-align:start; color:var(--text); }
  .opt:hover:not(:disabled){ background:var(--surface-2); }
  .opt.correct{ background:var(--good); color:#fff; }
  .opt.wrong{ background:var(--bad); color:#fff; }
  .demo-footer{ margin-top:20px; display:flex; justify-content:flex-end; }
  .board{ display:flex; flex-direction:column; }
  .board-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); }
  .board-row.me{ font-weight:800; color:var(--accent); }
  .board-rank{ font-family:var(--font-display); font-weight:700; width:28px; }
  .board-name{ flex:1; }
  .board-pts{ color:var(--muted); }
  .board-row.winner{ color:var(--accent); }
  .board-row.winner .board-rank{ color:#f5b301; }
  .streak-tag{ font-size:11px; font-weight:700; color:var(--accent); background:var(--surface-2); border-radius:999px; padding:2px 7px; margin-inline-start:6px; }
  .round-breakdown{ margin-top:14px; font-size:13px; font-weight:600; color:var(--accent); }
  .round-breakdown.muted{ color:var(--muted); font-weight:500; }
  .winner-banner{ font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--accent); text-align:center; margin-bottom:18px; }

  .countdown-screen{ text-align:center; }
  .countdown-number{ font-family:var(--font-display); font-size:96px; font-weight:700; color:var(--accent); }
  .countdown-label{ font-size:18px; color:var(--muted); font-weight:700; margin-top:8px; }

  .personal-result{ text-align:center; }
  .personal-result .result-icon{ font-size:56px; margin-bottom:12px; }
  .personal-result .result-answer{ font-size:15px; color:var(--muted); margin-top:8px; }

  .final-stats{ display:flex; gap:0; border:1px solid var(--line); border-radius:var(--radius-a); margin-bottom:20px; overflow:hidden; }
  .final-stat{ flex:1; padding:16px; text-align:center; border-inline-end:1px solid var(--line); }
  .final-stat:last-child{ border-inline-end:none; }
  .final-stat .stat-value{ font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--accent); }
  .final-stat .stat-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }
  .waiting-note{ text-align:center; color:var(--muted); font-size:13px; margin-top:16px; }

  @media (max-width:560px){ .options{ grid-template-columns:1fr; } .final-stats{ flex-direction:column; } .final-stat{ border-inline-end:none; border-bottom:1px solid var(--line); } .final-stat:last-child{ border-bottom:none; } }
  footer{ position:relative; z-index:1; border-top:1px solid var(--line); padding-block:32px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .copy{ color:var(--muted); font-size:13px; opacity:.7; }
  .social-icons{ display:flex; align-items:center; gap:16px; }
  .social-icon{ color:var(--muted); display:inline-flex; width:20px; height:20px; transition:color .15s ease; }
  .social-icon svg{ width:100%; height:100%; }
  .social-icon:hover{ color:var(--brand); }
  /* Optical size correction: each brand mark fills a different
     proportion of its own 24x24 viewBox (Snapchat's ghost nearly
     bleeds to the edges, TikTok's note sits in a narrow column), so
     equal container size alone left them reading as different sizes.
     Scaling the svg itself keeps every anchor's box -- and therefore
     the gap between icons -- perfectly uniform. */
  .social-icon svg.icon-x{ transform:scale(1.05); }
  .social-icon svg.icon-tiktok{ transform:scale(1.13); }
  .social-icon svg.icon-instagram{ transform:scale(1.08); }
  .social-icon svg.icon-snapchat{ transform:scale(0.92); }
</style>
</head>
<body>

</div>

<div class="wrap" style="padding-top:14px;">
  <div id="lobby-strip" style="display:none; padding:12px 18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a); border-top:2px solid var(--brand); font-size:14px; color:var(--text);"></div>
</div>

</main>

<script src="assets/session.js"></script>
<script src="assets/sound-fx.js"></script>
<script src="assets/share-card.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="assets/lobby.js"></script>
<script src="assets/timer-bar.js"></script>
<script src="assets/ranked-board.js"></script>
<script src="assets/trivia-play.js"></script>
<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
let theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';

function toggleSound(){
  const on = window.BahjahSoundFx.toggle();
  document.getElementById('sound-btn').innerHTML = on ? '&#128266;' : '&#128263;';
  if(on) window.BahjahSoundFx.tick();
}

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
  localStorage.setItem('bahjah_theme', theme);
  if (window.BahjahSndTheme) window.BahjahSndTheme.refreshLockup();
}

document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
document.getElementById('sound-btn').innerHTML = window.BahjahSoundFx.isEnabled() ? '&#128266;' : '&#128263;';
applyLang();
document.documentElement.style.visibility = '';
</script>

</body>
</html>
