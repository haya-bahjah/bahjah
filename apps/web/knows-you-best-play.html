<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; color:var(--text-primary); font-family:var(--font-body); line-height:1.6; overflow-x:hidden; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.15; font-weight:700; }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  .wrap{ max-width:720px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  /* Legacy var aliases: assets/lobby.js and assets/kyb-match-board.js
     (shared, not modified here) inline-style using these old token names. */
  body{ --brand:var(--kyb-accent); --on-accent:var(--text-on-accent); --muted:var(--text-muted); --surface:var(--surface-card); --line:var(--border-subtle); --accent:var(--kyb-accent); }

  header{ position:relative; z-index:5; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:20px; gap:16px; }
  .brand-logo{ display:block; height:28px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  .back-link{ font-size:13px; font-weight:700; color:var(--text-muted); text-decoration:none; border-bottom:1px solid transparent; }
  .back-link:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  .back-icon-btn{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--border-subtle); color:var(--text-primary); flex-shrink:0; }
  .back-icon-btn:hover{ border-color:var(--border-strong); }
  [dir="rtl"] .back-icon-btn svg{ transform:scaleX(-1); }
  .back-row{ display:flex; padding-block:10px 0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; }
  .switch button{ background:none; border:none; color:var(--text-muted); padding:2px 3px; font-family:var(--font-pixel); }
  .switch button.active{ color:var(--cyber-cyan); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--border-strong); }
  .theme-btn{ background:none; border:1px solid var(--border-subtle); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-primary); }

  .stage{ padding-block:20px 64px; min-height:60vh; }
  .stage-inner{ width:100%; }

  .demo{ background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:28px; max-width:640px; margin:0 auto; border-top:2px solid var(--kyb-accent); }
  .demo-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13px; color:var(--text-muted); }
  .demo-meta{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
  .demo-score{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--kyb-accent); }
  .timer-bar{ width:100%; height:5px; border-radius:999px; background:var(--surface-raised); overflow:hidden; margin-bottom:16px; }
  .timer-bar-fill{ height:100%; width:100%; background:var(--kyb-accent); border-radius:999px; transition:width .2s linear, background-color .2s ease; }
  .timer-bar-fill.is-danger{ background:var(--danger); }
  .q-text{ font-size:19px; font-weight:700; margin-bottom:20px; min-height:52px; font-family:var(--font-display); text-align:center; }
  .demo-footer{ margin-top:20px; display:flex; justify-content:center; }

  .kyb-answer-input{ width:100%; padding:14px 16px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:15px; margin-bottom:14px; }
  .kyb-waiting{ text-align:center; color:var(--text-muted); font-size:14px; margin-top:10px; }

  .board{ display:flex; flex-direction:column; }
  .board-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border-subtle); }
  .board-row.me{ font-weight:800; color:var(--kyb-accent); }
  .board-rank{ font-family:var(--font-display); font-weight:700; width:28px; }
  .board-name{ flex:1; }
  .board-pts{ color:var(--text-muted); }
  .board-row.winner{ color:var(--kyb-accent); }
  .board-row.winner .board-rank{ color:var(--arcade-yellow); }
  .winner-banner{ font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--kyb-accent); text-align:center; margin-bottom:18px; }

  .reveal-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--border-subtle); gap:10px; }
  .reveal-row .rr-text{ flex:1; }
  .reveal-row .rr-author{ color:var(--text-muted); font-size:13px; white-space:nowrap; }
  .reveal-row.correct .rr-author{ color:var(--pixel-green); font-weight:700; }
  .reveal-row.incorrect .rr-author{ color:var(--kyb-accent); }

  .final-stats{ display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--border-subtle); border-radius:var(--radius-md); margin-bottom:20px; overflow:hidden; }
  .final-stat{ flex:1; min-width:110px; padding:16px; text-align:center; border-inline-end:1px solid var(--border-subtle); }
  .final-stat:last-child{ border-inline-end:none; }
  .final-stat .stat-value{ font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--kyb-accent); }
  .final-stat .stat-label{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:4px; }
  .top-guesser-note{ text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:16px; }
  .waiting-note{ text-align:center; color:var(--text-muted); font-size:13px; margin-top:16px; }

  footer{ position:relative; z-index:1; border-top:1px solid var(--border-subtle); padding-block:32px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .copy{ color:var(--text-muted); font-size:13px; }
  .social-icons{ display:flex; align-items:center; gap:16px; }
  .social-icon{ color:var(--text-muted); display:inline-flex; width:20px; height:20px; transition:color .15s ease; }
  .social-icon svg{ width:100%; height:100%; }
  .social-icon:hover{ color:var(--kyb-accent); }
  .social-icon svg.icon-x{ transform:scale(1.05); }
  .social-icon svg.icon-tiktok{ transform:scale(1.13); }
  .social-icon svg.icon-instagram{ transform:scale(1.08); }
  .social-icon svg.icon-snapchat{ transform:scale(0.92); }
</style>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';

function toggleSound(){
  const on = window.BahjahSoundFx.toggle();
  document.getElementById('sound-btn').innerHTML = on ? '&#128266;' : '&#128263;';
  if(on) window.BahjahSoundFx.tick();
}

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

document.getElementById('sound-btn').innerHTML = window.BahjahSoundFx.isEnabled() ? '&#128266;' : '&#128263;';
applyLang();
document.documentElement.style.visibility = '';
</script>
