<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;background:var(--kyb-page)}</style></head><body>
<div class="kyb-root" style="padding:26px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;"><div class="kyb-seat" style="--seat-accent:var(--kyb-pink);--seat-rot:-1.4deg"><div class="kyb-seat-face"><span class="kyb-avbox" style="width:64px;height:64px"><span class="kyb-av" style="--kyb-av-anim:kybHop .95s ease-in-out infinite"><span class="kyb-av-ear" style="left:11.11%;top:-12.96%;width:24.07%;height:46.30%;border-radius:50% 50% 36% 36%;background:var(--kyb-yellow);transform:rotate(-13deg)"></span><span class="kyb-av-ear" style="right:11.11%;top:-12.96%;width:24.07%;height:46.30%;border-radius:50% 50% 36% 36%;background:var(--kyb-yellow);transform:rotate(13deg)"></span><span class="kyb-av-body" style="height:70.37%;border-radius:50% 50% 46% 46%/44% 44% 56% 56%;background:var(--kyb-pink)"><span class="kyb-av-belly" style="height:44.7%;background:rgba(201,138,0,.5)"></span><span class="kyb-av-eye" style="left:32%"></span><span class="kyb-av-eye" style="right:32%"></span><span class="kyb-av-cheek" style="left:12%;background:var(--kyb-yellow)"></span><span class="kyb-av-cheek" style="right:12%;background:var(--kyb-yellow)"></span><span class="kyb-av-mouth"></span></span></span></span></div><span class="kyb-seat-name">Latifa</span><span class="kyb-badge kyb-badge--green">Ready</span></div><div class="kyb-seat" style="--seat-accent:var(--kyb-cyan);--seat-rot:1.1deg"><div class="kyb-seat-face"><span class="kyb-avbox" style="width:64px;height:64px"><span class="kyb-av" style="--kyb-av-anim:kybBob 1.5s ease-in-out infinite"><span class="kyb-av-ear" style="left:7.41%;top:1.85%;width:24.07%;height:24.07%;border-radius:50%;background:var(--kyb-cyan);transform:rotate(0deg)"></span><span class="kyb-av-ear" style="right:7.41%;top:1.85%;width:24.07%;height:24.07%;border-radius:50%;background:var(--kyb-cyan);transform:rotate(0deg)"></span><span class="kyb-av-body" style="height:74.07%;border-radius:46% 46% 52% 52%/40% 40% 62% 62%;background:var(--kyb-cyan)"><span class="kyb-av-belly" style="height:50.0%;background:rgba(255,255,255,.5)"></span><span class="kyb-av-eye" style="left:32%"></span><span class="kyb-av-eye" style="right:32%"></span><span class="kyb-av-cheek" style="left:12%;background:var(--kyb-pink)"></span><span class="kyb-av-cheek" style="right:12%;background:var(--kyb-pink)"></span><span class="kyb-av-mouth"></span></span></span></span></div><span class="kyb-seat-name">Omar</span><span class="kyb-badge">Joined</span></div><div class="kyb-seat kyb-seat--empty" style="--seat-rot:-.8deg"><div class="kyb-seat-q">?</div><span class="kyb-smeta">Waiting…</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:center"><span class="kyb-smeta">Room code</span><div class="kyb-code-tiles"><span>K</span><span>7</span><span>Q</span><span>Z</span></div></div></div>
</body></html>
