<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;background:var(--surface-page)}</style></head><body>
<div class="mn-root" style="padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:stretch;"><div class="mn-verdict mn-verdict--mafia" style="flex:1;min-width:300px"><span class="mn-pixel" style="color:rgba(238,45,35,.75);font-size:10px">Game over</span><h2 class="mn-verdict-title">The city never saw them.</h2><span class="mn-verdict-kicker">Mafia won the game</span><div class="mn-stats"><div class="mn-stat"><span>Rounds</span><b>4</b></div><div class="mn-stat-rule"></div><div class="mn-stat"><span>Mafia</span><b style="color:var(--mafia-red)">2</b></div><div class="mn-stat-rule"></div><div class="mn-stat"><span>Survivors</span><b>3</b></div></div><div style="margin-top:24px;display:flex;gap:12px"><button class="mn-btn mn-btn--hot mn-btn--md">Play again</button><button class="mn-btn mn-btn--ghost mn-btn--md">Share</button></div></div><div class="mn-verdict mn-verdict--village" style="flex:1;min-width:300px"><span class="mn-pixel" style="color:var(--night-navy);opacity:1;font-size:10px">Game over</span><h2 class="mn-verdict-title">The citizens saved the city.</h2><span class="mn-verdict-kicker">Citizens won the game</span><div class="mn-stats"><div class="mn-stat"><span>Rounds</span><b>5</b></div><div class="mn-stat-rule"></div><div class="mn-stat"><span>Survivors</span><b>4</b></div><div class="mn-stat-rule"></div><div class="mn-stat"><span>Saved</span><b>2</b></div></div><div style="margin-top:24px;display:flex;gap:12px"><button class="mn-btn mn-btn--primary mn-btn--md" style="background:var(--night-navy);color:var(--text-primary);border-color:var(--night-navy)">Play again</button></div></div></div>
</body></html>
