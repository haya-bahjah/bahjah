<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/malarkey-design-system-c3029479-fd56-4b08-95c9-4d3925f6c894/tokens/fonts.css">
<link rel="stylesheet" href="_ds/malarkey-design-system-c3029479-fd56-4b08-95c9-4d3925f6c894/tokens/colors.css">
<link rel="stylesheet" href="_ds/malarkey-design-system-c3029479-fd56-4b08-95c9-4d3925f6c894/tokens/effects.css">
<link rel="stylesheet" href="_ds/malarkey-design-system-c3029479-fd56-4b08-95c9-4d3925f6c894/styles.css">
<script src="_ds/malarkey-design-system-c3029479-fd56-4b08-95c9-4d3925f6c894/_ds_bundle.js"></script>
</helmet>
<div style="position:relative;width:{{ px }};height:{{ px }};flex:none">
  <div style="position:absolute;left:0;top:0;width:360px;height:360px;transform-origin:0 0;transform:{{ scale }}">
    <sc-if value="{{ isFull }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:18px;top:18px;width:324px;height:324px;border-radius:50%;background:var(--ink-orange);transform:translate(10px,8px)"></div>
      <div style="position:absolute;left:18px;top:18px;width:324px;height:324px;border-radius:50%;overflow:hidden;background:var(--tint-aqua);isolation:isolate">
        <div style="position:absolute;left:0;top:0;mix-blend-mode:multiply"><x-import component-from-global-scope="MalarkeyDesignSystem_c30294.RisoShape" shape="checker" color="var(--ink-aqua)" size="{{ 648 }}" grain="{{ false }}" hint-size="648px,648px"></x-import></div>
        <div style="position:absolute;left:-40px;top:-40px;mix-blend-mode:multiply"><x-import component-from-global-scope="MalarkeyDesignSystem_c30294.RisoShape" shape="checker" color="var(--ink-blue)" size="{{ 648 }}" grain="{{ false }}" hint-size="648px,648px"></x-import></div>
      </div>
      <x-import component-from-global-scope="MalarkeyDesignSystem_c30294.RisoShape" shape="sparkle" color="var(--ink-yellow)" misreg="var(--ink-orange)" size="{{ 70 }}" style="position:absolute;right:20px;top:20px" hint-size="70px,70px"></x-import>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <div style="position:relative;transform:rotate(3deg)">
          <span style="position:absolute;width:30px;height:30px;background:var(--paper-0);border-right:2.5px solid var(--ink-black);border-bottom:2.5px solid var(--ink-black);bottom:-16px;left:44px;transform:rotate(45deg);z-index:1"></span>
          <div style="position:relative;background:var(--paper-0);border:2.5px solid var(--ink-black);border-radius:24px;box-shadow:6px 6px 0 var(--ink-orange);padding:4px 26px 0" dir="rtl" lang="ar">
            <span style="font-family:'Lalezar',sans-serif;line-height:1.3;font-size:96px;color:var(--ink-blue);text-shadow:-4px 3px 0 var(--ink-orange);position:relative;z-index:2">تخاريف</span>
          </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ isIcon }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;border-radius:80px;border:5px solid var(--ink-black);overflow:hidden;background:var(--ink-aqua);isolation:isolate">
        <div style="position:absolute;left:-40px;top:-40px;mix-blend-mode:multiply"><x-import component-from-global-scope="MalarkeyDesignSystem_c30294.RisoShape" shape="checker" color="var(--ink-blue)" size="{{ 720 }}" grain="{{ false }}" hint-size="720px,720px"></x-import></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
          <div style="position:relative;transform:rotate(3deg)">
            <span style="position:absolute;width:44px;height:44px;background:var(--paper-0);border-right:5px solid var(--ink-black);border-bottom:5px solid var(--ink-black);bottom:-25px;left:40px;transform:rotate(45deg);z-index:1"></span>
            <div style="position:relative;width:190px;height:154px;background:var(--paper-0);border:5px solid var(--ink-black);border-radius:36px;box-shadow:8px 8px 0 var(--ink-orange);display:flex;align-items:center;justify-content:center">
              <span dir="rtl" lang="ar" style="font-family:'Lalezar',sans-serif;font-size:118px;line-height:1;padding-top:26px;color:var(--ink-blue);position:relative;z-index:2">ت</span>
            </div>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:360},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:200,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:24,&quot;max&quot;:600},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;icon&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full'|'icon'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const size = this.props.size ?? 200;
    const icon = (this.props.variant ?? 'full') === 'icon';
    return { px: size + 'px', scale: 'scale(' + size / 360 + ')', isFull: !icon, isIcon: icon };
  }
}
</script>
</body>
</html>
