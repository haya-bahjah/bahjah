<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@700;800;900&family=Silkscreen:wght@400;700&display=swap">
<style>
  html,body{ margin:0; background:transparent; }
  #frame{ width:1024px; height:1434px; }
</style>
</head>
<body>
<svg id="frame" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1434" width="1024" height="1434">
<defs>
  <!-- Card stock: not flat black, so the stepped frame and the figure both
       have something to sit on. -->
  <radialGradient id="stock" cx="50%" cy="38%" r="86%">
    <stop offset="0%"  stop-color="#14141A"/>
    <stop offset="58%" stop-color="#0A0A0E"/>
    <stop offset="100%" stop-color="#040406"/>
  </radialGradient>
  <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#2A2A33"/>
    <stop offset="100%" stop-color="#101016"/>
  </linearGradient>
  <linearGradient id="cheek" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#2E2E3C" stop-opacity="0"/>
    <stop offset="55%"  stop-color="#2E2E3C" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#33333F" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="brimShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#000000" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="faceClip">
    <path d="M512 544 C 588 544 610 596 606 660 C 602 726 566 776 512 776
             C 458 776 422 726 418 660 C 414 596 436 544 512 544 Z"/>
  </clipPath>
  <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#20202A"/>
    <stop offset="100%" stop-color="#0C0C12"/>
  </linearGradient>
  <!-- Cheap paper grain. feColorMatrix drops the colour so it stays texture
       rather than tinting the card. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
  <clipPath id="cardClip"><rect x="0" y="0" width="1024" height="1434" rx="46"/></clipPath>
  <clipPath id="archClip"><path d="M258 1218 L258 460 L298 460 L298 420 L338 420 L338 380 L378 380 L378 340 L418 340 L418 300 L458 300 L566 300 L566 340 L606 340 L606 380 L646 380 L646 420 L686 420 L686 460 L726 460 L726 1218 Z"/></clipPath>
  <!-- The portrait stops above the wordmark band; nesting this inside
       archClip intersects the two, which a single clipPath cannot do
       (multiple children union, they do not intersect). -->
  <clipPath id="artClip"><rect x="240" y="280" width="544" height="730"/></clipPath>

  <!-- The stepped art-deco arch, drawn once and echoed in red just inside. -->
  <path id="arch" d="M258 1218 L258 460 L298 460 L298 420 L338 420 L338 380 L378 380 L378 340 L418 340 L418 300 L458 300 L566 300 L566 340 L606 340 L606 380 L646 380 L646 420 L686 420 L686 460 L726 460 L726 1218 L686 1218 L686 1250 L646 1250 L646 1282 L606 1282 L606 1314 L418 1314 L418 1282 L378 1282 L378 1250 L338 1250 L338 1218 Z"/>

  <!-- Corner index: the A over its spade, reused rotated at the far corner. -->
  <g id="index">
    <text x="0" y="0" font-family="Tektur, Impact, sans-serif" font-weight="800"
          font-size="86" letter-spacing="2" fill="#D9D5C7" text-anchor="middle">A</text>
    <path transform="translate(0,96) scale(1.5)" fill="#8E1B14"
          d="M0 -26 C 10 -12 26 -4 26 8 C 26 20 16 26 8 26 C 4 26 1 24 0 21
             C -1 24 -4 26 -8 26 C -16 26 -26 20 -26 8 C -26 -4 -10 -12 0 -26 Z
             M-3 22 L-7 40 L7 40 L3 22 Z"/>
  </g>

  <!-- Tommy gun, in the same flat single-colour language as the card's other marks. -->
  <g id="tommy" fill="#8E1B14">
    <rect x="-96" y="-6" width="150" height="11" rx="3"/>
    <rect x="54" y="-4" width="58" height="7" rx="2"/>
    <path d="M-96 5 L-58 5 L-64 30 L-90 30 Z"/>
    <path d="M-30 5 L-8 5 L-8 22 L-30 22 Z"/>
    <circle cx="-19" cy="34" r="15"/>
    <circle cx="-19" cy="34" r="7" fill="#0A0A0E"/>
    <rect x="18" y="5" width="12" height="20" rx="3"/>
    <rect x="-100" y="-16" width="34" height="11" rx="4"/>
  </g>
</defs>

<!-- ---------------------------------------------------------------- stock -->
<g clip-path="url(#cardClip)">
  <rect width="1024" height="1434" fill="url(#stock)"/>

  <!-- Skyline + figure, clipped to the arch so the composition sits inside
       the frame the way the reference does. -->
  <g clip-path="url(#archClip)"><g clip-path="url(#artClip)">
    <!-- soft red bloom behind the head -->
    <g filter="url(#blur24)" opacity=".5">
      <ellipse cx="512" cy="640" rx="200" ry="210" fill="#8E1B14" fill-opacity=".2"/>
    </g>

    <!-- city -->
    <g fill="#191922">
      <rect x="258" y="600" width="58" height="300"/>
      <rect x="322" y="676" width="42" height="244"/>
      <rect x="370" y="596" width="50" height="324"/>
      <rect x="654" y="640" width="46" height="280"/>
      <rect x="706" y="556" width="52" height="364"/>
      <rect x="286" y="712" width="34" height="208" fill="#20202A"/>
      <rect x="620" y="700" width="30" height="220" fill="#20202A"/>
      <path d="M706 556 L732 500 L758 556 Z"/>
    </g>
    <g fill="#3A3A48" opacity=".55">
      <rect x="270" y="648" width="8" height="12"/><rect x="288" y="648" width="8" height="12"/>
      <rect x="270" y="684" width="8" height="12"/><rect x="296" y="704" width="8" height="12"/>
      <rect x="380" y="628" width="8" height="12"/><rect x="398" y="628" width="8" height="12"/>
      <rect x="380" y="668" width="8" height="12"/><rect x="716" y="596" width="8" height="12"/>
      <rect x="734" y="596" width="8" height="12"/><rect x="716" y="636" width="8" height="12"/>
      <rect x="664" y="684" width="8" height="12"/><rect x="682" y="720" width="8" height="12"/>
    </g>
    <rect x="258" y="900" width="468" height="40" fill="#0C0C12"/>

    <!-- shoulders -->
    <path d="M512 792 C 640 792 726 866 726 986 L726 1010 L298 1010 L298 986
             C 298 866 384 792 512 792 Z" fill="url(#suit)"/>
    <!-- pinstripes -->
    <g stroke="#3A3A48" stroke-width="2" opacity=".5" clip-path="url(#archClip)">
      <path d="M330 860 L330 1010"/><path d="M366 838 L366 1010"/>
      <path d="M402 822 L402 1010"/><path d="M438 812 L438 1010"/>
      <path d="M586 812 L586 1010"/><path d="M622 822 L622 1010"/>
      <path d="M658 838 L658 1010"/><path d="M694 860 L694 1010"/>
    </g>

    <!-- neck, shirt, lapels, tie -->
    <path d="M470 742 L554 742 L554 826 L470 826 Z" fill="#101016"/>
    <path d="M446 806 L512 872 L578 806 L604 824 L512 960 L420 824 Z" fill="#CFCBBD"/>
    <path d="M446 806 L512 872 L470 940 L406 848 Z" fill="url(#suit)"/>
    <path d="M578 806 L512 872 L554 940 L618 848 Z" fill="url(#suit)"/>
    <path d="M486 860 L538 860 L550 900 L512 924 L474 900 Z" fill="#8E1B14"/>
    <path d="M492 920 L532 920 L544 1078 L512 1112 L480 1078 Z" fill="#8E1B14"/>

    <!-- head: faceless, just the plane of a jaw catching light -->
    <path d="M512 544 C 588 544 610 596 606 660 C 602 726 566 776 512 776
             C 458 776 422 726 418 660 C 414 596 436 544 512 544 Z" fill="#151520"/>
    <g clip-path="url(#faceClip)">
      <rect x="410" y="536" width="204" height="250" fill="url(#cheek)"/>
      <!-- the brim throws the eyes into shadow; that is the whole look -->
      <rect x="410" y="536" width="204" height="120" fill="url(#brimShade)"/>
      <path d="M448 726 C 480 752 552 752 580 722 L580 786 L448 786 Z"
            fill="#0B0B11" opacity=".65"/>
    </g>

    <!-- fedora -->
    <path d="M394 516 L394 434 C 394 388 424 362 452 372 C 474 396 550 396 572 372
             C 600 362 630 388 630 434 L630 516 Z" fill="url(#crown)"/>
    <path d="M396 486 C 448 470 576 470 628 486 L630 516 L394 516 Z" fill="#08080C"/>
    <path d="M282 524 C 344 476 680 476 742 524 C 680 578 344 578 282 524 Z" fill="#2B2B36"/>
    <path d="M282 524 C 344 552 680 552 742 524 C 680 578 344 578 282 524 Z" fill="#101018"/>
    <path d="M420 380 C 460 404 470 424 464 452" stroke="#4A4A5A" stroke-width="5"
          fill="none" opacity=".7"/>
  </g>

  </g>

  <!-- grain over everything, low enough not to lift the blacks -->
  <rect width="1024" height="1434" filter="url(#grain)" opacity=".085"/>
  <rect width="1024" height="1434" fill="none" stroke="#000" stroke-width="26" opacity=".55" rx="46"/>
</g>

<!-- ---------------------------------------------------------------- frame -->
<rect x="17" y="17" width="990" height="1400" rx="38" fill="none"
      stroke="#8A8474" stroke-width="4" stroke-opacity=".75"/>
<rect x="31" y="31" width="962" height="1372" rx="30" fill="none"
      stroke="#8A8474" stroke-width="1.6" stroke-opacity=".3"/>

<!-- red echo first so the cream arch reads as the front layer -->
<use href="#arch" fill="none" stroke="#8E1B14" stroke-width="7"
     transform="translate(512,800) scale(1.034) translate(-512,-800)"/>
<use href="#arch" fill="none" stroke="#CFCBBD" stroke-width="7" stroke-opacity=".92"/>

<!-- crown above the arch's flat top -->
<g fill="#8E1B14" transform="translate(512,262)">
  <path d="M-40 18 L-40 -8 L-24 6 L-12 -18 L0 6 L12 -18 L24 6 L40 -8 L40 18 Z"/>
  <rect x="-40" y="24" width="80" height="9"/>
</g>

<!-- corner indices -->
<use href="#index" transform="translate(96,150)"/>
<use href="#index" transform="translate(928,1292) rotate(180)"/>

<!-- INSERT COIN: the one piece of arcade language on an otherwise 1940s card -->
<g transform="translate(664,738)">
  <rect x="-24" y="-142" width="48" height="284" rx="6" fill="none"
        stroke="#8E1B14" stroke-width="3.5"/>
  <text transform="rotate(90)" x="0" y="9" text-anchor="middle"
        font-family="Silkscreen, monospace" font-size="25" letter-spacing="5"
        fill="#8E1B14">INSERT COIN</text>
</g>

<!-- wordmark -->
<path d="M320 1052 L704 1052" stroke="#8E1B14" stroke-width="5"
      stroke-dasharray="26 16" stroke-opacity=".85"/>
<text x="512" y="1150" text-anchor="middle" font-family="Tektur, Impact, sans-serif"
      font-weight="900" font-size="112" letter-spacing="9" fill="#CFCBBD">MAFIA</text>
<path d="M320 1186 L704 1186" stroke="#8E1B14" stroke-width="5"
      stroke-dasharray="26 16" stroke-opacity=".85"/>
<use href="#tommy" transform="translate(512,1240) scale(.68)"/>

<!-- spade breaking the arch's bottom edge -->
<g transform="translate(512,1314)" fill="#CFCBBD">
  <path d="M0 -26 C 10 -12 26 -4 26 8 C 26 20 16 26 8 26 C 4 26 1 24 0 21
           C -1 24 -4 26 -8 26 C -16 26 -26 20 -26 8 C -26 -4 -10 -12 0 -26 Z
           M-3 22 L-7 40 L7 40 L3 22 Z"/>
</g>
</svg>
</body>
</html>
