<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<!-- A Welcome to a Saudi Home player's shareable result: bahjah.com/home/<token>.
     Public, no account needed. Shows only this one player's name, score and
     place. Every URL is absolute because the page lives under /home/. -->
<script src="/assets/prefs-boot.js"></script>
<title>Bahjah — Welcome to a Saudi Home</title>
<meta property="og:title" content="Welcome to a Saudi Home — Bahjah">
<meta property="og:description" content="I visited a Saudi home on Bahjah. Can you beat my score?">
<link rel="icon" type="image/png" href="/assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/saudi-home/saudi-home.css?v=20261013">
<style>
  .wash{position:fixed;inset:-60px;filter:url(#wc-bleed);z-index:0;pointer-events:none;
    background:radial-gradient(60% 70% at 20% 30%, rgba(224,168,46,.20), transparent 70%), radial-gradient(50% 60% at 85% 80%, rgba(168,50,31,.12), transparent 70%), radial-gradient(40% 40% at 70% 10%, rgba(47,166,184,.12), transparent 70%), var(--sand-100)}
  .grain{position:fixed}
  .wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:16px;padding:0 22px 26px}
  .card{border-radius:var(--radius-l);overflow:hidden;background:var(--sand-50);box-shadow:var(--shadow-lift);display:flex;flex-direction:column}
  #ok,#err{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wc-bleed" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="60"/></filter></svg>
<div class="wash"></div><div class="grain"></div>
<main class="wrap">
  <div class="sadu-band" style="height:8px;margin:0 -22px"></div>
  <a href="/" style="align-self:flex-start;margin-top:14px"><img src="/assets/saudi-home/logo-wordmark-red.svg" alt="Bahjah" style="width:110px;height:auto"></a>
  <div id="err" class="card" style="padding:30px;text-align:center;gap:10px">
    <div style="font:500 34px/1.1 var(--font-display)">This result link is not valid</div>
    <div style="font:italic 500 19px/1.4 var(--font-body);color:var(--ink-700)">It may have been mistyped. Discover more games on Bahjah.</div>
    <a class="btn btn--full" href="/" style="text-decoration:none;margin-top:10px">Play on Bahjah</a>
  </div>
  <div id="ok" style="flex-direction:column;gap:16px">
    <div class="card">
      <div class="sadu-band" style="height:8px"></div>
      <div style="height:250px;position:relative"><img src="/assets/saudi-home/rooms/final-results.webp" alt="" style="width:100%;height:100%;object-fit:cover">
        <div style="position:absolute;inset:0;background:var(--wash-protect)"></div>
        <div style="position:absolute;left:20px;bottom:18px;font:500 32px/1 var(--font-display);color:var(--sand-50)" id="r-game">Welcome to a Saudi Home</div></div>
      <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
        <span class="badge" id="r-champ" style="display:none;align-self:flex-start;background:var(--saffron-500);color:var(--ink-900)">Champion</span>
        <div class="cap" style="color:var(--ink-500)" id="r-visited"></div>
        <div style="display:flex;gap:28px">
          <div><div style="font:600 42px/1 var(--font-display)" id="r-score"></div><div class="cap" style="font-size:12px;line-height:1.6;color:var(--ink-500)">Points</div></div>
          <div><div style="font:600 42px/1 var(--font-display)" id="r-place"></div><div class="cap" style="font-size:12px;line-height:1.6;color:var(--ink-500)">Place</div></div>
        </div>
        <div style="font:italic 500 17px/1.3 var(--font-body);color:var(--ink-500)" id="r-of"></div>
        <img src="/assets/saudi-home/logo-wordmark-red.svg" alt="Bahjah" style="width:84px;height:auto">
      </div>
    </div>
    <button class="btn btn--l btn--full" id="share"><span class="ic" style="--i:url(/assets/saudi-home/icons/share.svg);--s:22px"></span>Share my result</button>
    <div style="display:flex;gap:10px">
      <button class="btn btn--secondary btn--full" id="copy"><span class="ic" style="--i:url(/assets/saudi-home/icons/link.svg);--s:18px"></span>Copy link</button>
      <button class="btn btn--secondary btn--full" id="save">Save image</button>
    </div>
    <a class="btn btn--ghost btn--full" href="/" style="text-decoration:none">More on Bahjah<span class="ic" style="--i:url(/assets/saudi-home/icons/arrow-up-right.svg);--s:18px"></span></a>
  </div>
</main>
<script>
(function () {
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  let result = null;
  const fmt = (n) => Number(n || 0).toLocaleString('en-US');
  const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  document.documentElement.style.visibility = '';

  fetch(`/api/games/saudi-home/results/${encodeURIComponent(token)}`)
    .then((res) => (res.ok ? res.json() : Promise.reject(res)))
    .then((data) => {
      result = data.result;
      document.getElementById('r-game').textContent = result.eventTitle.en;
      document.getElementById('r-visited').textContent = `${result.name} visited a Saudi home`;
      document.getElementById('r-score').textContent = fmt(result.score);
      document.getElementById('r-place').textContent = ordinal(result.rank);
      document.getElementById('r-of').textContent = `${result.correctCount} of ${result.questionCount} answered correctly · ${result.playerCount} ${result.playerCount === 1 ? 'player' : 'players'}`;
      if (result.champion) document.getElementById('r-champ').style.display = '';
      document.getElementById('ok').style.display = 'flex';
    })
    .catch(() => { document.getElementById('err').style.display = 'flex'; document.getElementById('err').style.flexDirection = 'column'; });

  function countShare() {
    fetch(`/api/games/saudi-home/results/${encodeURIComponent(token)}/share`, { method: 'POST' }).catch(() => {});
  }
  async function copyLink(btn) {
    try {
      await navigator.clipboard.writeText(location.href);
      const old = btn.innerHTML;
      btn.textContent = 'Link copied!';
      setTimeout(() => { btn.innerHTML = old; }, 2000);
    } catch (e) { prompt('Copy this link', location.href); }
  }

  document.getElementById('share').addEventListener('click', async (e) => {
    if (!result) return;
    countShare();
    const text = `I scored ${fmt(result.score)} points in ${result.eventTitle.en} on Bahjah`;
    if (navigator.share) {
      try { await navigator.share({ title: result.eventTitle.en, text, url: location.href }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; }
    }
    copyLink(e.currentTarget);
  });
  document.getElementById('copy').addEventListener('click', (e) => { countShare(); copyLink(e.currentTarget); });

  // The card as an image (1080x1350), drawn on a canvas in the page's own
  // fonts and painting, so it needs nothing from the server.
  function loadImg(src) {
    return new Promise((resolve) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = () => resolve(null); i.src = src; });
  }
  async function drawCard() {
    await document.fonts.ready;
    const W = 1080, H = 1350;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#F4E9D6'; ctx.fillRect(0, 0, W, H);
    // Sadu band.
    const band = [['#8A2516', 14], ['#2B1C13', 4], ['#FBF5EA', 4], ['#2B1C13', 4], ['#E0A82E', 4], ['#2B1C13', 4]];
    for (let x = 0; x < W;) for (const [col, w] of band) { ctx.fillStyle = col; ctx.fillRect(x, 0, w * 2, 20); x += w * 2; }
    const [paint, logo] = await Promise.all([loadImg('/assets/saudi-home/rooms/final-results.webp'), loadImg('/assets/saudi-home/logo-wordmark-red.svg')]);
    const ph = 640;
    if (paint) {
      const k = Math.max(W / paint.width, ph / paint.height);
      const sw = W / k, sh = ph / k;
      ctx.drawImage(paint, (paint.width - sw) / 2, (paint.height - sh) / 2, sw, sh, 0, 20, W, ph);
    }
    const g = ctx.createLinearGradient(0, 20 + ph, 0, 20 + ph * 0.4);
    g.addColorStop(0, 'rgba(43,28,19,.72)'); g.addColorStop(1, 'rgba(43,28,19,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 20, W, ph);
    ctx.fillStyle = '#FBF5EA';
    ctx.font = '500 84px "Cormorant Garamond", Georgia, serif';
    ctx.fillText(result.eventTitle.en, 60, 20 + ph - 50);
    ctx.fillStyle = '#6E5544';
    ctx.font = '600 30px "Cormorant Garamond", Georgia, serif';
    ctx.fillText(`${result.name} visited a Saudi home`.toUpperCase(), 60, 20 + ph + 90);
    ctx.fillStyle = '#2B1C13';
    ctx.font = '600 130px "Cormorant Garamond", Georgia, serif';
    ctx.fillText(fmt(result.score), 60, 20 + ph + 250);
    const sw = ctx.measureText(fmt(result.score)).width;
    ctx.fillText(ordinal(result.rank), 60 + sw + 90, 20 + ph + 250);
    ctx.fillStyle = '#6E5544';
    ctx.font = '600 28px "Cormorant Garamond", Georgia, serif';
    ctx.fillText('POINTS', 60, 20 + ph + 300);
    ctx.fillText('PLACE', 60 + sw + 90, 20 + ph + 300);
    if (result.champion) {
      ctx.fillStyle = '#E0A82E';
      ctx.fillRect(60, 20 + ph + 340, 220, 54);
      ctx.fillStyle = '#2B1C13';
      ctx.font = '700 28px "Cormorant Garamond", Georgia, serif';
      ctx.fillText('CHAMPION', 85, 20 + ph + 377);
    }
    if (logo) ctx.drawImage(logo, 60, H - 150, 220, 220 * (logo.height / logo.width || 0.45));
    ctx.fillStyle = '#4A3426';
    ctx.font = 'italic 500 34px "Cormorant Garamond", Georgia, serif';
    ctx.textAlign = 'right';
    ctx.fillText('Play on bahjah.com', W - 60, H - 80);
    return c;
  }

  document.getElementById('save').addEventListener('click', async () => {
    if (!result) return;
    const canvas = await drawCard();
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], 'bahjah-saudi-home.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { countShare(); await navigator.share({ files: [file], title: result.eventTitle.en }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'bahjah-saudi-home.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, 'image/png');
  });
})();
</script>
</body>
</html>
