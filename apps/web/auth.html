<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Sign in — Bahjah</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Lalezar&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1026; --surface:#241533; --surface-2:#2E1C42;
    --line:rgba(249,241,227,0.12); --text:#F9F1E3; --muted:#A492BA;
    --brand:#B24BF5; --on-accent:#170F22;
    --good:#2FBF9F; --bad:#FF6F61; --bad-dim:#5C2420;
    --font-display:'Fraunces', serif; --font-body:'Cairo', sans-serif;
    --radius-a: 4px 20px 4px 20px; --radius-b: 20px 4px 20px 4px;
  }
  html[dir="rtl"]{ --font-display:'Lalezar', sans-serif; }
  html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3{ font-weight:400; }
  [data-theme="light"]{
    --bg:#FBF4E4; --surface:#F1E6CE; --surface-2:#E9DAB9;
    --line:rgba(28,16,41,0.14); --text:#1C1029; --muted:#6B5C82;
    --brand:#8B2FD9; --on-accent:#170F22;
    --good:#0F8368; --bad:#B23A2E; --bad-dim:#F6D9D4;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6; overflow-x:hidden; transition:background .3s ease, color .3s ease; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.12; font-weight:700; }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  .wrap{ max-width:1120px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .narrow{ max-width:480px; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  .grain{ position:fixed; inset:0; width:100%; height:100%; opacity:.05; pointer-events:none; z-index:50; mix-blend-mode:overlay; }
  [data-theme="light"] .grain{ opacity:.035; mix-blend-mode:multiply; }
  .motif{ position:absolute; pointer-events:none; z-index:0; opacity:.5; }
  [data-theme="light"] .motif{ opacity:.3; }

  header{ position:relative; z-index:5; }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:22px; gap:16px; }
  .nav-brand{ flex-shrink:0; min-width:220px; }
  .brand-logo{ display:block; height:32px; width:auto; }
  [data-theme="light"] .brand-logo{ filter:invert(1); }
  .nav-links{ display:flex; gap:28px; list-style:none; padding:0; margin:0; flex-shrink:0; }
  .nav-links a, .nav-links button{ text-decoration:none; font-size:14px; color:var(--muted); font-weight:600; border-bottom:1px solid transparent; padding-bottom:2px; transition:color .15s, border-color .15s; background:none; border-top:none; border-left:none; border-right:none; padding-inline:0; }
  .nav-links a:hover, .nav-links button:hover{ color:var(--text); border-color:var(--line); }
  @media (max-width:820px){
    .nav-links{ display:none; }
    .nav-brand{ min-width:0; }
    .nav-right{ min-width:0; gap:10px; }
  }
  .back-link{ font-size:14px; font-weight:700; color:var(--muted); text-decoration:none; border-bottom:1px solid transparent; }
  .back-link:hover{ color:var(--text); border-color:var(--line); }
  .nav-right{ display:flex; align-items:center; justify-content:flex-end; gap:16px; flex-shrink:0; min-width:220px; }
  .switch{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
  .switch button{ background:none; border:none; color:var(--muted); padding:2px 3px; font-weight:700; font-size:13px; }
  .switch button.active{ color:var(--text); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--line); }
  .theme-btn{ background:none; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text); }

  .user-menu{ position:relative; display:inline-flex; }
  .user-avatar-btn{ width:32px; height:32px; border-radius:50%; padding:0; border:1px solid var(--line); background:var(--surface); cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .user-avatar-inner{ width:100%; height:100%; display:block; }
  .user-dropdown{
    position:absolute; top:calc(100% + 10px); inset-inline-end:0; min-width:190px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a);
    box-shadow:0 20px 40px -12px rgba(0,0,0,.5); padding:8px; display:none; flex-direction:column; gap:2px; z-index:50;
  }
  .session-user-menu.open .user-dropdown{ display:flex; }
  .user-dropdown-name{ padding:8px 10px 6px; font-size:13px; font-weight:800; color:var(--text); border-bottom:1px solid var(--line); margin-bottom:4px; }
  .user-dropdown-item{ display:block; width:100%; text-align:start; background:none; border:none; padding:9px 10px; border-radius:6px; font-size:14px; font-weight:600; color:var(--text); cursor:pointer; font-family:var(--font-body); }
  .user-dropdown-item:hover{ background:var(--surface-2); }
  .user-dropdown-danger{ color:var(--brand); }

  .btn{ border:none; border-radius:var(--radius-a); font-weight:700; padding:13px 26px; font-size:15px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; transition:transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--brand); color:var(--on-accent); width:100%; }
  .btn-text{ background:none; padding:13px 4px; color:var(--text); border-bottom:1px solid var(--text); border-radius:0; font-weight:700; }

  .kicker{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding-top:10px; border-top:1px solid var(--line); margin-bottom:16px; display:inline-block; }

  .hero{ position:relative; padding-block:56px 16px; text-align:center; }
  .hero h1{ font-size:clamp(32px,4.6vw,50px); }
  .hero p.sub{ margin-top:16px; font-size:16px; color:var(--muted); max-width:440px; margin-inline:auto; }

  .section{ padding-block:32px 88px; }

  .auth-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a); border-top:2px solid var(--brand); padding:8px 32px 32px; margin-inline:auto; }
  .auth-tabs{ display:flex; gap:28px; border-bottom:1px solid var(--line); margin-bottom:26px; }
  .auth-tab{ background:none; border:none; padding:16px 2px 14px; font-size:15px; font-weight:700; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .auth-tab.active{ color:var(--text); border-color:var(--brand); }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:7px; }
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
    padding:12px 14px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--brand); outline-offset:1px; }
  .field input::placeholder{ color:var(--muted); opacity:.65; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .phone-row{ display:grid; grid-template-columns:110px 1fr; gap:10px; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-inline-end:56px; }
  .pw-toggle{ position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:12px; font-weight:700; color:var(--muted); padding:4px; }
  .pw-toggle:hover{ color:var(--text); }
  .field-error{ font-size:12px; color:var(--bad); margin-top:6px; display:none; }
  .field-error.show{ display:block; }

  .check-row{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
  .check-row input[type="checkbox"]{ width:17px; height:17px; margin-top:2px; accent-color:var(--brand); flex-shrink:0; }
  .check-row label{ font-size:13px; color:var(--muted); line-height:1.5; }
  .check-row a{ color:var(--text); border-bottom:1px solid var(--text); text-decoration:none; }

  .auth-submit{ margin-top:22px; }
  .switch-line{ text-align:center; font-size:13px; color:var(--muted); margin-top:20px; }
  .switch-line button{ background:none; border:none; color:var(--text); font-weight:700; border-bottom:1px solid var(--text); padding:0; }
  footer{ position:relative; z-index:1; border-top:1px solid var(--line); padding-block:32px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .copy{ color:var(--muted); font-size:13px; opacity:.7; }
  .social-icons{ display:flex; align-items:center; gap:16px; }
  .social-icon{ color:var(--muted); display:inline-flex; width:20px; height:20px; transition:color .15s ease; }
  .social-icon svg{ width:100%; height:100%; }
  .social-icon:hover{ color:var(--brand); }


  .toast{ position:fixed; inset-inline:0; bottom:24px; display:flex; justify-content:center; z-index:60; pointer-events:none; }
  .toast-inner{ background:var(--text); color:var(--bg); font-weight:700; font-size:14px; padding:12px 22px; border-radius:var(--radius-a); opacity:0; transform:translateY(12px); transition:opacity .25s ease, transform .25s ease; max-width:80vw; text-align:center; }
  .toast-inner.show{ opacity:1; transform:translateY(0); }

  @media (max-width:520px){ .row-2{ grid-template-columns:1fr; } .phone-row{ grid-template-columns:100px 1fr; } .auth-card{ padding:8px 20px 24px; } }

  /* -- Diwaniya Modern layer (shared design system) -- */
  /* A kicker directly above a heading already carries the dots -- do not double-mark. */
  .kicker + h2::before, .section-head .kicker ~ h2::before{ display:none; }
  :root{
    --ember:#F5A83C; --ember-glow:rgba(245,168,60,.45);
  }
  [data-theme="light"]{
    --ember:#C9791A; --ember-glow:rgba(201,121,26,.35);
  }
  .kicker{ border-top:none; padding-top:0; display:inline-flex; align-items:center; }
  .kicker::before{
    content:""; display:inline-block; width:21px; height:8px; margin-inline-end:10px; flex-shrink:0;
    background:
      radial-gradient(circle 4px at 4px 4px, var(--ember) 98%, transparent),
      radial-gradient(circle 4px at 16px 4px, var(--ember) 98%, transparent);
  }
  .section-head h2::before{
    content:""; display:block; width:26px; height:10px; margin-bottom:16px;
    background:
      radial-gradient(circle 5px at 5px 5px, var(--ember) 98%, transparent),
      radial-gradient(circle 5px at 20px 5px, var(--ember) 98%, transparent);
  }
  .copy{ display:inline-flex; align-items:center; }
  .copy::before{
    content:""; display:inline-block; width:16px; height:6px; margin-inline-end:9px; flex-shrink:0; opacity:.8;
    background:
      radial-gradient(circle 3px at 3px 3px, var(--ember) 98%, transparent),
      radial-gradient(circle 3px at 12px 3px, var(--ember) 98%, transparent);
  }
  .btn-primary{ transition:transform .12s ease, box-shadow .25s ease; }
  .btn-primary:hover{ box-shadow:0 10px 30px -10px var(--ember-glow); }
  @keyframes rise{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  .hero h1{ animation:rise .7s cubic-bezier(.22,.9,.28,1) .05s both; }
  .hero p.sub, .hero .sub{ animation:rise .7s cubic-bezier(.22,.9,.28,1) .16s both; }
  .hero .hero-ctas{ animation:rise .7s cubic-bezier(.22,.9,.28,1) .27s both; }
  .hero .join-row{ animation:rise .7s cubic-bezier(.22,.9,.28,1) .38s both; }
  @media (prefers-reduced-motion:reduce){
    .hero h1, .hero p.sub, .hero .sub, .hero .hero-ctas, .hero .join-row{ animation:none; }
  }
</style>
</head>

          <label class="lang-fade" data-en="Confirm password" data-ar="تأكيد كلمة المرور">Confirm password</label>
          <div class="pw-wrap">
            <input type="password" id="su-password-confirm" required placeholder="••••••••">
            <button type="button" class="pw-toggle" onclick="togglePw('su-password-confirm', this)">Show</button>
          </div>
          <div class="field-error" id="pw-mismatch-error" data-en="Passwords don't match." data-ar="كلمتا المرور غير متطابقتين.">Passwords don't match.</div>

        <div class="check-row">

      <p class="switch-line">
        <span id="switch-to-signup">
          <span class="lang-fade" data-en="New to Bahjah? " data-ar="جديد على بهجة؟ ">New to Bahjah? </span>
          <button onclick="setTab('signup')" class="lang-fade" data-en="Create an account" data-ar="أنشئ حسابًا">Create an account</button>

        <span id="switch-to-signin" style="display:none;">
          <span class="lang-fade" data-en="Already have an account? " data-ar="لديك حساب بالفعل؟ ">Already have an account? </span>
          <button onclick="setTab('signin')" class="lang-fade" data-en="Sign in" data-ar="سجّل الدخول">Sign in</button>
        </span>
      </p>
    </div>
  </section>

<script src="assets/session.js"></script>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
let theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
let currentUser = null;

function updateSessionUI(){
  const menus = document.querySelectorAll('.session-user-menu');
  if(currentUser){
    menus.forEach(menu => {
      menu.style.display = '';
      menu.querySelector('.user-avatar-inner').innerHTML = window.BahjahAvatars.renderAvatarHtml(currentUser.avatar, currentUser.id);
      menu.querySelector('.user-dropdown-name').textContent = currentUser.fullName;
    });
  } else {
    menus.forEach(menu => { menu.style.display = 'none'; menu.classList.remove('open'); });
  }
}

function closeUserMenus(){
  document.querySelectorAll('.session-user-menu.open').forEach(m => m.classList.remove('open'));
}

document.addEventListener('click', (e) => {
  const avatarBtn = e.target.closest('.user-avatar-btn');
  if(avatarBtn){
    e.preventDefault();
    const menu = avatarBtn.closest('.session-user-menu');
    const wasOpen = menu.classList.contains('open');
    closeUserMenus();
    if(!wasOpen) menu.classList.add('open');
    return;
  }

  const item = e.target.closest('.user-dropdown-item');
  if(item){
    e.preventDefault();
    closeUserMenus();
    const action = item.dataset.action;
    if(action === 'signout'){
      BahjahSession.clear();
      currentUser = null;
      updateSessionUI();
    } else if(action === 'leaderboard'){
      window.location.href = 'leaderboard.html';
    } else if(action === 'profile'){
      window.location.href = 'profile.html';
    } else if(action === 'settings'){
      window.location.href = 'settings.html';
    }
    return;
  }

  if(!e.target.closest('.session-user-menu')) closeUserMenus();
});

async function initSession(){
  currentUser = await BahjahSession.fetchMe();
  updateSessionUI();
}

// Where to send the visitor after a successful sign-in/signup. Only
// same-origin, filename-only targets are allowed (e.g. from a QR-code
// join link's ?next=trivia-lobby.html%3Fcode%3DABC123) to avoid an open
// redirect via an attacker-supplied ?next= value.
function redirectAfterAuth(){
  const next = new URLSearchParams(location.search).get('next');
  if(next && /^\/?[a-zA-Z0-9_-]+\.html(\?[^\s]*)?$/.test(next)){
    window.location.href = next;
  } else {
    window.location.href = 'bahjah-landing.html';
  }
}

const AUTH_ERROR_MESSAGES = {
  EMAIL_TAKEN: { en: 'That email is already registered.', ar: 'هذا البريد الإلكتروني مسجل بالفعل.' },
  INVALID_CREDENTIALS: { en: 'Incorrect email or password.', ar: 'البريد الإلكتروني أو كلمة المرور غير صحيحة.' },
  VALIDATION_ERROR: { en: 'Please check your details and try again.', ar: 'يرجى التحقق من بياناتك والمحاولة مرة أخرى.' },
};
function authErrorMessage(error){
  const fallback = { en: 'Something went wrong — please try again.', ar: 'حدث خطأ ما — حاول مرة أخرى.' };
  const entry = (error && AUTH_ERROR_MESSAGES[error.code]) || fallback;
  return entry[lang];
}

function setTab(tab){
  const isSignin = tab === 'signin';
  document.getElementById('signin-form').style.display = isSignin ? '' : 'none';
  document.getElementById('signup-form').style.display = isSignin ? 'none' : '';
  document.getElementById('tab-signin').classList.toggle('active', isSignin);
  document.getElementById('tab-signup').classList.toggle('active', !isSignin);
  document.getElementById('switch-to-signup').style.display = isSignin ? '' : 'none';
  document.getElementById('switch-to-signin').style.display = isSignin ? 'none' : '';
}

function togglePw(id, btn){
  const input = document.getElementById(id);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? (lang === 'en' ? 'Show' : 'إظهار') : (lang === 'en' ? 'Hide' : 'إخفاء');
}

const FIELD_LABELS = {
  'si-email': { en: 'Email', ar: 'البريد الإلكتروني' },
  'si-password': { en: 'Password', ar: 'كلمة المرور' },
  'su-name': { en: 'Full name', ar: 'الاسم الكامل' },
  'su-email': { en: 'Email', ar: 'البريد الإلكتروني' },
  'su-dob': { en: 'Date of birth', ar: 'تاريخ الميلاد' },
  'su-phone': { en: 'Phone number', ar: 'رقم الهاتف' },
  'su-password': { en: 'Password', ar: 'كلمة المرور' },
  'su-password-confirm': { en: 'Confirm password', ar: 'تأكيد كلمة المرور' },
};
function fieldErrorMessage(input){
  const label = (FIELD_LABELS[input.id] || { en: input.id, ar: input.id })[lang];
  if(input.validity.typeMismatch){
    return lang === 'en' ? 'Please enter a valid email address.' : 'يرجى إدخال بريد إلكتروني صالح.';
  }
  if(input.validity.tooShort){
    return lang === 'en' ? `${label} must be at least ${input.minLength} characters.` : `يجب أن يتكون حقل "${label}" من ${input.minLength} أحرف على الأقل.`;
  }
  return lang === 'en' ? `${label} is required.` : `حقل "${label}" مطلوب.`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.getElementById('signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('si-email');
  const pw = document.getElementById('si-password');
  if(!email.checkValidity()){
    showToast(fieldErrorMessage(email));
    return;
  }
  if(!pw.checkValidity()){
    showToast(fieldErrorMessage(pw));
    return;
  }
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/auth/signin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value, password: pw.value }),
    });
    const data = await res.json();
    if(!res.ok){
      showToast(authErrorMessage(data.error));
      return;
    }
    BahjahSession.save(data.token, data.user);
    const firstName = data.user.fullName.split(' ')[0];
    showToast(lang === 'en' ? `Welcome back, ${firstName}!` : `أهلاً بعودتك، ${firstName}!`);
    setTimeout(redirectAfterAuth, 900);
  } catch (err) {
    showToast(lang === 'en' ? 'Network error — please try again.' : 'خطأ في الشبكة — حاول مرة أخرى.');
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const requiredIds = ['su-name','su-email','su-dob','su-phone','su-password','su-password-confirm'];
  const firstInvalid = requiredIds.map(id => document.getElementById(id)).find(el => !el.checkValidity());
  const termsOk = document.getElementById('su-terms').checked;
  const pw = document.getElementById('su-password').value;
  const pwConfirm = document.getElementById('su-password-confirm').value;
  const pwMatch = pw === pwConfirm;

  document.getElementById('pw-mismatch-error').classList.toggle('show', !pwMatch);

  if(firstInvalid){
    showToast(fieldErrorMessage(firstInvalid));
    return;
  }
  if(!pwMatch){
    showToast(lang === 'en' ? "Passwords don't match." : 'كلمتا المرور غير متطابقتين.');
    return;
  }
  if(!termsOk){
    showToast(lang === 'en' ? 'Please agree to the terms & conditions.' : 'يرجى الموافقة على الشروط والأحكام.');
    return;
  }

  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fullName: document.getElementById('su-name').value,
        email: document.getElementById('su-email').value,
        countryCode: document.getElementById('su-country-code').value,
        phone: document.getElementById('su-phone').value,
        dob: document.getElementById('su-dob').value,
        password: pw,
        marketingOptIn: document.getElementById('su-marketing').checked,
      }),
    });
    const data = await res.json();
    if(!res.ok){
      showToast(authErrorMessage(data.error));
      return;
    }
    BahjahSession.save(data.token, data.user);
    showToast(lang === 'en' ? 'Account created — welcome to Bahjah!' : 'تم إنشاء الحساب — أهلاً بك في بهجة!');
    setTimeout(redirectAfterAuth, 900);
  } catch (err) {
    showToast(lang === 'en' ? 'Network error — please try again.' : 'خطأ في الشبكة — حاول مرة أخرى.');
  } finally {
    submitBtn.disabled = false;
  }
});

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    const isTextShown = btn.previousElementSibling.type === 'text';
    btn.textContent = isTextShown ? (lang === 'en' ? 'Hide' : 'إخفاء') : (lang === 'en' ? 'Show' : 'إظهار');
  });
  updateSessionUI();
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
  localStorage.setItem('bahjah_theme', theme);
}

initSession();
document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
applyLang();
document.documentElement.style.visibility = '';
</script>
