<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Sign in — Bahjah</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; font-family:var(--font-body); line-height:1.6; overflow-x:hidden; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:var(--leading-heading); font-weight:var(--weight-display); }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  .wrap{ max-width:1120px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .narrow{ max-width:480px; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  header{ position:relative; z-index:5; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:22px; gap:16px; }
  .nav-brand{ flex-shrink:0; min-width:220px; }
  .brand-logo{ display:block; height:28px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  .nav-links{ display:flex; gap:28px; list-style:none; padding:0; margin:0; flex-shrink:0; }
  .nav-links a{ text-decoration:none; font-size:13px; font-family:var(--font-pixel); letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid transparent; padding-bottom:2px; transition:color .15s, border-color .15s; }
  .nav-links a:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  @media (max-width:820px){ .nav-links{ display:none; } .nav-brand{ min-width:0; } .nav-right{ min-width:0; gap:10px; } }
  .back-link{ font-size:14px; font-weight:700; color:var(--text-muted); text-decoration:none; border-bottom:1px solid transparent; }
  .back-link:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  .nav-right{ display:flex; align-items:center; justify-content:flex-end; gap:16px; flex-shrink:0; min-width:220px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; }
  .switch button{ background:none; border:none; color:var(--text-muted); padding:2px 3px; font-family:var(--font-pixel); }
  .switch button.active{ color:var(--cyber-cyan); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--border-strong); }

  .user-menu{ position:relative; display:inline-flex; }
  .user-avatar-btn{ width:32px; height:32px; border-radius:50%; padding:0; border:1px solid var(--border-strong); background:var(--surface-raised); cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .user-avatar-inner{ width:100%; height:100%; display:block; }
  .user-dropdown{
    position:absolute; top:calc(100% + 10px); inset-inline-end:0; min-width:190px;
    background:var(--surface-card); border:1px solid var(--border-strong); border-radius:var(--radius-md);
    box-shadow:var(--shadow-pop); padding:8px; display:none; flex-direction:column; gap:2px; z-index:50;
  }
  .session-user-menu.open .user-dropdown{ display:flex; }
  .user-dropdown-name{ padding:8px 10px 6px; font-size:13px; font-weight:800; color:var(--text-primary); border-bottom:1px solid var(--border-subtle); margin-bottom:4px; }
  .user-dropdown-item{ display:block; width:100%; text-align:start; background:none; border:none; padding:9px 10px; border-radius:6px; font-size:14px; font-weight:600; color:var(--text-primary); cursor:pointer; font-family:var(--font-body); }
  .user-dropdown-item:hover{ background:var(--surface-raised); }
  .user-dropdown-danger{ color:var(--neon-pink); }

  .kicker{ font-family:var(--font-pixel); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--electric-purple); }

  .hero{ position:relative; padding-block:56px 16px; text-align:center; animation:fadeUp .5s ease-out both; }
  .hero h1{ font-size:clamp(32px,4.6vw,50px); }
  .hero p.sub{ margin-top:16px; font-size:16px; color:var(--text-secondary); max-width:440px; margin-inline:auto; }

  .section{ padding-block:32px 88px; }

  .auth-card{ background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); border-top:2px solid var(--electric-purple); padding:8px 32px 32px; margin-inline:auto; }
  .auth-card .bh-btn{ width:100%; }
  .auth-tabs{ display:flex; gap:28px; border-bottom:1px solid var(--border-subtle); margin-bottom:26px; }
  .auth-tab{ background:none; border:none; padding:16px 2px 14px; font-size:15px; font-weight:700; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .auth-tab.active{ color:var(--text-primary); border-color:var(--electric-purple); }

  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:7px; }
  .field input, .field select{
    width:100%; background:var(--surface-raised); border:1px solid var(--border-subtle); border-radius:6px;
    padding:12px 14px; color:var(--text-primary); font-family:var(--font-body); font-size:14px;
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--electric-purple); outline-offset:1px; }
  .field input::placeholder{ color:var(--text-muted); opacity:.65; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .phone-row{ display:grid; grid-template-columns:110px 1fr; gap:10px; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-inline-end:56px; }
  .pw-toggle{ position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:12px; font-weight:700; color:var(--text-muted); padding:4px; }
  .pw-toggle:hover{ color:var(--text-primary); }
  .field-error{ font-size:12px; color:var(--neon-pink); margin-top:6px; display:none; }
  .field-error.show{ display:block; }

  .check-row{ display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; }
  .check-row input[type="checkbox"]{ width:17px; height:17px; margin-top:2px; accent-color:var(--electric-purple); flex-shrink:0; }
  .check-row label{ font-size:13px; color:var(--text-muted); line-height:1.5; }
  .check-row a{ color:var(--text-primary); border-bottom:1px solid var(--text-primary); text-decoration:none; }

  .auth-submit{ margin-top:22px; }
  .switch-line{ text-align:center; font-size:13px; color:var(--text-muted); margin-top:20px; }
  .switch-line button{ background:none; border:none; color:var(--text-primary); font-weight:700; border-bottom:1px solid var(--text-primary); padding:0; }
  footer{ position:relative; z-index:1; border-top:1px solid var(--border-subtle); padding-block:32px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .copy{ color:var(--text-muted); font-size:13px; }
  .social-icons{ display:flex; align-items:center; gap:16px; }
  .social-icon{ color:var(--text-muted); display:inline-flex; width:20px; height:20px; transition:color .15s ease; }
  .social-icon svg{ width:100%; height:100%; }
  .social-icon:hover{ color:var(--electric-purple); }
  .social-icon svg.icon-x{ transform:scale(1.05); }
  .social-icon svg.icon-tiktok{ transform:scale(1.13); }
  .social-icon svg.icon-instagram{ transform:scale(1.08); }
  .social-icon svg.icon-snapchat{ transform:scale(0.92); }

  .toast{ position:fixed; inset-inline:0; bottom:24px; display:flex; justify-content:center; z-index:60; pointer-events:none; }
  .toast-inner{ background:var(--soft-white); color:var(--arcade-black); font-weight:700; font-size:14px; padding:12px 22px; border-radius:var(--radius-md); opacity:0; transform:translateY(12px); transition:opacity .25s ease, transform .25s ease; max-width:80vw; text-align:center; }
  .toast-inner.show{ opacity:1; transform:translateY(0); }

  @media (max-width:520px){ .row-2{ grid-template-columns:1fr; } .phone-row{ grid-template-columns:100px 1fr; } .auth-card{ padding:8px 20px 24px; } }
</style>
</head>
<body class="bh-ds">

<header>
  <div class="wrap nav">
    <a href="bahjah-landing.html" class="nav-brand" style="display:flex;"><img class="brand-logo" src="assets/logos/bahjah-wordmark.png" alt="Bahjah"></a>
    <ul class="nav-links">
      <li><a href="about.html" class="lang-fade" data-en="About" data-ar="من نحن">About</a></li>
      <li><a href="contact.html" class="lang-fade" data-en="Contact" data-ar="تواصل معنا">Contact</a></li>
      <li><a href="our-games.html" class="lang-fade" data-en="Our Games" data-ar="ألعابنا">Our Games</a></li>
      <li><a href="how-to-play.html" class="lang-fade" data-en="How to Play" data-ar="طريقة اللعب">How to Play</a></li>
    </ul>
    <div class="nav-right">
      <div class="user-menu session-user-menu" style="display:none;">
        <button type="button" class="user-avatar-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="user-avatar-inner"></span>
        </button>
        <div class="user-dropdown">
          <div class="user-dropdown-name"></div>
          <button type="button" class="user-dropdown-item lang-fade" data-action="leaderboard" data-en="Leaderboard" data-ar="لوحة الصدارة">Leaderboard</button>
          <button type="button" class="user-dropdown-item lang-fade" data-action="profile" data-en="Profile" data-ar="الملف الشخصي">Profile</button>
          <button type="button" class="user-dropdown-item lang-fade" data-action="settings" data-en="Settings" data-ar="الإعدادات">Settings</button>
          <button type="button" class="user-dropdown-item user-dropdown-danger lang-fade" data-action="signout" data-en="Sign out" data-ar="تسجيل الخروج">Sign out</button>
        </div>
      </div>
      <div class="switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <span class="sep">/</span>
        <button id="btn-ar" onclick="setLang('ar')">ع</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap">
    <div class="kicker lang-fade" data-en="Account" data-ar="الحساب">Account</div>
    <h1 class="lang-fade" data-en="Join the party." data-ar="انضم إلى السهرة">Join the party.</h1>
    <p class="sub lang-fade" data-en="Sign in to jump back into a room, or create an account to start hosting game nights." data-ar="سجّل الدخول للعودة إلى غرفتك، أو أنشئ حسابًا لتبدأ استضافة ليالي الألعاب.">Sign in to jump back into a room, or create an account to start hosting game nights.</p>
  </section>

  <section class="section wrap">
    <div class="auth-card narrow">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin" onclick="setTab('signin')">
          <span class="lang-fade" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</span>
        </button>
        <button class="auth-tab" id="tab-signup" onclick="setTab('signup')">
          <span class="lang-fade" data-en="Sign up" data-ar="إنشاء حساب">Sign up</span>
        </button>
      </div>

      <form id="signin-form" novalidate>
        <div class="field">
          <label class="lang-fade" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
          <input type="email" id="si-email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label class="lang-fade" data-en="Password" data-ar="كلمة المرور">Password</label>
          <div class="pw-wrap">
            <input type="password" id="si-password" required placeholder="••••••••">
            <button type="button" class="pw-toggle" onclick="togglePw('si-password', this)">Show</button>
          </div>
        </div>
        <div class="auth-submit">
          <button type="submit" class="bh-btn bh-btn--primary bh-btn--md lang-fade" data-en="Sign in" data-ar="تسجيل الدخول">Sign in</button>
        </div>
      </form>

      <form id="signup-form" novalidate style="display:none;">
        <div class="field">
          <label class="lang-fade" data-en="Full name" data-ar="الاسم الكامل">Full name</label>
          <input type="text" id="su-name" required placeholder="Layla Ahmad">
        </div>
        <div class="field">
          <label class="lang-fade" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
          <input type="email" id="su-email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label class="lang-fade" data-en="Phone number" data-ar="رقم الهاتف">Phone number</label>
          <div class="phone-row">
            <select id="su-country-code" aria-label="Country code">
              <option value="+971">🇦🇪 +971</option>
              <option value="+966">🇸🇦 +966</option>
              <option value="+965">🇰🇼 +965</option>
              <option value="+974">🇶🇦 +974</option>
              <option value="+973">🇧🇭 +973</option>
              <option value="+968">🇴🇲 +968</option>
              <option value="+962">🇯🇴 +962</option>
              <option value="+961">🇱🇧 +961</option>
              <option value="+963">🇸🇾 +963</option>
              <option value="+964">🇮🇶 +964</option>
              <option value="+970">🇵🇸 +970</option>
              <option value="+20">🇪🇬 +20</option>
              <option value="+212">🇲🇦 +212</option>
              <option value="+213">🇩🇿 +213</option>
              <option value="+216">🇹🇳 +216</option>
              <option value="+218">🇱🇾 +218</option>
              <option value="+249">🇸🇩 +249</option>
              <option value="+967">🇾🇪 +967</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
              <option value="+33">🇫🇷 +33</option>
              <option value="+49">🇩🇪 +49</option>
              <option value="+91">🇮🇳 +91</option>
              <option value="+61">🇦🇺 +61</option>
            </select>
            <input type="tel" id="su-phone" required placeholder="50 123 4567">
          </div>
        </div>
        <div class="field">
          <label class="lang-fade" data-en="Date of birth" data-ar="تاريخ الميلاد">Date of birth</label>
          <input type="date" id="su-dob" required>
        </div>
        <div class="field">
          <label class="lang-fade" data-en="Password" data-ar="كلمة المرور">Password</label>
          <div class="pw-wrap">
            <input type="password" id="su-password" required placeholder="••••••••" minlength="8">
            <button type="button" class="pw-toggle" onclick="togglePw('su-password', this)">Show</button>
          </div>
        </div>
        <div class="field">
          <label class="lang-fade" data-en="Confirm password" data-ar="تأكيد كلمة المرور">Confirm password</label>
          <div class="pw-wrap">
            <input type="password" id="su-password-confirm" required placeholder="••••••••">
            <button type="button" class="pw-toggle" onclick="togglePw('su-password-confirm', this)">Show</button>
          </div>
          <div class="field-error" id="pw-mismatch-error" data-en="Passwords don't match." data-ar="كلمتا المرور غير متطابقتين.">Passwords don't match.</div>
        </div>

        <div class="check-row">
          <input type="checkbox" id="su-terms" required>
          <label for="su-terms">
            <span class="lang-fade" data-en="I agree to the " data-ar="أوافق على ">I agree to the </span><a href="#" onclick="return false;" class="lang-fade" data-en="terms &amp; conditions" data-ar="الشروط والأحكام">terms &amp; conditions</a>
          </label>
        </div>
        <div class="check-row">
          <input type="checkbox" id="su-marketing">
          <label for="su-marketing" class="lang-fade" data-en="I'd like to receive news and marketing materials." data-ar="أرغب في تلقي الأخبار والمواد التسويقية.">I'd like to receive news and marketing materials.</label>
        </div>

        <div class="auth-submit">
          <button type="submit" class="bh-btn bh-btn--primary bh-btn--md lang-fade" data-en="Create account" data-ar="إنشاء حساب">Create account</button>
        </div>
      </form>

      <p class="switch-line">
        <span id="switch-to-signup">
          <span class="lang-fade" data-en="New to Bahjah? " data-ar="جديد على بهجة؟ ">New to Bahjah? </span>
          <button onclick="setTab('signup')" class="lang-fade" data-en="Create an account" data-ar="أنشئ حسابًا">Create an account</button>
        </span>
        <span id="switch-to-signin" style="display:none;">
          <span class="lang-fade" data-en="Already have an account? " data-ar="لديك حساب بالفعل؟ ">Already have an account? </span>
          <button onclick="setTab('signin')" class="lang-fade" data-en="Sign in" data-ar="سجّل الدخول">Sign in</button>
        </span>
      </p>
    </div>
  </section>
</main>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
let currentUser = null;

function updateSessionUI(){
  const menus = document.querySelectorAll('.session-user-menu');
  if(currentUser){
    menus.forEach(menu => {
      menu.style.display = '';
      menu.querySelector('.user-avatar-inner').innerHTML = window.BahjahAvatars.renderAvatarHtml(currentUser.avatar, currentUser.id);
      menu.querySelector('.user-dropdown-name').textContent = currentUser.fullName;
    });
  } else {
    menus.forEach(menu => { menu.style.display = 'none'; menu.classList.remove('open'); });
  }
}

function closeUserMenus(){
  document.querySelectorAll('.session-user-menu.open').forEach(m => m.classList.remove('open'));
}

document.addEventListener('click', (e) => {
  const avatarBtn = e.target.closest('.user-avatar-btn');
  if(avatarBtn){
    e.preventDefault();
    const menu = avatarBtn.closest('.session-user-menu');
    const wasOpen = menu.classList.contains('open');
    closeUserMenus();
    if(!wasOpen) menu.classList.add('open');
    return;
  }

  const item = e.target.closest('.user-dropdown-item');
  if(item){
    e.preventDefault();
    closeUserMenus();
    const action = item.dataset.action;
    if(action === 'signout'){
      BahjahSession.clear();
      currentUser = null;
      updateSessionUI();
    } else if(action === 'leaderboard'){
      window.location.href = 'leaderboard.html';
    } else if(action === 'profile'){
      window.location.href = 'profile.html';
    } else if(action === 'settings'){
      window.location.href = 'settings.html';
    }
    return;
  }

  if(!e.target.closest('.session-user-menu')) closeUserMenus();
});

async function initSession(){
  currentUser = await BahjahSession.fetchMe();
  updateSessionUI();
}

// Where to send the visitor after a successful sign-in/signup. Only
// same-origin, filename-only targets are allowed (e.g. from a QR-code
// join link's ?next=trivia-lobby.html%3Fcode%3DABC123) to avoid an open
// redirect via an attacker-supplied ?next= value.
function redirectAfterAuth(){
  const next = new URLSearchParams(location.search).get('next');
  if(next && /^\/?[a-zA-Z0-9_-]+\.html(\?[^\s]*)?$/.test(next)){
    window.location.href = next;
  } else {
    window.location.href = 'bahjah-landing.html';
  }
}

const AUTH_ERROR_MESSAGES = {
  EMAIL_TAKEN: { en: 'That email is already registered.', ar: 'هذا البريد الإلكتروني مسجل بالفعل.' },
  INVALID_CREDENTIALS: { en: 'Incorrect email or password.', ar: 'البريد الإلكتروني أو كلمة المرور غير صحيحة.' },
  VALIDATION_ERROR: { en: 'Please check your details and try again.', ar: 'يرجى التحقق من بياناتك والمحاولة مرة أخرى.' },
};
function authErrorMessage(error){
  const fallback = { en: 'Something went wrong — please try again.', ar: 'حدث خطأ ما — حاول مرة أخرى.' };
  const entry = (error && AUTH_ERROR_MESSAGES[error.code]) || fallback;
  return entry[lang];
}

function setTab(tab){
  const isSignin = tab === 'signin';
  document.getElementById('signin-form').style.display = isSignin ? '' : 'none';
  document.getElementById('signup-form').style.display = isSignin ? 'none' : '';
  document.getElementById('tab-signin').classList.toggle('active', isSignin);
  document.getElementById('tab-signup').classList.toggle('active', !isSignin);
  document.getElementById('switch-to-signup').style.display = isSignin ? '' : 'none';
  document.getElementById('switch-to-signin').style.display = isSignin ? 'none' : '';
}

function togglePw(id, btn){
  const input = document.getElementById(id);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.textContent = showing ? (lang === 'en' ? 'Show' : 'إظهار') : (lang === 'en' ? 'Hide' : 'إخفاء');
}

const FIELD_LABELS = {
  'si-email': { en: 'Email', ar: 'البريد الإلكتروني' },
  'si-password': { en: 'Password', ar: 'كلمة المرور' },
  'su-name': { en: 'Full name', ar: 'الاسم الكامل' },
  'su-email': { en: 'Email', ar: 'البريد الإلكتروني' },
  'su-dob': { en: 'Date of birth', ar: 'تاريخ الميلاد' },
  'su-phone': { en: 'Phone number', ar: 'رقم الهاتف' },
  'su-password': { en: 'Password', ar: 'كلمة المرور' },
  'su-password-confirm': { en: 'Confirm password', ar: 'تأكيد كلمة المرور' },
};
function fieldErrorMessage(input){
  const label = (FIELD_LABELS[input.id] || { en: input.id, ar: input.id })[lang];
  if(input.validity.typeMismatch){
    return lang === 'en' ? 'Please enter a valid email address.' : 'يرجى إدخال بريد إلكتروني صالح.';
  }
  if(input.validity.tooShort){
    return lang === 'en' ? `${label} must be at least ${input.minLength} characters.` : `يجب أن يتكون حقل "${label}" من ${input.minLength} أحرف على الأقل.`;
  }
  return lang === 'en' ? `${label} is required.` : `حقل "${label}" مطلوب.`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

document.getElementById('signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('si-email');
  const pw = document.getElementById('si-password');
  if(!email.checkValidity()){
    showToast(fieldErrorMessage(email));
    return;
  }
  if(!pw.checkValidity()){
    showToast(fieldErrorMessage(pw));
    return;
  }
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/auth/signin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value, password: pw.value }),
    });
    const data = await res.json();
    if(!res.ok){
      showToast(authErrorMessage(data.error));
      return;
    }
    BahjahSession.save(data.token, data.user);
    const firstName = data.user.fullName.split(' ')[0];
    showToast(lang === 'en' ? `Welcome back, ${firstName}!` : `أهلاً بعودتك، ${firstName}!`);
    setTimeout(redirectAfterAuth, 900);
  } catch (err) {
    showToast(lang === 'en' ? 'Network error — please try again.' : 'خطأ في الشبكة — حاول مرة أخرى.');
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const requiredIds = ['su-name','su-email','su-dob','su-phone','su-password','su-password-confirm'];
  const firstInvalid = requiredIds.map(id => document.getElementById(id)).find(el => !el.checkValidity());
  const termsOk = document.getElementById('su-terms').checked;
  const pw = document.getElementById('su-password').value;
  const pwConfirm = document.getElementById('su-password-confirm').value;
  const pwMatch = pw === pwConfirm;

  document.getElementById('pw-mismatch-error').classList.toggle('show', !pwMatch);

  if(firstInvalid){
    showToast(fieldErrorMessage(firstInvalid));
    return;
  }
  if(!pwMatch){
    showToast(lang === 'en' ? "Passwords don't match." : 'كلمتا المرور غير متطابقتين.');
    return;
  }
  if(!termsOk){
    showToast(lang === 'en' ? 'Please agree to the terms & conditions.' : 'يرجى الموافقة على الشروط والأحكام.');
    return;
  }

  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fullName: document.getElementById('su-name').value,
        email: document.getElementById('su-email').value,
        countryCode: document.getElementById('su-country-code').value,
        phone: document.getElementById('su-phone').value,
        dob: document.getElementById('su-dob').value,
        password: pw,
        marketingOptIn: document.getElementById('su-marketing').checked,
      }),
    });
    const data = await res.json();
    if(!res.ok){
      showToast(authErrorMessage(data.error));
      return;
    }
    BahjahSession.save(data.token, data.user);
    showToast(lang === 'en' ? 'Account created — welcome to Bahjah!' : 'تم إنشاء الحساب — أهلاً بك في بهجة!');
    setTimeout(redirectAfterAuth, 900);
  } catch (err) {
    showToast(lang === 'en' ? 'Network error — please try again.' : 'خطأ في الشبكة — حاول مرة أخرى.');
  } finally {
    submitBtn.disabled = false;
  }
});

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    const isTextShown = btn.previousElementSibling.type === 'text';
    btn.textContent = isTextShown ? (lang === 'en' ? 'Hide' : 'إخفاء') : (lang === 'en' ? 'Show' : 'إظهار');
  });
  updateSessionUI();
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

initSession();
applyLang();
document.documentElement.style.visibility = '';
</script>
