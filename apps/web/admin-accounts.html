<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Internal tool, and the one that shows people's email addresses: keep it
     out of search results even though the API behind it is admin-gated. -->
<meta name="robots" content="noindex, nofollow">
<script src="assets/prefs-boot.js"></script>
<title>Bahjah — Accounts</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="stylesheet" href="assets/design-system/tokens.css">
<link rel="stylesheet" href="assets/design-system/base.css">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font-body); line-height:1.5; color:var(--text-primary); }
  h1,h2{ font-family:var(--font-display); margin:0; line-height:1.15; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 24px 64px; }

  header{ border-bottom:1px solid var(--border-subtle); margin-bottom:26px; }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:18px; gap:16px; }
  .brand-logo{ display:block; height:26px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  .kicker{ font-family:var(--font-pixel); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-muted); }
  .back-link{ font-size:13px; font-weight:700; color:var(--text-muted); text-decoration:none; }
  .back-link:hover{ color:var(--text-primary); }

  #gate{ min-height:60vh; display:grid; place-items:center; text-align:center; padding:24px; }
  #gate p{ color:var(--text-muted); margin-top:10px; max-width:420px; }
  #app{ display:none; }

  .page-head{ margin-bottom:22px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .page-head h1{ font-size:30px; }
  .page-head .sub{ color:var(--text-muted); font-size:14px; margin-top:6px; }

  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .search{ flex:1; min-width:220px; padding:10px 14px; border-radius:10px; border:1px solid var(--border-subtle);
    background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:14px; }
  .search:focus{ outline:none; border-color:var(--cyber-cyan); }
  .count{ font-size:12px; color:var(--text-muted); font-family:var(--font-pixel); letter-spacing:.06em; }

  .panel{ border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-card); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ text-align:start; padding:11px 14px; border-bottom:1px solid var(--border-subtle); vertical-align:top; }
  th{ font-size:11px; color:var(--text-muted); font-family:var(--font-pixel); letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:end; font-variant-numeric:tabular-nums; }

  /* The email is the thing this page exists for, so it reads as the primary
     line and the display name sits under it. Selectable and wrappable --
     copying an address out of here is the most likely reason to be looking. */
  .email{ font-weight:700; word-break:break-all; }
  .email.none{ color:var(--text-muted); font-weight:400; font-style:italic; }
  .name{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .when{ white-space:nowrap; }
  .when .ago{ font-size:11px; color:var(--text-muted); }

  .pill{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;
    font-family:var(--font-pixel); letter-spacing:.06em; white-space:nowrap; }
  .pill[data-s="paid"]{ color:var(--arcade-yellow); border:1px solid var(--arcade-yellow); }
  .pill[data-s="trial"]{ color:var(--cyber-cyan); border:1px solid var(--cyber-cyan); }
  .pill[data-s="unlimited"]{ color:var(--pixel-green); border:1px solid var(--pixel-green); }
  .pill[data-s="none"]{ color:var(--text-muted); border:1px solid var(--border-strong); }
  .tag{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-family:var(--font-pixel);
    border:1px solid var(--border-strong); color:var(--text-muted); margin-inline-end:4px; }
  .yes{ color:var(--pixel-green); }
  .no{ color:var(--text-muted); }

  .pager{ display:flex; gap:10px; align-items:center; justify-content:center; margin-top:16px; }
  .pager button{ padding:8px 14px; border-radius:999px; border:1px solid var(--border-subtle);
    background:none; color:var(--text-muted); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .pager button:hover:not(:disabled){ color:var(--text-primary); border-color:var(--border-strong); }
  .pager button:disabled{ opacity:.4; cursor:default; }
  .pager .where{ font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }

  .empty{ padding:22px; color:var(--text-muted); font-size:13px; text-align:center; }
  .caveat{ margin-top:34px; font-size:12px; color:var(--text-muted); line-height:1.7;
    border-top:1px solid var(--border-subtle); padding-top:16px; }

  /* Below ~760px the table stops being a table: each account becomes a card,
     because six columns on a phone is six columns nobody can read. */
  @media (max-width:760px){
    thead{ display:none; }
    tr{ display:block; border-bottom:1px solid var(--border-subtle); padding:12px 14px; }
    tr:last-child{ border-bottom:none; }
    td{ display:flex; justify-content:space-between; gap:12px; border:none; padding:3px 0; text-align:end; }
    td.who{ display:block; text-align:start; margin-bottom:6px; }
    td::before{ content:attr(data-label); font-size:11px; color:var(--text-muted);
      font-family:var(--font-pixel); letter-spacing:.1em; text-transform:uppercase; text-align:start; }
    td.who::before{ content:none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="bahjah-landing.html" style="display:flex;"><img class="brand-logo" src="assets/logos/bahjah-wordmark.png?v=20260823" alt="Bahjah"></a>
    <span class="kicker">Internal · Accounts</span>
    <a class="back-link" href="admin-analytics.html">← Analytics</a>
  </div>
</header>

<div id="gate" class="wrap">
  <div>
    <h2 id="gate-title" style="font-size:20px;">Checking access…</h2>
    <p id="gate-msg"></p>
    <form id="portal" style="display:none; margin-top:22px;">
      <label for="portal-pw" style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:8px;">Admin passphrase</label>
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <input type="password" id="portal-pw" autocomplete="current-password" spellcheck="false"
          style="padding:10px 14px; min-width:240px; border-radius:8px; border:1px solid var(--border-subtle);
                 background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:14px;">
        <button type="submit" id="portal-go"
          style="padding:10px 18px; border-radius:8px; border:1px solid var(--cyber-cyan); background:none;
                 color:var(--cyber-cyan); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;">Enter</button>
      </div>
      <p id="portal-err" style="margin-top:10px; font-size:13px; color:var(--neon-pink); min-height:18px;"></p>
    </form>
  </div>
</div>

<main id="app" class="wrap">
  <div class="page-head">
    <div>
      <h1>Accounts</h1>
      <p class="sub">Every real signup, newest first. Guests and practice players are not accounts and are not listed.</p>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="q" class="search" placeholder="Search email or name…" autocomplete="off" spellcheck="false">
    <span class="count" id="count"></span>
  </div>

  <div class="panel" id="panel"></div>
  <div class="pager" id="pager"></div>

  <p class="caveat" id="caveat"></p>
</main>

<script src="assets/session.js"></script>
<script src="assets/admin-portal.js?v=20260912"></script>
<script>
// The account list. Paged and searched on the server, so what arrives is what
// is rendered -- the browser never holds the whole user table.
let snapshot = null;
let page = 1;
let query = '';
let searchTimer = null;
let inFlight = 0;

function esc(s){
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function showGate(title, msg, offerPassphrase){
  document.getElementById('gate').style.display = 'grid';
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate-title').textContent = title;
  document.getElementById('gate-msg').textContent = msg || '';
  document.getElementById('portal').style.display = offerPassphrase ? '' : 'none';
  if(offerPassphrase) document.getElementById('portal-pw').focus();
}

const nf = new Intl.NumberFormat('en-US');
const dtf = new Intl.DateTimeFormat('en-GB', { day:'2-digit', month:'short', year:'numeric' });

// "3 days ago" beside the date: the date says exactly when, the relative form
// says whether it matters, and reading a signup list is mostly the second.
function ago(iso){
  const then = Date.parse(iso);
  if(!Number.isFinite(then)) return '';
  const mins = Math.round((Date.now() - then) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.round(hrs / 24);
  if(days < 31) return days + 'd ago';
  return Math.round(days / 30) + 'mo ago';
}

function when(iso){
  return `<div class="when">${esc(dtf.format(new Date(iso)))}<div class="ago">${esc(ago(iso))}</div></div>`;
}

function accessCell(a){
  const label = { paid:'Paid', trial:'Trial', unlimited:'Staff', none:'—' }[a.state] || a.state;
  const until = a.until ? `<div class="ago">until ${esc(dtf.format(new Date(a.until)))}</div>` : '';
  return `<span class="pill" data-s="${esc(a.state)}">${esc(label)}</span>${until}`;
}

function render(){
  const d = snapshot;
  const rows = d.accounts;

  document.getElementById('count').textContent = d.query
    ? `${nf.format(d.total)} matching "${d.query}"`
    : `${nf.format(d.total)} account${d.total === 1 ? '' : 's'}`;

  document.getElementById('panel').innerHTML = rows.length === 0
    ? `<div class="empty">${d.query ? 'No account matches that.' : 'No accounts yet.'}</div>`
    : `<table>
        <thead><tr>
          <th>Account</th><th>Joined</th><th>Access</th><th>Marketing</th>
          <th class="num">Games</th><th class="num">Payments</th><th>Promos</th>
        </tr></thead>
        <tbody>${rows.map((u) => `
          <tr>
            <td class="who">
              <div class="email${u.email ? '' : ' none'}">${esc(u.email || 'no email on file')}</div>
              <div class="name">${esc(u.fullName)}</div>
            </td>
            <td data-label="Joined">${when(u.createdAt)}</td>
            <td data-label="Access">${accessCell(u.access)}</td>
            <td data-label="Marketing"><span class="${u.marketingOptIn ? 'yes' : 'no'}">${u.marketingOptIn ? 'Opted in' : '—'}</span></td>
            <td class="num" data-label="Games">${nf.format(u.gamesPlayed)}</td>
            <td class="num" data-label="Payments">${nf.format(u.paymentsMade)}</td>
            <td data-label="Promos">${u.promoCodes.length
              ? u.promoCodes.map((c) => `<span class="tag">${esc(c)}</span>`).join('')
              : '<span class="no">—</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;

  const pages = Math.max(1, Math.ceil(d.total / d.pageSize));
  document.getElementById('pager').innerHTML = pages <= 1 ? '' : `
    <button type="button" id="prev"${d.page <= 1 ? ' disabled' : ''}>← Newer</button>
    <span class="where">Page ${nf.format(d.page)} of ${nf.format(pages)}</span>
    <button type="button" id="next"${d.page >= pages ? ' disabled' : ''}>Older →</button>`;
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  if(prev) prev.addEventListener('click', () => { page = Math.max(1, d.page - 1); load(); });
  if(next) next.addEventListener('click', () => { page = d.page + 1; load(); });

  document.getElementById('caveat').textContent =
    'Read straight from the users table, newest signup first. Guests — anyone who joined a room by code or QR without '
    + 'making an account — have no email and are not listed; they are counted on the Analytics page instead. '
    + 'Access is the same calculation the games use: Trial is the free window every signup gets, Paid covers a Day Pass, '
    + 'a Monthly, or a promo grant, and Staff is an account with unlimited access. Passwords, card details, phone numbers '
    + 'and dates of birth are never sent to this page.';
}

function whoAmI(){
  try {
    const u = BahjahSession.getUser();
    return u && u.email ? u.email : null;
  } catch (e) {
    return null;
  }
}

async function load(){
  const token = BahjahAdminPortal.authToken();
  if(!token){
    showGate('Admin access',
      'Enter the admin passphrase, or sign in with a Bahjah account that is on the admin list.', true);
    return;
  }
  // Typing fast fires several of these; only the newest one may paint, or a
  // slow early response lands on top of a later, correct one.
  const ticket = ++inFlight;
  const url = `/api/admin/accounts?page=${encodeURIComponent(page)}&q=${encodeURIComponent(query)}`;
  let res;
  try {
    res = await fetch(url, { headers: BahjahAdminPortal.authHeader() });
  } catch {
    if(!snapshot) showGate('Network error', 'Could not reach the server. Try again.');
    return;
  }
  if(ticket !== inFlight) return;
  if(res.status === 401){
    BahjahAdminPortal.signOut();
    showGate('Session expired', 'Enter the passphrase again, or sign in with an admin account.', true);
    return;
  }
  if(!res.ok){
    // 5xx is the server having a bad moment -- keep what is on screen. A 404
    // is this credential not being an admin one, which always returns to the
    // gate: leaving a list of email addresses up after the session died is
    // exactly the wrong failure for this page.
    if(res.status >= 500) return;
    const who = whoAmI();
    if(BahjahAdminPortal.hasPortalSession()) BahjahAdminPortal.signOut();
    showGate(
      'Admin access',
      (who ? `${who} is not on the admin list. ` : '')
      + 'Enter the admin passphrase instead, or add this account to ADMIN_EMAILS on the server.',
      true
    );
    return;
  }
  snapshot = await res.json();
  page = snapshot.page;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
}

document.getElementById('q').addEventListener('input', (e) => {
  query = e.target.value;
  page = 1;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(load, 250);
});

document.getElementById('portal').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('portal-pw');
  const btn = document.getElementById('portal-go');
  const err = document.getElementById('portal-err');
  const pw = input.value;
  if(!pw){ err.textContent = 'Enter the passphrase.'; return; }
  btn.disabled = true; input.disabled = true; err.textContent = '';
  const result = await BahjahAdminPortal.signIn(pw);
  btn.disabled = false; input.disabled = false;
  if(result.error){ err.textContent = result.error; input.select(); return; }
  input.value = '';
  load();
});

load();
</script>
</body>
</html>
