<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Bahjah — Confirming payment</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/design-system/tokens.css">
<link rel="stylesheet" href="assets/design-system/base.css">
<link rel="stylesheet" href="assets/design-system/arcade.css">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--surface-page); color:var(--text-primary); font-family:var(--font-body); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card{ text-align:center; max-width:420px; padding:40px 32px; }
  h1{ font-family:var(--font-display); font-size:24px; margin:0 0 12px; font-weight:var(--weight-display); }
  p{ color:var(--text-muted); font-size:14px; margin:0; }
  .spinner{ width:36px; height:36px; border-radius:50%; border:3px solid var(--surface-card); border-top-color:var(--electric-purple); margin:0 auto 20px; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body class="bh-ds">
<div class="card">
  <div class="spinner"></div>
  <h1 id="title">Confirming your payment…</h1>
  <p id="message">Please wait a moment.</p>
</div>

<script src="assets/session.js"></script>
<script src="assets/theme-toggle.js"></script>
<script src="assets/payments.js"></script>
<script>
const lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
const T = {
  confirming: { en: 'Confirming your payment…', ar: 'جارٍ تأكيد عملية الدفع…' },
  wait: { en: 'Please wait a moment.', ar: 'يرجى الانتظار قليلاً.' },
  success: { en: 'Payment successful!', ar: 'تمت عملية الدفع بنجاح!' },
  successSub: { en: 'Redirecting you back to Settings…', ar: 'جارٍ إعادتك إلى الإعدادات…' },
  failed: { en: 'Payment did not complete.', ar: 'لم تكتمل عملية الدفع.' },
  failedSub: { en: 'Redirecting you back to Settings…', ar: 'جارٍ إعادتك إلى الإعدادات…' },
  noId: { en: 'No payment reference found.', ar: 'لم يتم العثور على مرجع الدفع.' },
};

async function run() {
  const params = new URLSearchParams(location.search);
  const paymentId = params.get('id');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');

  if (!paymentId) {
    titleEl.textContent = T.failed[lang];
    messageEl.textContent = T.noId[lang];
    setTimeout(() => { location.href = 'settings.html'; }, 1800);
    return;
  }

  const token = BahjahSession.getToken();
  if (!token) {
    location.href = `auth.html?next=${encodeURIComponent('settings.html')}`;
    return;
  }

  try {
    const result = await BahjahPayments.confirmPayment(token, paymentId);
    if (result.status === 'paid') {
      titleEl.textContent = T.success[lang];
      messageEl.textContent = T.successSub[lang];
      location.href = 'settings.html?billing=success';
    } else {
      titleEl.textContent = T.failed[lang];
      messageEl.textContent = T.failedSub[lang];
      setTimeout(() => { location.href = 'settings.html?billing=failed'; }, 1600);
    }
  } catch {
    titleEl.textContent = T.failed[lang];
    messageEl.textContent = T.failedSub[lang];
    setTimeout(() => { location.href = 'settings.html?billing=failed'; }, 1600);
  }
}

document.getElementById('title').textContent = T.confirming[lang];
document.getElementById('message').textContent = T.wait[lang];
run();
</script>
</body>
</html>
