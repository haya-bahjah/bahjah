<style>
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; font-family:var(--font-body); line-height:1.6; overflow-x:hidden; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:var(--leading-heading); font-weight:var(--weight-display); }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  .wrap{ max-width:820px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  header{ position:relative; z-index:5; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:22px; gap:16px; }
  .nav-brand{ flex-shrink:0; min-width:220px; }
  .brand-logo{ display:block; height:28px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  .nav-links{ display:flex; gap:28px; list-style:none; padding:0; margin:0; flex-shrink:0; }
  .nav-links a{ text-decoration:none; font-size:13px; font-family:var(--font-pixel); letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid transparent; padding-bottom:2px; transition:color .15s, border-color .15s; }
  .nav-links a:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  @media (max-width:820px){ .nav-links{ display:none; } .nav-brand{ min-width:0; } .nav-right{ min-width:0; gap:10px; } }
  .back-link{ font-size:14px; font-weight:700; color:var(--text-muted); text-decoration:none; border-bottom:1px solid transparent; }
  .back-link:hover{ color:var(--text-primary); border-color:var(--border-strong); }
  .nav-right{ display:flex; align-items:center; justify-content:flex-end; gap:16px; flex-shrink:0; min-width:220px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; }
  .switch button{ background:none; border:none; color:var(--text-muted); padding:2px 3px; font-family:var(--font-pixel); }
  .switch button.active{ color:var(--cyber-cyan); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--border-strong); }

  .user-menu{ position:relative; display:inline-flex; }
  .user-avatar-btn{ width:32px; height:32px; border-radius:50%; padding:0; border:1px solid var(--border-strong); background:var(--surface-raised); cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .user-avatar-inner{ width:100%; height:100%; display:block; }
  .user-dropdown{
    position:absolute; top:calc(100% + 10px); inset-inline-end:0; min-width:190px;
    background:var(--surface-card); border:1px solid var(--border-strong); border-radius:var(--radius-md);
    box-shadow:var(--shadow-pop); padding:8px; display:none; flex-direction:column; gap:2px; z-index:50;
  }
  .session-user-menu.open .user-dropdown{ display:flex; }
  .user-dropdown-name{ padding:8px 10px 6px; font-size:13px; font-weight:800; color:var(--text-primary); border-bottom:1px solid var(--border-subtle); margin-bottom:4px; }
  .user-dropdown-item{ display:block; width:100%; text-align:start; background:none; border:none; padding:9px 10px; border-radius:6px; font-size:14px; font-weight:600; color:var(--text-primary); cursor:pointer; font-family:var(--font-body); }
  .user-dropdown-item:hover{ background:var(--surface-raised); }
  .user-dropdown-danger{ color:var(--neon-pink); }

  .kicker{ font-family:var(--font-pixel); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--electric-purple); }
  .hero{ position:relative; padding-block:48px 8px; animation:fadeUp .5s ease-out both; }
  .hero h1{ font-size:clamp(30px,4.4vw,44px); }
  .hero p.sub{ margin-top:14px; font-size:15px; color:var(--text-secondary); max-width:520px; }

  .section{ padding-block:28px; }

  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .filter-chip{ background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; color:var(--text-muted); }
  .filter-chip.active{ background:var(--electric-purple); color:var(--soft-white); border-color:var(--electric-purple); }

  .empty-state{ background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:48px 24px; text-align:center; color:var(--text-muted); font-size:14px; }
  .empty-state a{ color:var(--electric-purple); font-weight:700; text-decoration:none; border-bottom:1px solid var(--electric-purple); }

  .history-card{ background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); border-top:2px solid var(--electric-purple); padding:20px 22px; margin-bottom:16px; }
  .hc-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; cursor:pointer; }
  .hc-meta{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hc-badge{ font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:999px; background:var(--surface-raised); color:var(--text-primary); }
  .hc-code{ font-size:12px; color:var(--text-muted); font-weight:700; letter-spacing:1px; }
  .hc-date{ font-size:12px; color:var(--text-muted); }
  .hc-toggle{ font-size:12px; color:var(--text-muted); font-weight:700; }

  .hc-top-finishers{ margin-top:12px; font-size:14px; color:var(--text-primary); }
  .hc-top-finishers b{ font-weight:800; }

  .hc-actions{ display:flex; gap:10px; margin-top:14px; }

  .hc-details{ display:none; margin-top:16px; border-top:1px solid var(--border-subtle); padding-top:14px; }
  .history-card.open .hc-details{ display:block; }
  .history-card.open .hc-toggle .chevron{ transform:rotate(180deg); }
  .chevron{ display:inline-block; transition:transform .15s ease; }

  .result-row{ display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border-subtle); }
  .result-row:last-child{ border-bottom:none; }
  .result-rank{ width:22px; font-size:13px; font-weight:800; color:var(--text-muted); flex-shrink:0; }
  .result-avatar{ width:32px; height:32px; border-radius:50%; overflow:hidden; flex-shrink:0; }
  .result-name{ flex:1; font-size:14px; font-weight:600; }
  .result-score{ font-size:13px; color:var(--text-muted); font-weight:700; }
  .result-winner{ color:var(--arcade-yellow); font-size:14px; margin-inline-start:2px; }

  .pagination{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:24px; }
  .pagination button:disabled{ opacity:.4; cursor:default; }
  .pagination-label{ font-size:13px; color:var(--text-muted); font-weight:700; }
  footer{ position:relative; z-index:1; border-top:1px solid var(--border-subtle); padding-block:32px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .copy{ color:var(--text-muted); font-size:13px; }
  .social-icons{ display:flex; align-items:center; gap:16px; }
  .social-icon{ color:var(--text-muted); display:inline-flex; width:20px; height:20px; transition:color .15s ease; }
  .social-icon svg{ width:100%; height:100%; }
  .social-icon:hover{ color:var(--electric-purple); }
  .social-icon svg.icon-x{ transform:scale(1.05); }
  .social-icon svg.icon-tiktok{ transform:scale(1.13); }
  .social-icon svg.icon-instagram{ transform:scale(1.08); }
  .social-icon svg.icon-snapchat{ transform:scale(0.92); }

  .toast{ position:fixed; inset-inline:0; bottom:24px; display:flex; justify-content:center; z-index:60; pointer-events:none; }
  .toast-inner{ background:var(--soft-white); color:var(--arcade-black); font-weight:700; font-size:14px; padding:12px 22px; border-radius:var(--radius-md); opacity:0; transform:translateY(12px); transition:opacity .25s ease, transform .25s ease; max-width:80vw; text-align:center; }
  .toast-inner.show{ opacity:1; transform:translateY(0); }

  @media (max-width:520px){ .hc-top{ flex-direction:column; align-items:flex-start; } }
</style>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
let currentUser = null;
let currentPage = 1;
let currentTotal = 0;
let currentPageSize = 20;
let allEntries = [];
let activeFilter = 'all';
let openCardIds = new Set();

const GAME_LABELS = {
  trivia: { en: 'Trivia', ar: 'سؤال و جواب' },
  mafia: { en: 'Mafia', ar: 'مافيا' },
  'knows-you-best': { en: 'Knows You Best', ar: 'عارفكم' },
};
const FILTERS = ['all', 'trivia', 'mafia', 'knows-you-best'];

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(lang === 'ar' ? 'ar' : 'en-US', { year:'numeric', month:'short', day:'numeric' });
}

function buildFilterRow(){
  const row = document.getElementById('filter-row');
  row.innerHTML = FILTERS.map((f) => {
    const label = f === 'all' ? (lang === 'ar' ? 'الكل' : 'All') : GAME_LABELS[f][lang];
    return `<button type="button" class="filter-chip${f === activeFilter ? ' active' : ''}" data-filter="${f}">${label}</button>`;
  }).join('');
}

function filteredEntries(){
  return activeFilter === 'all' ? allEntries : allEntries.filter((e) => e.gameType === activeFilter);
}

function rankedResults(entry){
  return [...entry.results].sort((a, b) => (b.isWinner - a.isWinner) || (b.score - a.score));
}

function topFinishersText(entry){
  const ranked = rankedResults(entry);
  const top = ranked.slice(0, 3).map((r) => r.displayName);
  if(top.length === 0) return '';
  return lang === 'ar' ? `الأوائل: ${top.join('، ')}` : `Top finishers: ${top.join(', ')}`;
}

function renderHistoryList(){
  const list = document.getElementById('history-list');
  const entries = filteredEntries();

  if(entries.length === 0 && currentTotal === 0){
    list.innerHTML = lang === 'ar'
      ? `<div class="empty-state">لم تستضف أي لعبة بعد — ابدأ واحدة من <a href="bahjah-landing.html">الصفحة الرئيسية</a>.</div>`
      : `<div class="empty-state">No games hosted yet — start one from the <a href="bahjah-landing.html">lobby</a>.</div>`;
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  if(entries.length === 0){
    list.innerHTML = lang === 'ar'
      ? `<div class="empty-state">لا توجد ألعاب من هذا النوع في هذه الصفحة.</div>`
      : `<div class="empty-state">No games of this type on this page.</div>`;
  } else {
    list.innerHTML = entries.map((entry) => {
      const label = GAME_LABELS[entry.gameType]?.[lang] || entry.gameType;
      const isOpen = openCardIds.has(entry.id);
      const ranked = rankedResults(entry);
      const rows = ranked.map((r, i) => `
        <div class="result-row">
          <span class="result-rank">#${i + 1}</span>
          <span class="result-avatar">${window.BahjahAvatars.renderAvatarHtml(null, r.userId)}</span>
          <span class="result-name">${r.displayName}</span>
          <span class="result-score">${r.score}</span>
          ${r.isWinner ? '<span class="result-winner">&#9733;</span>' : ''}
        </div>
      `).join('');
      return `
        <div class="history-card${isOpen ? ' open' : ''}" data-id="${entry.id}">
          <div class="hc-top" data-toggle="${entry.id}">
            <div class="hc-meta">
              <span class="hc-badge">${label}</span>
              <span class="hc-code">${entry.roomCode}</span>
              <span class="hc-date">${fmtDate(entry.playedAt)}</span>
            </div>
            <span class="hc-toggle">${lang === 'ar' ? 'التفاصيل' : 'Details'} <span class="chevron">&#9660;</span></span>
          </div>
          <div class="hc-top-finishers">${topFinishersText(entry)}</div>
          <div class="hc-actions">
            <button type="button" class="bh-btn bh-btn--ghost bh-btn--sm" data-share="${entry.id}">${lang === 'ar' ? 'مشاركة' : 'Share'}</button>
          </div>
          <div class="hc-details">${rows}</div>
        </div>
      `;
    }).join('');
  }

  const pagination = document.getElementById('pagination');
  const totalPages = Math.max(1, Math.ceil(currentTotal / currentPageSize));
  pagination.style.display = currentTotal > currentPageSize ? 'flex' : 'none';
  document.getElementById('pagination-label').textContent = lang === 'ar'
    ? `صفحة ${currentPage} من ${totalPages}`
    : `Page ${currentPage} of ${totalPages}`;
  document.getElementById('prev-page-btn').disabled = currentPage <= 1;
  document.getElementById('next-page-btn').disabled = currentPage >= totalPages;
}

async function loadHistory(){
  const token = BahjahSession.getToken();
  try {
    const res = await fetch(`/api/games/history?page=${currentPage}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if(!res.ok) return;
    const data = await res.json();
    allEntries = data.entries;
    currentTotal = data.total;
    currentPageSize = data.pageSize;
    renderHistoryList();
  } catch {
    BahjahRoomActions.showToast(lang === 'ar' ? 'خطأ في الشبكة — حاول مرة أخرى.' : 'Network error — please try again.');
  }
}

function changePage(dir){
  const totalPages = Math.max(1, Math.ceil(currentTotal / currentPageSize));
  const next = currentPage + dir;
  if(next < 1 || next > totalPages) return;
  currentPage = next;
  loadHistory();
}

function shareEntry(entry, shareBtn){
  const ranked = rankedResults(entry);
  const label = GAME_LABELS[entry.gameType]?.[lang] || entry.gameType;
  let text, headline, subline;
  if(entry.gameType === 'mafia'){
    headline = lang === 'ar' ? 'استضفت لعبة على بهجة!' : 'I hosted a game on Bahjah!';
    subline = lang === 'ar' ? 'مافيا · قرية ضد مافيا' : 'Mafia · village vs. mafia';
    text = lang === 'ar'
      ? `استضفت لعبة مافيا على بهجة! 🎭`
      : `I hosted a Mafia game on Bahjah — a thrilling round of village vs. mafia! 🎭`;
  } else {
    const winner = ranked.find((r) => r.isWinner);
    headline = lang === 'ar' ? 'استضفت لعبة على بهجة!' : 'I hosted a game on Bahjah!';
    subline = winner
      ? (lang === 'ar' ? `${label} · فاز ${winner.displayName}` : `${label} · ${winner.displayName} won`)
      : label;
    text = lang === 'ar'
      ? `استضفت لعبة ${label} على بهجة${winner ? ` — فاز ${winner.displayName}!` : '!'} 🏆`
      : `I hosted a ${label} game on Bahjah${winner ? ` — ${winner.displayName} won!` : '!'} 🏆`;
  }
  const url = `${location.origin}/bahjah-landing.html`;

  if(window.BahjahShareCard){
    window.BahjahShareCard.share({ gameId: entry.gameType, lang, headline, subline, text, url, shareBtn });
    return;
  }
  if(navigator.share){
    navigator.share({ text, url }).catch(() => {});
    return;
  }
  navigator.clipboard.writeText(`${text} ${url}`).then(() => {
    BahjahRoomActions.showToast(lang === 'ar' ? 'تم النسخ!' : 'Copied!');
  }).catch(() => {});
}

document.addEventListener('click', (e) => {
  const filterChip = e.target.closest('.filter-chip');
  if(filterChip){
    activeFilter = filterChip.dataset.filter;
    buildFilterRow();
    renderHistoryList();
    return;
  }

  const shareBtn = e.target.closest('[data-share]');
  if(shareBtn){
    const entry = allEntries.find((en) => en.id === shareBtn.dataset.share);
    if(entry) shareEntry(entry, shareBtn);
    return;
  }

  const toggle = e.target.closest('[data-toggle]');
  if(toggle){
    const id = toggle.dataset.toggle;
    if(openCardIds.has(id)) openCardIds.delete(id); else openCardIds.add(id);
    renderHistoryList();
    return;
  }

  const avatarBtn = e.target.closest('.user-avatar-btn');
  if(avatarBtn){
    e.preventDefault();
    const menu = avatarBtn.closest('.session-user-menu');
    const wasOpen = menu.classList.contains('open');
    closeUserMenus();
    if(!wasOpen) menu.classList.add('open');
    return;
  }
  const item = e.target.closest('.user-dropdown-item');
  if(item){
    e.preventDefault();
    closeUserMenus();
    const action = item.dataset.action;
    if(action === 'signout'){
      BahjahSession.clear();
      window.location.href = 'bahjah-landing.html';
    } else if(action === 'leaderboard'){
      window.location.href = 'leaderboard.html';
    } else if(action === 'profile'){
      window.location.href = 'profile.html';
    } else if(action === 'settings'){
      window.location.href = 'settings.html';
    }
    return;
  }
  if(!e.target.closest('.session-user-menu')) closeUserMenus();
});

function updateSessionUI(){
  const menus = document.querySelectorAll('.session-user-menu');
  menus.forEach(menu => {
    menu.style.display = '';
    menu.querySelector('.user-avatar-inner').innerHTML = window.BahjahAvatars.renderAvatarHtml(currentUser.avatar, currentUser.id);
    menu.querySelector('.user-dropdown-name').textContent = currentUser.fullName;
  });
}

function closeUserMenus(){
  document.querySelectorAll('.session-user-menu.open').forEach(m => m.classList.remove('open'));
}

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  buildFilterRow();
  renderHistoryList();
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

async function init(){
  currentUser = await BahjahSession.fetchMe();
  if(!currentUser){
    BahjahRoomActions.showToast(lang === 'ar' ? 'سجّل الدخول أولاً.' : 'Sign in first.');
    setTimeout(() => { window.location.href = `auth.html?next=${encodeURIComponent(location.pathname)}`; }, 900);
    return;
  }
  updateSessionUI();
  await loadHistory();
}
init();

buildFilterRow();
applyLang();
document.documentElement.style.visibility = '';
</script>
