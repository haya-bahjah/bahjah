<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Bahjah — Party games, together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Lalezar&family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#170F22; --surface:#221530; --surface-2:#2B1B3D;
    --line:rgba(247,239,224,0.12); --text:#F7EFE0; --muted:#9C8AB0;
    --brand:#B24BF5; --brand-2:#8E3FC9;
    --good:#2FBF9F; --good-dim:#175E4E;
    --on-accent:#170F22;
    --font-display:'Fraunces', serif; --font-body:'Cairo', sans-serif;
    --radius-a: 4px 20px 4px 20px; --radius-b: 20px 4px 20px 4px;
  }
  html[dir="rtl"]{ --font-display:'Lalezar', sans-serif; }
  html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3{ font-weight:400; }
  html[dir="rtl"] .hero-title{ font-family:'Cairo', var(--font-display); font-weight:900; }
  [data-theme="light"]{
    --bg:#FBF4E4; --surface:#F1E6CE; --surface-2:#E9DAB9;
    --line:rgba(28,16,41,0.14); --text:#1C1029; --muted:#6B5C82;
    --brand:#8B2FD9; --brand-2:#7226AD;
    --good:#0F8368; --good-dim:#BFEBDF;
    --on-accent:#170F22;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; scrollbar-gutter:stable both-edges; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6; overflow-x:hidden; transition:background .3s ease, color .3s ease; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.12; font-weight:700; }
  p{ margin:0; } a{ color:inherit; } button{ font-family:var(--font-body); cursor:pointer; }
  em{ font-style:italic; color:var(--brand); }
  .wrap{ max-width:1120px; margin:0 auto; padding-inline:24px; position:relative; z-index:1; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  .grain{ position:fixed; inset:0; width:100%; height:100%; opacity:.05; pointer-events:none; z-index:50; mix-blend-mode:overlay; }
  [data-theme="light"] .grain{ opacity:.035; mix-blend-mode:multiply; }

  header{ position:relative; z-index:5; }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding-block:22px; gap:16px; }
  .nav-brand{ flex-shrink:0; min-width:220px; }
  .brand-logo{ display:block; height:32px; width:auto; }
  [data-theme="light"] .brand-logo{ filter:invert(1); }
  .nav-links{ display:flex; gap:28px; list-style:none; padding:0; margin:0; flex-shrink:0; }
  .nav-links a, .nav-links button{ text-decoration:none; font-size:14px; color:var(--muted); font-weight:600; border-bottom:1px solid transparent; padding-bottom:2px; transition:color .15s, border-color .15s; background:none; border-top:none; border-left:none; border-right:none; padding-inline:0; }
  .nav-links a:hover, .nav-links button:hover{ color:var(--text); border-color:var(--line); }
  @media (max-width:820px){ .nav-links{ display:none; } }
  .nav-right{ display:flex; align-items:center; justify-content:flex-end; gap:16px; flex-shrink:0; min-width:220px; }
  .back-link{ font-size:14px; font-weight:700; color:var(--muted); text-decoration:none; border-bottom:1px solid transparent; }
  .back-link:hover{ color:var(--text); border-color:var(--line); }

  .switch{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; }
  .switch button{ background:none; border:none; color:var(--muted); padding:2px 3px; font-weight:700; font-size:13px; }
  .switch button.active{ color:var(--text); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--line); }
  .theme-btn{ background:none; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text); }

  .user-menu{ position:relative; display:inline-flex; }
  .user-avatar-btn{ width:32px; height:32px; border-radius:50%; padding:0; border:1px solid var(--line); background:var(--surface); cursor:pointer; overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .user-avatar-inner{ width:100%; height:100%; display:block; }
  .user-dropdown{
    position:absolute; top:calc(100% + 10px); inset-inline-end:0; min-width:190px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a);
    box-shadow:0 20px 40px -12px rgba(0,0,0,.5); padding:8px; display:none; flex-direction:column; gap:2px; z-index:50;
  }
  .session-user-menu.open .user-dropdown{ display:flex; }
  .user-dropdown-name{ padding:8px 10px 6px; font-size:13px; font-weight:800; color:var(--text); border-bottom:1px solid var(--line); margin-bottom:4px; }
  .user-dropdown-item{ display:block; width:100%; text-align:start; background:none; border:none; padding:9px 10px; border-radius:6px; font-size:14px; font-weight:600; color:var(--text); cursor:pointer; font-family:var(--font-body); }
  .user-dropdown-item:hover{ background:var(--surface-2); }
  .user-dropdown-danger{ color:var(--brand); }

  .btn{ border:none; border-radius:var(--radius-a); font-weight:700; padding:13px 26px; font-size:15px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; transition:transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--brand); color:var(--on-accent); }
  .btn-text{ background:none; padding:13px 4px; color:var(--text); border-bottom:1px solid var(--text); border-radius:0; font-weight:700; }
  .btn-sm{ padding:9px 18px; font-size:13px; }

  .kicker{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding-top:10px; border-top:1px solid var(--line); margin-bottom:16px; display:inline-block; }

  .hero{ position:relative; padding-block:56px 96px; }
  .hero-grid{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
  .hero-text{ max-width:680px; }
  .hero-text .sub{ margin-inline:auto; }
  .hero-text .hero-ctas{ justify-content:center; }
  .hero-text .join-row{ margin-inline:auto; }
  .hero h1{ font-size:clamp(28px,5vw,40px); white-space:nowrap; }
  html[dir="rtl"] .hero h1{ font-size:clamp(30px,6vw,50px); transform:translateX(.28em); }
  @media (max-width:520px){ .hero h1{ white-space:normal; } }
  .hero p.sub{ margin-top:22px; font-size:17px; color:var(--muted); max-width:520px; }
  .hero-ctas{ display:flex; align-items:center; gap:16px; margin-top:36px; flex-wrap:wrap; }

  .join-row{
    margin-top:22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-b);
    padding:14px 18px; max-width:420px; border-top:2px solid var(--brand); transition:box-shadow .3s ease;
  }
  .join-row.pulse{ box-shadow:0 0 0 3px rgba(178,75,245,.4); }
  .join-row label{ font-size:13px; color:var(--muted); font-weight:600; white-space:nowrap; }
  .join-row input{
    flex:1; min-width:120px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px;
    padding:10px 14px; color:var(--text); font-family:var(--font-body); font-size:14px; font-weight:600; letter-spacing:1px;
  }
  .join-row input::placeholder{ color:var(--muted); opacity:.7; letter-spacing:normal; font-weight:400; }

  /* -- Fanned game cards, manually rotated via the arrow buttons -- */
  .card-fan-wrap{ position:relative; min-height:440px; width:100%; display:flex; align-items:center; justify-content:center; margin-top:0; --arrow-offset:330px; }
  .card-fan{
    position:relative; width:300px; height:400px;
    --fan-x:160px; --fan-y:16px; --fan-rot:8deg; --fan-scale:.94;
  }
  .fan-card{
    position:absolute; inset:0; border-radius:22px; overflow:hidden; cursor:pointer; text-decoration:none;
    display:flex; flex-direction:column; border:1px solid var(--line); background:var(--surface);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
    transform:var(--pos, none);
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
  }
  .fan-card:hover{ transform:var(--pos, none) translateY(-6px); box-shadow:0 30px 60px -18px rgba(0,0,0,.4); }
  @media (prefers-reduced-motion:reduce){ .fan-card{ transition:none; } }
  .fan-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:10; direction:ltr;
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--text); font-size:20px; line-height:1; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background .15s ease, transform .15s ease, border-color .15s ease;
  }
  .fan-arrow:hover{ background:var(--surface-2); border-color:var(--brand); }
  .fan-arrow:active{ transform:translateY(-50%) scale(.92); }
  .fan-arrow-left{ left:calc(50% - var(--arrow-offset)); }
  .fan-arrow-right{ right:calc(50% - var(--arrow-offset)); }
  @media (max-width:700px){
    .card-fan-wrap{ min-height:360px; --arrow-offset:190px; }
    .card-fan{ width:230px; height:300px; --fan-x:70px; --fan-y:24px; --fan-rot:9deg; --fan-scale:.87; }
    .fan-arrow{ width:34px; height:34px; font-size:17px; }
  }
  .fan-card-art{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .fan-card-logo{ width:100%; height:100%; object-fit:contain; padding:22px; box-sizing:border-box; }
  .fan-card-body{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:4px; background:var(--surface); }
  .fan-card-name{ font-family:var(--font-display); font-weight:800; font-size:19px; }
  .fan-card-meta{ font-size:12px; color:var(--muted); font-weight:700; }

  .section{ position:relative; padding-block:76px; }
  .section-head{ max-width:640px; margin-bottom:40px; }
  .section-head h2{ font-size:clamp(28px,3.6vw,42px); margin-top:6px; }
  .section-head p.lead{ color:var(--muted); font-size:15px; margin-top:12px; }

  .steps{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:0; border-top:1px solid var(--line); }
  .step{ padding:24px 20px; border-inline-end:1px solid var(--line); }
  .step:last-child{ border-inline-end:none; }
  .step .num{ font-family:var(--font-display); font-size:34px; color:var(--muted); opacity:.5; }
  .step h3{ font-size:16px; margin-top:8px; }
  .step p{ color:var(--muted); font-size:13px; margin-top:6px; }
  @media (max-width:700px){ .step{ border-inline-end:none; border-bottom:1px solid var(--line); } }

  .pricing-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:24px; max-width:760px; }
  .price-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a); padding:32px; display:flex; flex-direction:column; gap:16px; position:relative; overflow:hidden; }
  .price-card.featured{ border-color:var(--brand); }
  .ribbon{ position:absolute; top:0; inset-inline-end:0; background:var(--brand); color:var(--on-accent); font-size:11px; font-weight:800; padding:6px 30px; transform:translate(28%,-2%); clip-path:polygon(0 0,100% 0,100% 100%,10% 100%); }
  html[dir="rtl"] .ribbon{ clip-path:polygon(0 0,100% 0,90% 100%,0 100%); }
  .price-card h3{ font-size:20px; }
  .price{ font-family:var(--font-display); font-size:38px; }
  .price span{ font-size:14px; color:var(--muted); font-weight:600; font-family:var(--font-body); }
  .price-card .plan-desc{ color:var(--muted); font-size:14px; }
  .features{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
  .features li{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .features li .check{ width:16px; height:16px; flex-shrink:0; color:var(--good); font-weight:800; }

  footer{ position:relative; z-index:1; border-top:1px solid var(--line); padding-block:36px; }
  .foot-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .foot-tag{ color:var(--muted); font-size:14px; margin-top:4px; }
  .copy{ color:var(--muted); font-size:13px; opacity:.7; }

  .toast{ position:fixed; inset-inline:0; bottom:24px; display:flex; justify-content:center; z-index:60; pointer-events:none; }
  .toast-inner{ background:var(--text); color:var(--bg); font-weight:700; font-size:14px; padding:12px 22px; border-radius:var(--radius-a); opacity:0; transform:translateY(12px); transition:opacity .25s ease, transform .25s ease; }
  .toast-inner.show{ opacity:1; transform:translateY(0); }
</style>
</head>

<script>
const GAMES = [
  { id:"trivia", en:{name:"Trivia", players:"1–12 players"}, ar:{name:"سؤال و جواب", players:"١–١٢ لاعبًا"}, href:"trivia.html", color:"#203488", logo:"assets/logos/trivia-logo.png", logoBg:"#EFEFE9" },
  { id:"mafia", en:{name:"Mafia", players:"4–15 players"}, ar:{name:"مافيا", players:"٤–١٥ لاعبًا"}, href:"mafia.html", color:"#EE2D23", logo:"assets/logos/mafia-logo.png", logoBg:"#112862" },
  { id:"knows-you-best", en:{name:"Knows You Best", players:"3–10 players"}, ar:{name:"عارفكم", players:"٣–١٠ لاعبين"}, href:"knows-you-best.html", color:"#1E3A8A", logo:"assets/logos/knows-you-best-logo.png", logoBg:"#E6EEFD" },
];

const STEPS = [
  { en:{t:"Create a room", d:"Pick a game night mix and get a shareable code in seconds."}, ar:{t:"أنشئ غرفة", d:"اختر تشكيلة الألعاب واحصل على رمز للمشاركة خلال ثوانٍ."} },
  { en:{t:"Invite your circle", d:"Send the link — friends join from their phones, no app required."}, ar:{t:"ادعُ رفاقك", d:"أرسل الرابط — ينضم الأصدقاء من هواتفهم بلا تطبيق."} },
  { en:{t:"Play across genres", d:"Switch between trivia, mafia, and guessing games without breaking the night."}, ar:{t:"العبوا عبر الألعاب", d:"تنقّلوا بين سؤال و جواب ومافيا وألعاب التخمين دون كسر أجواء السهرة."} },
];

let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
let theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
let fanIndex = 0;
const FAN_SLOTS = [
  { transform:'translate(0,0) rotate(0deg) scale(1)', z:3 },
  { transform:'translate(var(--fan-x),var(--fan-y)) rotate(var(--fan-rot)) scale(var(--fan-scale))', z:1 },
  { transform:'translate(calc(var(--fan-x) * -1),var(--fan-y)) rotate(calc(var(--fan-rot) * -1)) scale(var(--fan-scale))', z:2 },
];

function buildGames(){
  const fan = document.getElementById('card-fan');
  fan.innerHTML = GAMES.map((g) => `
    <a class="fan-card" href="${g.href}" style="--accent:${g.color};">
      <div class="fan-card-art" style="background:${g.logoBg};"><img class="fan-card-logo" src="${g.logo}" alt="" loading="lazy"></div>
      <div class="fan-card-body">
        <span class="fan-card-name lang-fade" data-en="${g.en.name}" data-ar="${g.ar.name}">${g.en.name}</span>
        <span class="fan-card-meta lang-fade" data-en="${g.en.players}" data-ar="${g.ar.players}">${g.en.players}</span>
      </div>
    </a>
  `).join('');
  positionCards();
}

function positionCards(){
  const cards = document.querySelectorAll('#card-fan .fan-card');
  const n = cards.length;
  cards.forEach((card, i) => {
    const offset = (i - fanIndex + n) % n;
    const slot = FAN_SLOTS[offset];
    card.style.setProperty('--pos', slot.transform);
    card.style.zIndex = slot.z;
  });
}

function rotateCards(dir){
  const n = GAMES.length;
  fanIndex = (fanIndex + dir + n) % n;
  positionCards();
}

function focusCardFan(){
  const fan = document.getElementById('card-fan');
  fan.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function focusJoinRow(){
  const row = document.getElementById('join-row');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.add('pulse');
  setTimeout(() => row.classList.remove('pulse'), 1200);
  document.getElementById('room-input').focus();
}

function buildSteps(){
  const grid = document.getElementById('steps-grid');
  grid.innerHTML = STEPS.map((s,i) => `
    <div class="step">
      <div class="num">${i+1}</div>
      <h3 class="lang-fade" data-en="${s.en.t}" data-ar="${s.ar.t}">${s.en.t}</h3>
      <p class="lang-fade" data-en="${s.en.d}" data-ar="${s.ar.d}">${s.en.d}</p>
    </div>
  `).join('');
}

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  const roomInput = document.getElementById('room-input');
  roomInput.placeholder = roomInput.getAttribute('data-' + lang + '-ph');
  updateSessionUI();
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
  localStorage.setItem('bahjah_theme', theme);
}

let currentUser = null;

function updateSessionUI(){
  const links = document.querySelectorAll('.session-signin-link');
  const menus = document.querySelectorAll('.session-user-menu');
  if(currentUser){
    links.forEach(el => { el.style.display = 'none'; });
    menus.forEach(menu => {
      menu.style.display = '';
      menu.querySelector('.user-avatar-inner').innerHTML = window.BahjahAvatars.renderAvatarHtml(currentUser.avatar, currentUser.id);
      menu.querySelector('.user-dropdown-name').textContent = currentUser.fullName;
    });
  } else {
    links.forEach(el => {
      el.style.display = '';
      el.textContent = lang === 'en' ? 'Sign in' : 'تسجيل الدخول';
      el.href = 'auth.html';
    });
    menus.forEach(menu => { menu.style.display = 'none'; menu.classList.remove('open'); });
  }
}

function closeUserMenus(){
  document.querySelectorAll('.session-user-menu.open').forEach(m => m.classList.remove('open'));
}

document.addEventListener('click', (e) => {
  const avatarBtn = e.target.closest('.user-avatar-btn');
  if(avatarBtn){
    e.preventDefault();
    const menu = avatarBtn.closest('.session-user-menu');
    const wasOpen = menu.classList.contains('open');
    closeUserMenus();
    if(!wasOpen) menu.classList.add('open');
    return;
  }

  const item = e.target.closest('.user-dropdown-item');
  if(item){
    e.preventDefault();
    closeUserMenus();
    const action = item.dataset.action;
    if(action === 'signout'){
      BahjahSession.clear();
      currentUser = null;
      updateSessionUI();
    } else if(action === 'leaderboard'){
      window.location.href = 'leaderboard.html';
    } else if(action === 'profile'){
      window.location.href = 'profile.html';
    } else if(action === 'settings'){
      window.location.href = 'settings.html';
    }
    return;
  }

  if(!e.target.closest('.session-user-menu')) closeUserMenus();
});

async function initSession(){
  currentUser = await BahjahSession.fetchMe();
  updateSessionUI();
}

buildGames();
buildSteps();
initSession();

document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
applyLang();
document.documentElement.style.visibility = '';
</script>

</body>
</html>
