<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Lobby — Bahjah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Lalezar&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12081A; --surface:#1E1027; --surface-2:#281633;
    --line:rgba(247,239,224,0.10); --text:#F2E9DC; --muted:#8F7CA3;
    --brand:#B24BF5;
    --accent:#D7263D; --on-accent:#FFFFFF;
    --good:#2FBF9F;
    --font-display:'Fraunces', serif; --font-body:'Cairo', sans-serif;
    --radius-a: 4px 20px 4px 20px; --radius-b: 20px 4px 20px 4px;
  }
  html[dir="rtl"]{ --font-display:'Lalezar', sans-serif; }
  [data-theme="light"]{
    --bg:#F4EBE6; --surface:#EADDD3; --surface-2:#E1CFC0;
    --line:rgba(28,16,41,0.14); --text:#221019; --muted:#6E5A63;
    --brand:#8B2FD9; --accent:#B91C2E; --on-accent:#FFFFFF;
    --good:#0F8368;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.5; min-height:100vh; transition:background .3s ease, color .3s ease; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.1; font-weight:700; }
  .wrap{ max-width:1100px; margin:0 auto; padding-inline:24px; }
  header{ padding-block:18px; border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; }
  .brand-logo{ height:22px; }
  .back-link{ color:var(--muted); text-decoration:none; font-size:14px; font-weight:600; }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .theme-btn{ background:none; border:1px solid var(--line); border-radius:50%; width:34px; height:34px; color:var(--text); font-size:15px; }
  .switch{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--muted); }
  .switch button{ background:none; border:none; color:inherit; font:inherit; cursor:pointer; padding:2px; }
  .switch button.active{ color:var(--accent); }
  .btn{ border:none; border-radius:var(--radius-a); font-weight:700; padding:13px 24px; font-size:15px; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--on-accent); }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .kicker{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }

  #lobby-gate{ min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #lobby-main{ display:none; padding-block:28px; }

  /* -- Big screen / TV layout -- */
  .lobby-tv{ display:none; }
  .tv-hero{ text-align:center; padding-block:20px 32px; }
  .tv-code-row{ display:flex; align-items:center; justify-content:center; gap:64px; flex-wrap:wrap; margin-top:14px; }
  .tv-code{ font-family:var(--font-display); font-size:64px; font-weight:800; letter-spacing:.12em; color:var(--accent); }
  .tv-qr{ background:#fff; border-radius:12px; padding:10px; }
  .tv-players{ display:flex; flex-wrap:wrap; gap:22px; justify-content:center; padding:24px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-a); min-height:120px; }
  .tv-footer{ display:flex; justify-content:center; margin-top:24px; }
  .waiting-label{ color:var(--muted); font-weight:700; font-size:15px; }

  /* -- Phone / controller layout -- */
  .lobby-phone{ display:block; max-width:420px; margin:0 auto; padding-inline:8px; }
  .phone-code-badge{ text-align:center; color:var(--muted); font-weight:700; font-size:13px; margin-bottom:18px; }
  .phone-code-badge span{ color:var(--accent); font-family:var(--font-display); font-size:16px; letter-spacing:.08em; }
  .phone-avatar-row{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:20px; }
  #phone-avatar{ display:block; width:96px; height:96px; border-radius:50%; cursor:pointer; border:3px solid var(--accent); padding:2px; background:var(--surface); overflow:hidden; }
  .avatar-hint{ font-size:12px; color:var(--muted); }
  #phone-name{ font-family:var(--font-display); font-size:20px; font-weight:700; }
  .ready-btn{ width:100%; padding:16px; border-radius:var(--radius-a); border:2px solid var(--accent); background:none; color:var(--accent); font-weight:800; font-size:16px; cursor:pointer; margin-bottom:22px; transition:background .15s ease, color .15s ease; }
  .ready-btn.is-ready{ background:var(--good); border-color:var(--good); color:#fff; }
  .phone-players-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; }
  .phone-players{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:22px; }
  .phone-actions{ display:flex; flex-direction:column; gap:10px; }
  #copy-link-btn{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-weight:700; font-size:13px; cursor:pointer; }
  .start-btn{ display:none; }

  @media (min-width: 860px){
    .lobby-tv{ display:block; }
    .lobby-phone{ display:none; }
  }
</style>
</head>

<script>
let lang = 'en';
let theme = 'dark';
function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', lang);
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
    els.forEach(el => {
      const val = el.getAttribute('data-' + lang);
      if(val !== null) el.textContent = val;
      el.classList.remove('fading');
    });
  }, 180);
}
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '&#9789;' : '&#9788;';
}
</script>
