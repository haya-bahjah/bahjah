<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="assets/prefs-boot.js"></script>
<title>Bahjah — Mafia Lobby</title>
<link rel="icon" type="image/png" href="assets/favicon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/design-system/tokens.css">
<link rel="stylesheet" href="assets/mafia-theme.css">
<link rel="stylesheet" href="assets/lobby-players.css">
<link rel="stylesheet" href="assets/design-system/arcade.css">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--text-primary); font-family:var(--font-body); line-height:1.5; min-height:100vh; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; line-height:1.1; font-weight:700; }
  .wrap{ max-width:1100px; margin:0 auto; padding-inline:24px; }
  .lang-fade{ transition:opacity .2s ease; } .lang-fade.fading{ opacity:0; }
  @media (prefers-reduced-motion:reduce){ .lang-fade{ transition:none !important; } *{ animation:none !important; } }

  header{ padding-block:18px; border-bottom:1px solid var(--border-subtle); }
  .nav{ display:flex; align-items:center; justify-content:space-between; }
  .brand-logo{ display:block; height:28px; width:auto; filter:var(--logo-filter, brightness(0) invert(1)); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .switch{ display:flex; align-items:center; gap:6px; font-family:var(--font-pixel); font-size:11px; }
  .switch button{ background:none; border:none; color:var(--text-muted); padding:2px 3px; font-family:var(--font-pixel); }
  .switch button.active{ color:var(--cyber-cyan); text-decoration:underline; text-underline-offset:4px; }
  .switch .sep{ color:var(--border-strong); }
  .back-link{ color:var(--text-muted); text-decoration:none; font-size:13px; font-weight:600; }
  .back-icon-btn{ display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--border-subtle); color:var(--text-primary); flex-shrink:0; }
  .back-icon-btn:hover{ border-color:var(--border-strong); }
  [dir="rtl"] .back-icon-btn svg{ transform:scaleX(-1); }
  .back-row{ display:flex; padding-block:10px 0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .btn{ border:none; border-radius:var(--radius-sm); font-weight:700; padding:13px 24px; font-size:15px; cursor:pointer; }
  .kicker{ font-family:var(--font-pixel); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--mafia-red); }

  #lobby-gate{ min-height:70vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #lobby-main{ display:none; padding-block:14px; }

  #guest-entry{ display:none; width:100%; max-width:340px; text-align:center; }
  #guest-avatar{ display:block; width:88px; height:88px; margin:16px auto 6px; border-radius:50%; cursor:pointer; border:3px solid var(--mafia-red); padding:2px; background:var(--surface-raised); overflow:hidden; }
  #guest-entry .avatar-hint{ font-size:12px; color:var(--text-muted); display:block; margin-bottom:18px; }
  #guest-nickname{ width:100%; padding:14px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:15px; text-align:center; margin-bottom:14px; }
  #guest-join-btn{ width:100%; }
  #guest-entry .cfg-error{ min-height:16px; }
  #guest-signin-link{ display:inline-block; margin-top:16px; }

  /* Host-only config panel */
  .cfg-section-label{ font-family:var(--font-pixel); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .cfg-diff-row{ display:flex; gap:8px; margin-bottom:18px; }
  .cfg-diff-btn{ flex:1; padding:10px 6px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-weight:700; font-size:13px; cursor:pointer; }
  .cfg-diff-btn.active{ border-color:var(--mafia-red); color:var(--mafia-red); background:var(--mafia-red-dim); }
  .cfg-cat-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .cfg-cat-chip{ padding:8px 14px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer; }
  .cfg-cat-chip.active{ border-color:var(--mafia-red); color:var(--mafia-red); background:var(--mafia-red-dim); }
  .cfg-rounds-row{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .cfg-rounds-btn{ width:36px; height:36px; border-radius:50%; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-weight:700; font-size:18px; cursor:pointer; }
  .cfg-rounds-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .cfg-rounds-value{ font-family:var(--font-pixel); font-size:16px; min-width:34px; text-align:center; }
  .cfg-rounds-value-time{ min-width:56px; }
  .cfg-toggle-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; font-size:14px; font-weight:600; }
  .cfg-toggle-row input[type="checkbox"]{ width:20px; height:20px; accent-color:var(--mafia-red); cursor:pointer; }
  .cfg-hint{ font-size:13px; color:var(--text-muted); margin:0 0 18px; }
  .cfg-error{ color:var(--mafia-red); font-size:12px; margin-top:6px; }
  .cfg-collapsible{ border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:18px; background:var(--surface-card); }
  .cfg-collapsible-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .cfg-collapse-toggle{ flex-shrink:0; padding:8px 14px; border-radius:8px; border:1px solid var(--border-subtle); background:var(--surface-raised); color:var(--text-primary); font-weight:700; font-size:11px; cursor:pointer; }
  .cfg-collapse-toggle[aria-expanded="true"]{ border-color:var(--mafia-red); color:var(--mafia-red); }
  .cfg-collapsible-body{ margin-top:16px; padding-top:16px; border-top:1px solid var(--border-subtle); }
  .cfg-collapsible-body .cfg-rounds-row:last-child{ margin-bottom:0; }

  /* -- Big screen / TV layout -- */
  .config-box{ max-width:520px; margin:0 auto 28px; }
  .host-grid{ display:block; }
  @media (min-width:860px){
    .host-grid{ display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:40px; align-items:start; }
    .host-grid .config-box{ max-width:none; margin:0; }
  }
  .lobby-tv{ display:none; }
  .tv-hero{ text-align:center; padding-block:6px 14px; animation:fadeUp .4s ease-out both; }
  .tv-code-row{ display:flex; align-items:center; justify-content:center; gap:26px; flex-wrap:wrap; margin-top:14px; }
  .tv-code{ font-family:var(--font-pixel); font-size:34px; letter-spacing:.22em; color:var(--mafia-red); text-shadow:0 0 22px var(--mafia-red-dim); }
  .tv-qr{ background:#fff; border-radius:10px; padding:6px; }
  .tv-players{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:flex-start; align-content:flex-start; padding:14px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); min-height:80px; max-height:190px; overflow-y:auto; }
  .tv-footer{ display:flex; justify-content:center; margin-top:14px; }
  .waiting-label{ color:var(--text-muted); font-weight:700; font-size:14px; }
  .host-banner{ text-align:center; font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:8px; }
  .players-empty-note{ color:var(--text-muted); font-size:13px; font-style:italic; }

  /* -- Phone / controller layout -- */
  .lobby-phone{ display:block; max-width:420px; margin:0 auto; padding-inline:8px; animation:fadeUp .4s ease-out both; }
  .phone-code-badge{ text-align:center; color:var(--text-muted); font-weight:700; font-size:12px; margin-bottom:10px; }
  .phone-code-badge .room-code-text{ color:var(--mafia-red); font-family:var(--font-pixel); font-size:15px; letter-spacing:.14em; }
  .phone-avatar-row{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:10px; }
  #phone-avatar{ display:block; width:64px; height:64px; border-radius:50%; cursor:pointer; border:3px solid var(--mafia-red); padding:2px; background:var(--surface-raised); overflow:hidden; }
  .avatar-hint{ font-size:12px; color:var(--text-muted); }
  #phone-name{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .ready-btn{ width:100%; padding:12px; border-radius:var(--radius-sm); border:2px solid var(--mafia-red); background:none; color:var(--mafia-red); font-weight:800; font-size:15px; cursor:pointer; margin-bottom:12px; transition:background .15s ease, color .15s ease; }
  .ready-btn.is-ready{ background:var(--pixel-green); border-color:var(--pixel-green); color:var(--arcade-black); }
  .phone-players-label{ font-family:var(--font-pixel); font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted); margin-bottom:8px; }
  .phone-players{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; max-height:110px; overflow-y:auto; }
  .phone-actions{ display:flex; flex-direction:column; gap:8px; }
  #copy-link-btn{ background:var(--surface-raised); color:var(--text-primary); border:1px solid var(--border-subtle); border-radius:8px; padding:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .start-btn{ display:none; }

  @media (max-width: 859px){
    header{ padding-block:12px; }
    .back-row{ padding-block:6px 0; }
    #lobby-main{ padding-block:10px; }
    /* The readonly config summary is a TV/host-grid element (see the
       host-grid comment above lobby-main) -- on the phone layout it just
       adds a wrapping line above .lobby-phone and pushes it below the fold
       at narrow heights, so it's hidden here instead. Overrides the inline
       style="display:block" the JS sets for non-host viewers. */
    #mafia-config-readonly{ display:none !important; }
  }

  @media (min-width: 860px){
    .lobby-tv{ display:block; }
    .lobby-phone{ display:none; }
  }
</style>
</head>
<body class="noir bh-ds" data-game="mafia" data-game-page="mafia-play.html" data-guest-join="true" data-host-plays="false">

<div class="mf-ambient" id="mf-ambient"></div>
<header>
  <div class="wrap nav">
    <a href="bahjah-landing.html" style="display:flex;"><img class="brand-logo" src="assets/logos/bahjah-wordmark.png?v=20260823" alt="Bahjah"></a>
    <div class="nav-right">
      <div class="switch">
        <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
        <span class="sep">/</span>
        <button id="btn-ar" onclick="setLang('ar')">ع</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap back-row">
  <a href="bahjah-landing.html" class="back-icon-btn" aria-label="Back to lobby">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="sr-only lang-fade" data-en="Back to lobby" data-ar="العودة إلى الردهة">Back to lobby</span>
  </a>
</div>

<div id="lobby-gate">
  <div>
    <div class="kicker">MAFIA</div>
    <p id="lobby-gate-message" style="margin-top:10px; font-size:16px; color:var(--text-muted);">Connecting…</p>
    <div id="guest-entry">
      <div class="kicker lang-fade" data-en="Mafia" data-ar="مافيا">Mafia</div>
      <h2 class="lang-fade" data-en="Join as a guest" data-ar="انضم كضيف" style="margin-top:8px; font-size:22px;">Join as a guest</h2>
      <div id="guest-avatar" role="button" aria-label="Change avatar"></div>
      <span class="avatar-hint lang-fade" data-en="Tap to pick an avatar" data-ar="اضغط لاختيار صورة رمزية">Tap to pick an avatar</span>
      <input type="text" id="guest-nickname" maxlength="24" class="lang-fade" data-en-ph="Your name" data-ar-ph="اسمك" placeholder="Your name">
      <div class="cfg-error" id="guest-error"></div>
      <button type="button" class="bh-btn bh-btn--hot bh-btn--md" id="guest-join-btn" style="width:100%;">
        <span class="lang-fade" data-en="Join game" data-ar="انضم إلى اللعبة">Join game</span>
      </button>
      <a href="#" id="guest-signin-link" class="back-link lang-fade" data-en="Have an account? Sign in instead" data-ar="لديك حساب؟ سجّل الدخول بدلاً من ذلك">Have an account? Sign in instead</a>
    </div>
  </div>
</div>

<div id="lobby-main" class="wrap">
  <!-- Timers/mafia-count/tie-rule/role config (host only). Sits beside
       .lobby-tv in a 2-column grid on desktop (config-box + host-grid CSS)
       so the host never has to scroll to reach Start; on narrow viewports
       .host-grid collapses to a single column above the separate
       .lobby-phone section below, unaffected by this grid. -->
  <div class="host-grid">
  <div id="mafia-config-panel" class="config-box" style="display:none;"></div>
  <div id="mafia-config-readonly" class="config-box" style="display:none; font-size:13px; color:var(--text-muted); text-align:center;"></div>

  <!-- Big screen / TV layout -->
  <section class="lobby-tv">
    <div class="tv-hero">
      <div class="kicker lang-fade" data-en="Mafia Lobby" data-ar="ردهة مافيا">Mafia Lobby</div>
      <div class="tv-code-row">
        <div class="room-code-text tv-code">----</div>
        <img id="room-qr" class="tv-qr" width="96" height="96" alt="Scan to join">
      </div>
      <p class="lang-fade" data-en="Scan the code or share the room code to invite players." data-ar="امسح الرمز أو شارك رمز الغرفة لدعوة اللاعبين." style="color:var(--text-muted); margin-top:8px; font-size:13px;">Scan the code or share the room code to invite players.</p>
    </div>
    <p class="host-banner"></p>
    <div id="tv-players" class="tv-players"></div>
    <div class="tv-footer">
      <button class="bh-btn bh-btn--hot bh-btn--lg start-btn lang-fade" data-en="Start game" data-ar="ابدأ اللعبة">Start game</button>
      <span class="waiting-label"></span>
    </div>
  </section>
  </div>

  <!-- Phone / controller layout -->
  <section class="lobby-phone">
    <div class="phone-code-badge"><span class="lang-fade" data-en="Room" data-ar="الغرفة">Room</span> <span class="room-code-text">----</span></div>
    <div class="phone-avatar-row">
      <div id="phone-avatar" role="button" aria-label="Change avatar"></div>
      <span class="avatar-hint lang-fade" data-en="Tap to change" data-ar="اضغط للتغيير">Tap to change</span>
      <span id="phone-name" style="margin-top:4px;"></span>
    </div>
    <button class="ready-btn"></button>
    <p class="host-banner"></p>
    <div class="phone-players-label lang-fade" data-en="Players" data-ar="اللاعبون"><span class="player-count"></span></div>
    <div id="phone-players" class="phone-players"></div>
    <div class="phone-actions">
      <button class="bh-btn bh-btn--hot bh-btn--md start-btn lang-fade" data-en="Start game" data-ar="ابدأ اللعبة">Start game</button>
      <span class="waiting-label" style="text-align:center;"></span>
      <button id="copy-link-btn" class="lang-fade" data-en="Copy invite link" data-ar="انسخ رابط الدعوة">Copy invite link</button>
    </div>
  </section>
</div>

<!-- The host's big screen for the whole match. Hidden until the room
     starts; mafia-host-console.js owns everything inside it. -->
<div id="host-console" class="wrap"></div>

<script src="assets/session.js"></script>
<script src="assets/theme-toggle.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="assets/arcade-avatars.js"></script>
<script src="assets/avatars.js"></script>
<script src="assets/avatar-picker.js"></script>
<script src="assets/timer-bar.js"></script>
<script src="assets/mafia-identity.js"></script>
<script src="assets/mafia-ambient.js"></script>
<script src="assets/mafia-tutorial.js"></script>
<script src="assets/lobby-room.js"></script>
<script src="assets/mafia-lobby-config.js"></script>
<script src="assets/mafia-host-console.js"></script>
<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
  });
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function setLang(next){
  if(next === lang) return;
  const els = document.querySelectorAll('.lang-fade');
  els.forEach(el => el.classList.add('fading'));
  setTimeout(() => {
    lang = next;
    applyLang();
    els.forEach(el => el.classList.remove('fading'));
    localStorage.setItem('bahjah_lang', lang);
  }, 180);
}

applyLang();
document.documentElement.style.visibility = '';
if(window.BahjahMafiaTutorial) BahjahMafiaTutorial.maybeAutoOpen();
</script>
</body>
</html>
