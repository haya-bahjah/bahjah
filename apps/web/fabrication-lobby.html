<!-- Bump the ?v= token on every edit to assets/fabrication-theme.css: phones
     hold the old stylesheet otherwise and the change never shows up. -->
<link rel="stylesheet" href="assets/fabrication-theme.css?v=20261019">
<style>
  /* One page, three faces. The gate (joining, and a guest's name) and the
     phone lobby are phone pages; the host's screen on anything wide is the
     television, drawn on the 1280 x 720 stage. body.is-tv picks the last. */
  #lobby-main{ display:none; }
  .lobby-tv{ display:none; }
  body.is-tv .lobby-phone{ display:none; }
  body.is-tv .lobby-tv{ display:block; }
  #host-console{ display:none; }
  [hidden]{ display:none !important; }

  /* -- The phone pages: one column, 24/18 padding, like the wireframes -- */
  .phone-page{ max-width:440px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; gap:18px; padding:20px 18px calc(28px + env(safe-area-inset-bottom)); }
  .phone-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .phone-top a{ display:flex; text-decoration:none; color:var(--ink); }
  .phone-top .fab-logo{ height:40px; width:auto; }
  .lang-btn{ min-height:36px; padding:2px 14px; border:2px solid var(--ink); border-radius:999px; background:var(--white); color:var(--ink); font-size:13px; font-weight:800; cursor:pointer; }
  .phone-title{ font-size:30px; font-weight:900; line-height:1.1; }
  .phone-stack{ display:flex; flex-direction:column; gap:12px; }
  .phone-rule{ height:2px; background:var(--rule); margin-block:4px; }
  .phone-bottom{ margin-top:auto; display:flex; flex-direction:column; gap:10px; align-items:stretch; }
  .phone-bottom .fab-link{ align-self:center; }

  /* -- The gate (lobby-room.js shows #guest-entry with display:block) -- */
  #lobby-gate{ display:block; }
  #lobby-gate > .phone-page{ width:100%; }
  #lobby-gate-message{ font-size:15px; font-weight:700; color:var(--ink-soft); }
  #lobby-gate-message[data-tone="error"]{ color:var(--red); }
  #guest-entry{ display:none; }
  #guest-entry[style*="block"]{ display:flex !important; flex-direction:column; gap:12px; }
  #guest-error{ color:var(--red); font-size:14px; font-weight:700; min-height:0; }
  #guest-error:empty{ display:none; }

  /* -- Phone lobby -- */
  .fab .in-card{ padding:18px; gap:6px; flex-direction:column; align-items:flex-start; justify-content:flex-start; box-shadow:var(--fab-shadow); }
  .in-card b{ font-size:22px; font-weight:900; line-height:1.15; }
  .in-card span{ font-size:14px; font-weight:600; }
  .me-row{ display:flex; align-items:center; gap:12px; }
  #phone-avatar{ width:48px; height:48px; border-radius:50%; overflow:hidden; border:3px solid var(--ink); cursor:pointer; flex:none; }
  #phone-avatar svg, #phone-avatar img{ width:100%; height:100%; display:block; }
  #phone-name{ background:none; border:none; padding:0; font-size:18px; font-weight:800; color:var(--ink); text-align:start; }
  #phone-name-input{ width:100%; font-size:18px; font-weight:800; padding:6px 10px; border:3px solid var(--ink); border-radius:var(--fab-radius-flip); }
  .me-row small{ display:block; font-size:12px; color:var(--ink-mute); font-weight:600; }

  /* The roster lobby-room.js draws (.lp cards), as the design's waiting chips:
     blue pills, one per player who is in. */
  #phone-players{ display:flex; flex-wrap:wrap; gap:8px; }
  .fab #phone-players .lp{ flex-direction:row; width:auto; gap:6px; padding:4px 12px 4px 4px; padding-inline:4px 12px; border:2px solid var(--blue); background:var(--blue); color:var(--white); border-radius:999px; }
  .fab #phone-players .lp-avatar{ width:24px; height:24px; border-radius:50%; overflow:hidden; background:var(--white); }
  .fab #phone-players .lp-name{ font-size:13px; font-weight:700; color:var(--white); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fab #phone-players .lp-ready, .fab #phone-players .lp-offline{ display:none; }
  .fab #phone-players .lp.is-offline{ opacity:.5; }
  .fab .players-empty-note{ font-size:14px; font-weight:600; color:var(--ink-mute); }

  .fab .lobby-notice{ color:var(--red) !important; text-align:center; max-width:none !important; }
  .fab .room-code-plain{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .fab .start-btn[style*="inline-block"]{ display:flex !important; }

  /* Settings (assets/fabrication-lobby-config.js) */
  .cfg-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; }
  .cfg-group{ display:flex; flex-direction:column; gap:10px; }
  .cfg-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .cfg-pool{ font-size:13px; font-weight:600; color:var(--ink-mute); }
  .cfg-lang{ font-size:15px; font-weight:700; }
  .fab-config{ display:flex; flex-direction:column; gap:18px; }
  .fab-config-readonly{ display:flex; flex-direction:column; gap:4px; }
  .cfg-readonly-line{ font-size:15px; font-weight:700; }
  .lobby-phone .cfg-grid{ grid-template-columns:1fr; gap:18px; }
  .lobby-phone .fab-estimate{ font-size:14px; font-weight:700; color:var(--ink-soft); text-align:center; }
  .lobby-phone .fab-estimate:empty{ display:none; }

  /* -- The television lobby (03, TV) -- */
  .tvl{ display:grid; grid-template-columns:420px 1fr; height:100%; }
  .tvl-rail{ position:relative; background:var(--ink); color:var(--paper); padding:36px 32px; overflow:hidden; }
  .tvl-rail::before{ content:""; position:absolute; inset:0; background:var(--fab-halftone-dark); }
  .tvl-rail-in{ position:relative; display:flex; flex-direction:column; gap:22px; height:100%; }
  .tvl-rail .fab-logo{ width:auto; height:72px; align-self:flex-start; }
  .tvl-code{ display:flex; gap:8px; }
  .tvl-code > span[aria-hidden]{ width:72px; height:88px; display:grid; place-items:center; background:var(--paper); color:var(--ink); border:3px solid var(--paper); border-radius:4px; font-size:52px; font-weight:900; box-shadow:4px 4px 0 var(--red); }
  .tvl-join{ font-size:18px; font-weight:700; }
  .tvl-join b{ color:var(--yellow); }
  #room-qr{ width:150px; height:150px; background:var(--paper); border:3px solid var(--paper); display:block; }
  .tvl-note{ margin-top:auto; font-size:14px; font-weight:600; color:var(--paper-3); }
  .tvl-main{ padding:32px 36px; display:flex; flex-direction:column; gap:20px; min-width:0; }
  .tvl-head{ display:flex; justify-content:space-between; align-items:baseline; }
  .tvl-count{ font-size:14px; font-weight:800; }
  #tv-players{ display:flex; flex-wrap:wrap; gap:10px; }
  .tv-seat{ display:flex; align-items:center; gap:10px; background:var(--white); border:2px solid var(--ink); border-radius:999px; padding:5px; padding-inline-end:16px; box-shadow:var(--fab-shadow-sm); max-width:240px; }
  .tv-seat i{ flex:none; width:34px; height:34px; border-radius:50%; border:2px solid var(--ink); display:grid; place-items:center; font-style:normal; font-weight:900; font-size:15px; }
  .tv-seat b{ font-size:16px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tv-seat.is-offline{ opacity:.45; }
  .tv-seat-wait{ display:flex; align-items:center; border:2px dashed var(--ink-mute); border-radius:999px; padding:0 18px; height:48px; font-size:15px; font-weight:700; color:var(--ink-mute); }
  .tvl-rule{ height:2px; background:var(--rule); }
  .tvl-foot{ margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .tvl-foot .fab-estimate{ font-size:15px; font-weight:700; color:var(--ink-soft); }
  .tvl-foot-r{ display:flex; flex-direction:column; align-items:flex-end; }

  /* -- How to play: three swipeable cards over the phone lobby (02) -- */
  .onb{ position:fixed; inset:0; z-index:40; background:var(--paper); display:flex; flex-direction:column; }
  .onb-track{ flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .onb-track::-webkit-scrollbar{ display:none; }
  .onb-card{ width:100%; display:flex; flex-direction:column; max-width:440px; margin:0 auto; padding:18px 4px 0; }
  .onb-card-wrap{ flex:0 0 100%; scroll-snap-align:center; display:flex; justify-content:center; }
  .onb-head{ padding:0 20px; display:flex; justify-content:space-between; align-items:center; }
  .onb-art{ flex:1; margin:18px; min-height:200px; box-shadow:var(--fab-shadow); }
  .onb-copy{ padding:0 22px 8px; display:flex; flex-direction:column; gap:8px; }
  .onb-copy h2{ font-size:30px; font-weight:900; line-height:1.1; }
  .onb-copy p{ font-size:15px; font-weight:600; color:var(--ink-soft); }
  .onb-pts{ align-self:flex-start; background:var(--yellow); border:2px solid var(--ink); font-weight:900; font-size:15px; padding:2px 10px; border-radius:4px; }
  .onb-foot{ max-width:440px; width:100%; margin:0 auto; padding:16px 22px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; }
  .onb-dots{ display:flex; gap:6px; justify-content:center; }
  .onb-dots span{ width:8px; height:8px; border-radius:8px; background:var(--ink); opacity:.25; transition:width .12s; }
  .onb-dots span.is-on{ width:24px; opacity:1; }
</style>
</head>

<script>
// Before lobby-room.js: the big-screen roster is the design's pill chips --
// an initial on a coloured disc and the name -- with a dashed slot for the
// seats still open.
window.BahjahLobbySeats = {
  render(el, members) {
    const colours = ['var(--yellow)', 'var(--red)', 'var(--blue)', 'var(--paper-2)', 'var(--white)'];
    const onDark = [false, true, true, false, false];
    const seats = members.map((m, i) => {
      const k = i % colours.length;
      const initial = (m.displayName || '?').trim().charAt(0).toUpperCase();
      return `<div class="tv-seat${m.connected ? '' : ' is-offline'}"><i style="background:${colours[k]};color:${onDark[k] ? 'var(--white)' : 'var(--ink)'}">${FabUI.esc(initial)}</i><b>${FabUI.esc(m.displayName)}</b></div>`;
    });
    if (members.length < 10) seats.push(`<div class="tv-seat-wait">${FabUI.t('Waiting for more…', 'بانتظار المزيد…')}</div>`);
    el.innerHTML = seats.join('');
  },
};
</script>

<script>
let lang = document.documentElement.getAttribute('lang') === 'ar' ? 'ar' : 'en';
const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase();
const U = window.FabUI;

function applyLang(){
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.documentElement.setAttribute('lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => { b.textContent = lang === 'ar' ? 'EN' : 'ع'; });
  document.querySelectorAll('.lang-fade').forEach(el => {
    const val = el.getAttribute('data-' + lang);
    if(val !== null) el.textContent = val;
    const ph = el.getAttribute('data-' + lang + '-ph');
    if(ph !== null) el.setAttribute('placeholder', ph);
  });
  document.querySelectorAll('[data-logo]').forEach(img => { img.src = U.logoSrc(img.dataset.logo); img.alt = U.t('Fabrication', 'فبركة'); });
  paintLobby();
  if (!document.getElementById('onb').hidden) paintOnboarding();
  document.dispatchEvent(new Event('bahjah:lang-change'));
}

function toggleLang(){
  lang = lang === 'ar' ? 'en' : 'ar';
  // Once someone picks a language by hand, the game stops switching it for
  // them (see FabUI.adoptGameLang). The host's own pick in the lobby is what
  // sets the game's language, so it does not count there.
  if (document.body.classList.contains('is-live') || document.getElementById('host-console')?.style.display === 'block') window.__fabPickedLang = true;
  applyLang();
  localStorage.setItem('bahjah_lang', lang);
}

// The game is played in one language; when it starts, this screen follows.
window.fabUseLang = (next) => {
  if (next === lang) return;
  lang = next;
  applyLang();
};

// The room code from the link, in the code box on the join page. Typing a
// different code and pressing Join goes to that room instead.
const gateCode = document.getElementById('gate-code');
gateCode.value = code;
document.addEventListener('click', (e) => {
  if (!e.target.closest('#guest-join-btn')) return;
  const typed = gateCode.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  if (typed && typed !== code) {
    e.stopPropagation();
    location.href = `fabrication-lobby.html?code=${encodeURIComponent(typed)}`;
  }
}, true);

let lobby = null;
document.addEventListener('bahjah:lobby-update', (e) => {
  lobby = e.detail || null;
  paintLobby();
  maybeShowOnboarding();
});

function paintLobby(){
  if (!lobby || !lobby.room) return;
  const room = lobby.room;
  const players = room.members.filter((m) => !m.isHost);
  // The host's own screen, when it is wide enough to be a television.
  const tv = Boolean(lobby.isPassiveScreen) && window.innerWidth >= 900;
  // Once the game starts the host console owns the screen (and is-tv).
  if (room.status !== 'lobby') return;
  document.body.classList.toggle('is-tv', tv);
  if (tv) U.fitTv(document.getElementById('tv-stage'));

  document.getElementById('tv-count').textContent = `${U.num(players.length)} / ${U.num(10)}`;
  document.getElementById('tv-link').textContent = `${location.host}/j/${room.code}`;
  document.getElementById('phone-count').textContent = U.count(players.length, 'player');

  // A host holding the room on a phone runs it from here: no "You're in"
  // card and no name of their own, since they do not play.
  const host = Boolean(lobby.isPassiveScreen);
  document.getElementById('phone-in').hidden = host;
  document.getElementById('phone-me').hidden = host;
  document.getElementById('phone-estimate').hidden = !host;

  const meId = lobby.me && lobby.me.id;
  document.querySelectorAll('#phone-players .lp').forEach((card) => {
    const member = players.find((p) => p.userId === card.dataset.userId);
    card.classList.toggle('is-offline', !(member && member.connected));
    if (card.dataset.userId === meId) card.querySelector('.lp-name').textContent = U.t('You', 'أنت');
  });
}

window.addEventListener('resize', paintLobby);

// --- How to play (02) ------------------------------------------------------
const ONBOARD = [
  { bg:'blue', cutout:'vintage TV set',
    en:{ t:'Read the fact.', d:'A weird-but-true question appears on the TV. The answer stays hidden.', pts:'—' },
    ar:{ t:'اقرأ المعلومة.', d:'سؤال غريب لكن حقيقي يظهر على التلفزيون. والإجابة مخفية.', pts:'—' } },
  { bg:'red', cutout:'mouth whispering',
    en:{ t:'Write your lie.', d:'Type an answer that sounds real. Not the real one — we\'ll know.', pts:'+2 per player fooled' },
    ar:{ t:'اكتب كذبتك.', d:'اكتب إجابة تبدو حقيقية. ليست الحقيقية — سنعرف.', pts:'+٢ عن كل لاعب تخدعه' } },
  { bg:'yellow', cutout:'magnifying glass',
    en:{ t:'Find the truth.', d:'Pick the real answer from everyone\'s lies. You can\'t vote for your own.', pts:'+2 for the truth' },
    ar:{ t:'اكشف الحقيقة.', d:'اختر الإجابة الحقيقية من بين الأكاذيب. لا يمكنك التصويت لكذبتك.', pts:'+٢ للحقيقة' } },
];
const onb = document.getElementById('onb');
const track = document.getElementById('onb-track');
let onbIndex = 0;

function paintOnboarding(){
  track.innerHTML = ONBOARD.map((card, i) => {
    const c = card[lang];
    return `
      <div class="onb-card-wrap"><div class="onb-card">
        <div class="onb-head">
          <span class="fab-kicker">${U.t(`${i + 1} of 3`, `${U.num(i + 1)} من ${U.num(3)}`)}</span>
          <button type="button" class="fab-link" onclick="closeOnboarding()">${U.t('Skip', 'تخطٍّ')}</button>
        </div>
        <div class="onb-art fab-accent fab-accent--${card.bg}"><span class="fab-cutout" data-cutout="${card.cutout}"></span></div>
        <div class="onb-copy">
          <h2>${U.esc(c.t)}</h2>
          <p>${U.esc(c.d)}</p>
          <span class="onb-pts">${U.esc(c.pts)}</span>
        </div>
      </div></div>`;
  }).join('');
  goToCard(onbIndex, false);
}

function goToCard(i, smooth){
  onbIndex = Math.max(0, Math.min(ONBOARD.length - 1, i));
  const w = track.clientWidth;
  // Scroll offsets run negative in a right-to-left scroller.
  track.scrollTo({ left: (lang === 'ar' ? -1 : 1) * onbIndex * w, behavior: smooth ? 'smooth' : 'auto' });
  paintOnbFoot();
}

function paintOnbFoot(){
  document.querySelectorAll('#onb-dots span').forEach((d, k) => d.classList.toggle('is-on', k === onbIndex));
  document.getElementById('onb-next').textContent = onbIndex === ONBOARD.length - 1 ? U.t('Got it', 'فهمت') : U.t('Next', 'التالي');
}

track.addEventListener('scroll', () => {
  const w = track.clientWidth || 1;
  const i = Math.round(Math.abs(track.scrollLeft) / w);
  if (i !== onbIndex) { onbIndex = i; paintOnbFoot(); }
}, { passive: true });

document.getElementById('onb-next').addEventListener('click', () => {
  if (onbIndex >= ONBOARD.length - 1) closeOnboarding();
  else goToCard(onbIndex + 1, true);
});

function openOnboarding(){
  onbIndex = 0;
  onb.hidden = false;
  paintOnboarding();
}
function closeOnboarding(){ onb.hidden = true; }

// Shown once per room to a player who has just joined, while the lobby fills.
function maybeShowOnboarding(){
  if (!lobby || !lobby.room || lobby.room.status !== 'lobby' || lobby.isPassiveScreen) return;
  const key = `fab_onboarded_${code}`;
  try {
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, '1');
  } catch { return; }
  openOnboarding();
}

applyLang();
// prefs-boot.js hides the document before first paint when the saved
// language is not English; the page hands visibility back once its own text
// has been swapped. Without this the page stays blank for every returning
// Arabic reader (see scripts/check-page-visibility.js).
document.documentElement.style.visibility = '';
</script>
